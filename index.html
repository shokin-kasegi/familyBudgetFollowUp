}

// Remise à zéro forcée, une fois pour tous les appareils : si l'appareil n'a
// pas encore vu cette version de remise à zéro, on efface tout son stockage
// local avant même de charger quoi que ce soit — peu importe ce qu'il avait
// avant (compte créé localement, jamais synchronisé...). Incrémenter
// FORCE_RESET_VERSION déclenche une nouvelle purge générale sur tous les
// appareils, à utiliser uniquement en cas de besoin exceptionnel.
const FORCE_RESET_VERSION = 2;
function applyForceResetIfNeeded(){
  let seen = 0;
  try{ seen = Number(localStorage.getItem('force_reset_version')||0); }catch(e){}
  if(seen < FORCE_RESET_VERSION){
    try{
      localStorage.removeItem('budget_store');
      localStorage.removeItem('budget_auth');
      localStorage.removeItem('budget_social');
      localStorage.removeItem('github_sync_config');
      localStorage.removeItem('budget_session');
      localStorage.removeItem('budget_session_remember');
      sessionStorage.removeItem('budget_session');
      localStorage.setItem('force_reset_version', String(FORCE_RESET_VERSION));
    }catch(e){}
  }
}
async function loadState(){
  applyForceResetIfNeeded();
  let needsPersist = false, needsPersistAuth = false, needsPersistSocial = false;

  // Données du budget (partagées)
  try{
    const raw = localStorage.getItem('budget_store');
    if(raw){ state = JSON.parse(raw); } else { state = defaultState(); needsPersist = true; }
  }catch(e){ state = defaultState(); needsPersist = true; }

  // Données de connexion (comptes) — fichier séparé, propre à l'authentification
  try{
    const rawAuth = localStorage.getItem('budget_auth');
    if(rawAuth){ authState = JSON.parse(rawAuth); }
    else if(state.users){ authState = { users: state.users }; delete state.users; needsPersist = true; needsPersistAuth = true; }
    else{ authState = defaultAuth(); needsPersistAuth = true; }
    if(authState.setupCodeUsed===undefined){ authState.setupCodeUsed = authState.users.length>0; needsPersistAuth = true; }
  }catch(e){ authState = defaultAuth(); needsPersistAuth = true; }

  // Données sociales (demandes de compte joint, messages) — fichier séparé aussi
  try{
    const rawSocial = localStorage.getItem('budget_social');
    socialState = rawSocial ? JSON.parse(rawSocial) : defaultSocial();
    if(!socialState.accountRequests){ socialState.accountRequests = []; needsPersistSocial = true; }
    if(!socialState.expenseDeleteRequests){ socialState.expenseDeleteRequests = []; needsPersistSocial = true; }
    if(!socialState.accountCreationRequests){ socialState.accountCreationRequests = []; needsPersistSocial = true; }
    if(!rawSocial) needsPersistSocial = true;
  }catch(e){ socialState = defaultSocial(); needsPersistSocial = true; }

  // Migration : d'anciennes saisies (avant la séparation par utilisateur) n'ont pas
  // de propriétaire. On les attribue au premier compte admin pour ne rien perdre.
  const firstAdmin = authState.users.find(u=>u.role==='admin');
  if(firstAdmin){
    OWNED_ARRAYS.forEach(key=>{
      (state[key]||[]).forEach(item=>{ if(!item.ownerId){ item.ownerId = firstAdmin.id; needsPersist = true; } });
    });
  }

  // Migration : l'ancien modèle "Échéances" (saisie manuelle séparée) devient une
  // dépense "Échelonnée" dans le nouvel onglet Dépenses, calculée automatiquement.
  if(Array.isArray(state.echeances) && state.echeances.length>0){
    if(!state.depenses) state.depenses = [];
    state.echeances.forEach(e=>{
      const nb = e.nbMensualites||1;
      const [y,m,d] = (e.premierPaiement||'').split('-').map(Number);
      let dateFin = e.premierPaiement;
      if(y && m && d){
        const endMonthIndex = (m-1) + (nb-1);
        const daysInEnd = new Date(y, endMonthIndex+1, 0).getDate();
        const endDate = new Date(y, endMonthIndex, Math.min(d, daysInEnd));
        dateFin = `${endDate.getFullYear()}-${String(endDate.getMonth()+1).padStart(2,'0')}-${String(endDate.getDate()).padStart(2,'0')}`;
      }
      state.depenses.push({
        id: e.id, ownerId: e.ownerId, libelle: e.achat, categorie:'Achat', compte: e.compte||'Compte Perso',
        montant: e.montantTotal, modePaiement:'Echelonne', dateDebut: e.premierPaiement, dateFin, mensualitesPayees: 0, notes:''
      });
    });
    delete state.echeances;
    needsPersist = true;
  }

  // Migration : l'ancien tableau "Abonnements" séparé devient une dépense
  // "Récurrente" dans le même onglet Dépenses (un abonnement reste une dépense,
  // juste avec une fréquence et un statut).
  if(Array.isArray(state.abonnements) && state.abonnements.length>0){
    if(!state.depenses) state.depenses = [];
    state.abonnements.forEach(a=>{
      state.depenses.push({
        id: a.id, ownerId: a.ownerId, libelle: a.nom, categorie: a.categorie, compte: a.compte||'Compte Perso',
        montant: a.montant, modePaiement:'Recurrent', frequence: a.frequence||'Mensuel',
        statut: a.statut||'Actif', notes: a.notes||''
      });
    });
    delete state.abonnements;
    needsPersist = true;
  }

  // Migration : l'ancien navOrder (tableau plat, un seul espace) devient un objet
  // par espace, suite à la séparation Finance / Groupes.
  if(Array.isArray(state.navOrder)){
    state.navOrder = { finance: state.navOrder.filter(id=>id!=='parametres') };
    needsPersist = true;
  }

  // Migration : les dépenses échelonnées de l'ancien modèle (dateFin saisie,
  // progression via mensualitesPayees) passent au nouveau modèle (nbMensualites
  // calculée automatiquement, mensualités considérées payées par défaut au fil
  // du temps). Aucune donnée n'est perdue : le nombre de mensualités est
  // recalculé à l'identique à partir de l'ancien couple dateDebut/dateFin.
  if(Array.isArray(state.depenses)){
    let echMigrated = false;
    state.depenses.forEach(d=>{
      if(d.modePaiement==='Echelonne' && d.dateFin!==undefined && d.nbMensualites===undefined){
        const [y0,m0] = (d.dateDebut||'').split('-').map(Number);
        const [y1,m1] = (d.dateFin||'').split('-').map(Number);
        d.nbMensualites = (y0 && y1) ? Math.max((y1-y0)*12 + (m1-m0) + 1, 1) : 1;
        d.moisRetires = [];
        delete d.dateFin;
        delete d.mensualitesPayees;
        echMigrated = true;
      }
    });
    if(echMigrated) needsPersist = true;
  }

  // Migration : les revenus exceptionnels négatifs (ancien "bricolage" pour noter une
  // dépense ponctuelle, avant l'existence de l'onglet Dépenses) deviennent de vraies
  // dépenses "En une fois", avec un montant positif comme il se doit.
  if(Array.isArray(state.revenusExceptionnels)){
    const negatifs = state.revenusExceptionnels.filter(r=>Number(r.montant)<0);
    if(negatifs.length>0){
      if(!state.depenses) state.depenses = [];
      negatifs.forEach(r=>{
        state.depenses.push({
          id: r.id, ownerId: r.ownerId, libelle: r.libelle, categorie: r.categorie==='Autre' ? 'Imprévu' : r.categorie,
          compte: 'Compte Perso', montant: Math.abs(Number(r.montant)), modePaiement:'Unique', date: r.date, notes:''
        });
      });
      state.revenusExceptionnels = state.revenusExceptionnels.filter(r=>Number(r.montant)>=0);
      needsPersist = true;
    }
  }

  // Migration : même bricolage possible sur les revenus RÉCURRENTS négatifs —
  // l'équivalent logique est une charge récurrente (Fixe), pas une dépense ponctuelle.
  if(Array.isArray(state.revenusRecurrents)){
    const negatifsRec = state.revenusRecurrents.filter(r=>Number(r.montant)<0);
    if(negatifsRec.length>0){
      if(!state.charges) state.charges = [];
      negatifsRec.forEach(r=>{
        state.charges.push({
          id: r.id, ownerId: r.ownerId, categorie: r.libelle, type:'Fixe',
          description: r.categorie==='Autre' ? '' : r.categorie, budget: Math.abs(Number(r.montant)),
          compte:'Compte Perso', dateDebut: r.dateDebut||null, dateFin: r.dateFin||null, notes:''
        });
      });
      state.revenusRecurrents = state.revenusRecurrents.filter(r=>Number(r.montant)>=0);
      needsPersist = true;
    }
  }

  // Migration : passage d'une liste de catégories de dépenses fixe et partagée à
  // des catégories personnalisables par personne. On initialise chaque compte déjà
  // existant avec l'ancienne liste par défaut (rien ne change pour lui tant qu'il
  // ne la modifie pas), plutôt que de le laisser démarrer sans aucune catégorie.
  if(!Array.isArray(state.categoriesDepenses)){
    state.categoriesDepenses = [];
    authState.users.forEach(u=>{ seedDefaultCategoriesDep(u.id); });
    needsPersist = true;
  }

  // Migration : même principe pour les catégories de revenus, jusque-là une
  // liste fixe (CATS_REV) partagée par tout le monde et non personnalisable.
  if(!Array.isArray(state.categoriesRevenus)){
    state.categoriesRevenus = [];
    authState.users.forEach(u=>{ seedDefaultCategoriesRev(u.id); });
    needsPersist = true;
  }

  // Migration : même principe pour les catégories d'objectifs et de charges,
  // jusque-là des champs texte libre sans liste ni gestion personnalisable.
  if(!Array.isArray(state.categoriesObjectifs)){
    state.categoriesObjectifs = [];
    authState.users.forEach(u=>{ seedDefaultCategoriesObj(u.id); });
    needsPersist = true;
  }
  if(!Array.isArray(state.categoriesCharges)){
    state.categoriesCharges = [];
    authState.users.forEach(u=>{ seedDefaultCategoriesCharges(u.id); });
    needsPersist = true;
  }

  // Migration : les versements des Échéances n'existaient pas encore — les
  // dépenses échelonnées existantes démarrent simplement sans historique
  // (rien à perdre, le "versement exceptionnel" d'avant ne gardait aucune trace).
  if(!Array.isArray(state.echVersements)){
    state.echVersements = [];
    needsPersist = true;
  }
  // Apprentissage de l'import de relevé (formats, commerçants) : vide au départ.
  if(!Array.isArray(state.importApprentissage)){
    state.importApprentissage = [];
    needsPersist = true;
  }

  if(needsPersist) await persist();
  if(needsPersistAuth) await persistAuth();
  if(needsPersistSocial) await persistSocial();
}
const OWNED_ARRAYS = ['revenusRecurrents','revenusExceptionnels','depenses','objectifs','versements','echVersements','charges','categoriesDepenses','categoriesRevenus','categoriesObjectifs','categoriesCharges','importApprentissage'];
function mine(arr){
  const me = currentUser();
  return me ? (arr||[]).filter(e=>e.ownerId===me.id) : [];
}
let saveTimer = null;

      try{
        localStorage.setItem('budget_store', JSON.stringify(state));
        markDirtyForSync();
      }
      catch(e){ console.error('Erreur de sauvegarde locale', e); }
      resolve();
    }, 120);
  });
}

  return new Promise((resolve)=>{
    clearTimeout(saveAuthTimer);

}

/* ============================== HELPERS ============================== */
/* Montants : au centime partout. L'arrondi à l'euro (fmtEUR0) est réservé aux
   phrases de constat et aux cellules de la Vue annuelle sur téléphone.
   Intl insère une espace fine insécable (U+202F) comme séparateur de milliers,
   presque invisible avec certaines polices : on la remplace par une espace
   insécable normale (U+00A0). */
const NF_EUR2 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const NF_EUR0 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const NF_INT = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const sp = s => String(s).replace(/\u202F/g,'\u00A0');
const r2 = x => Math.round((Number(x)||0)*100)/100;
// Somme de montants arrondis chacun au centime : un total se calcule toujours
// depuis les parties telles qu'elles sont affichées.
const sumR2 = (arr, f) => r2((arr||[]).reduce((s,x)=>s+r2(f ? f(x) : x),0));
const fmtEUR = (n) => sp(NF_EUR2.format(r2(n)).replace('-','−'));
const fmtEURPrecise = fmtEUR;
const fmtEUR0 = (n) => sp(NF_EUR0.format(Math.round(Number(n)||0)).replace('-','−'));
// Valeur absente (ancien enregistrement, import incomplet) : un tiret gris, jamais « undefined ».
function dash(v){ return (v===undefined || v===null || (typeof v==='string' && !v.trim())) ? '<span class="nil">—</span>' : esc(v); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return `${MONTH_NAMES[m-1]} ${y}`; }
function monthBounds(key){ const [y,m]=key.split('-').map(Number); return {start:new Date(y,m-1,1), end:new Date(y,m,0)}; }
function addMonths(key, delta){ let [y,m]=key.split('-').map(Number); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return monthKey(y,m); }
// Date par défaut proposée dans les formulaires de saisie ponctuelle : le jour
// même si on est sur le mois en cours, sinon le 1er du mois actuellement
// consulté — pour éviter d'ajouter silencieusement une entrée à la date du
// jour pendant qu'on navigue sur un autre mois, ce qui la rend invisible.
function defaultDateForSelectedMonth(){
  const today = new Date();
  const todayISO = today.toISOString().slice(0,10);
  const key = state.selectedMonth;
  if(!key || key===monthKey(today.getFullYear(), today.getMonth()+1)) return todayISO;
  return `${key}-01`;
}
function inRangeMonth(key, dateDebut, dateFin){
  const {start,end} = monthBounds(key);
  const d0 = dateDebut ? new Date(dateDebut+'T00:00:00') : null;
  const d1 = dateFin ? new Date(dateFin+'T00:00:00') : null;
  if(d0 && d0 > end) return false;
  if(d1 && d1 < start) return false;
  return true;
}
function monthlyCost(ab){
  const m = Number(ab.montant)||0;
  switch(ab.frequence){
    case 'Annuel': return m/12;
    case 'Trimestriel': return m/3;
    case 'Hebdomadaire': return m*4.345;
    case 'Journalier': return m*30.44;
    default: return m;
  }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = icon('check') + '<span></span>';
  t.lastChild.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);

  {k:'fixe',      label:'Abonnements & charges', short:'abonnements & charges', color:'var(--c-fixe)'},
  {k:'achats',    label:'Achats',                short:'achats',                color:'var(--c-achats)'},

];

// Poste d'une dépense : sa couleur la suit dans toutes les vues.

// Couleur d'identité d'une vue : pastille du titre, point de l'onglet actif.

/* ============================== MOUVEMENT ============================== */
/* Le mouvement montre ce qui change d'un mois à l'autre : les chiffres
   défilent depuis la valeur affichée, les barres se redimensionnent, le mois
   glisse dans le sens du déplacement. Rien ne s'anime au clavier ni avec
   « réduire les animations », et aucune animation ne bloque une action. */
const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
let motionInstant = false; // vrai pendant un changement déclenché au clavier
function motionOff(){ return reduceMotion.matches || motionInstant; }
const easeOutQuart = t => 1-Math.pow(1-t,4);
// Dernière valeur affichée par clé : le rendu reconstruit le DOM, le défilement
// repart donc de la valeur visible (y compris en plein milieu d'un défilement).
const tweenValues = new Map();
const tweenFrames = new Map();
function tween(el, key, to, fmt, dur=650){
  if(!el) return;
  cancelAnimationFrame(tweenFrames.get(key));
  const from = tweenValues.has(key) ? tweenValues.get(key) : (motionOff() ? to : 0);
  if(motionOff() || from===to){ el.innerHTML = fmt(to); tweenValues.set(key,to); return; }
  const t0 = performance.now();
  el.innerHTML = fmt(from);
  const step = now => {
    const p = Math.min(1,(now-t0)/dur);
    const v = from + (to-from)*easeOutQuart(p);
    tweenValues.set(key, p<1 ? v : to);
    if(el.isConnected) el.innerHTML = fmt(p<1 ? v : to);
    if(p<1 && el.isConnected) tweenFrames.set(key, requestAnimationFrame(step));
  };
  tweenFrames.set(key, requestAnimationFrame(step));
}
// Grand chiffre : les centimes et le symbole € en exposant.
function bigFmt(v){
  const neg = v < -0.004, a = Math.abs(v), e = Math.floor(a+1e-9), c = Math.round((a-e)*100);
  const ent = c===100 ? e+1 : e, cts = c===100 ? 0 : c;
  return `${neg?'−':''}${sp(NF_INT.format(ent))}<span class="cents">,${String(cts).padStart(2,'0')}\u00A0€</span>`;
}
const pctFmt = x => sp(NF_INT.format(Math.round((Number(x)||0)*100))) + '\u00A0%';
// La phrase de constat s'efface puis réapparaît quand elle change.
const swapMemo = new Map();
function swapText(el, key, html){
  if(!el) return;
  const prev = swapMemo.get(key); swapMemo.set(key, html);
  if(motionOff() || prev===undefined || prev===html){ el.innerHTML = html; return; }
  el.innerHTML = prev; el.classList.add('out');
  setTimeout(()=>{ if(!el.isConnected) return; el.innerHTML = html; el.classList.remove('out'); }, 160);
}
// Transition de vue (fondu + montée) ou de mois (glissement du libellé), si le navigateur sait faire.
async function withTransition(kind, dir, update){
  const root = document.documentElement;
  if(dir) root.style.setProperty('--dir', dir);
  if(!document.startViewTransition || motionOff()){ await update(); return; }
  root.classList.toggle('vt-view', kind==='view');
  try{
    const t = document.startViewTransition(update);
    await t.updateCallbackDone;
    t.finished.finally(()=>root.classList.remove('vt-view'));
  }catch(e){ root.classList.remove('vt-view'); await update(); }
}
async function changeMonth(key, dir){
  if(!key || key===state.selectedMonth) return;
  const d = dir || (key > state.selectedMonth ? 1 : -1);
  state.selectedMonth = key;
  persist();
  await withTransition('month', d, ()=>render());
}
async function navigateTo(view){
  if(view===currentView){ await render(); return; }
  currentView = view;
  if(currentView!=='parametres') currentSpace = spaceOfView(currentView);
  await withTransition('view', 0, ()=>render());
}

// Logo : un anneau à cinq segments, un par couleur de poste.
function markSVG(extraClass){
  const C = 2*Math.PI*11, parts = [.18,.14,.1,.36,.12];
  let off = 0;
  const segs = parts.map((p,i)=>{
    const seg = `<circle cx="15" cy="15" r="11" fill="none" stroke="${POSTES[i].color}" stroke-width="5" stroke-dasharray="${Math.max(0,C*p-2).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 15 15)" style="animation-delay:${i*90}ms"/>`;
    off += C*p; return seg;
  }).join('');
  return `<svg class="mark${extraClass?' '+extraClass:''}" viewBox="0 0 30 30" aria-hidden="true" focusable="false">${segs}</svg>`;
}
// Le logo se dessine segment par segment à la première ouverture de l'écran de connexion.

function monthName(key){ return MONTH_NAMES[Number(key.split('-')[1])-1]; }

/* ============================== COMPUTATIONS ============================== */
function revenusDuMois(key){ return revenusDuMoisForOwner(currentUser().id, key); }
function revenusDuMoisForOwner(ownerId, key){
  let total = 0;
  forOwner(state.revenusRecurrents, ownerId).forEach(r=>{ if(inRangeMonth(key, r.dateDebut, r.dateFin)) total += Number(r.montant)||0; });
  const {start,end} = monthBounds(key);
  forOwner(state.revenusExceptionnels, ownerId).forEach(r=>{
    const d = r.date ? new Date(r.date+'T00:00:00') : null;
    if(d && d>=start && d<=end) total += Number(r.montant)||0;
  });
  return total;
}
function abonnementsActifs(){ return mine(state.depenses).filter(d=>d.modePaiement==='Recurrent' && d.statut==='Actif'); }
function abonnementsTotalMensuel(excludeCompte){
  return sumR2(abonnementsActifs().filter(a=> excludeCompte ? a.compte!==excludeCompte : true), monthlyCost);
}

/* ---- Dépenses : uniques (payées en une fois) ou échelonnées (plusieurs mensualités) ---- */
/* ---- Dépenses échelonnées : nouveau modèle -----------------------------
   dateDebut + nbMensualites (au lieu de dateFin, désormais calculée).
   Par défaut, chaque mensualité est considérée comme payée automatiquement
   au fil du temps — aucune action manuelle requise. Deux actions
   possibles : "retirer" une mensualité d'un mois précis (report — décale
   l'échéance d'un mois de plus), et déclarer un versement exceptionnel
   (réduit le montant restant, donc les mensualités suivantes). */
function depenseDateFin(dep){
  if(dep.modePaiement!=='Echelonne' || !dep.dateDebut) return dep.dateDebut||null;
  const [y,m,d] = dep.dateDebut.split('-').map(Number);
  const nb = dep.nbMensualites||1;
  const endIndex = (m-1) + (nb-1);
  const endY = y + Math.floor(endIndex/12);
  const endM = (endIndex%12)+1;
  const daysInEnd = new Date(endY, endM, 0).getDate();
  return `${endY}-${String(endM).padStart(2,'0')}-${String(Math.min(d,daysInEnd)).padStart(2,'0')}`;
}
function depenseNbMensualites(dep){
  return (dep.modePaiement==='Echelonne') ? Math.max(dep.nbMensualites||1, 1) : 1;
}
function depenseMensualite(dep){
  return dep.modePaiement==='Echelonne' ? depenseResteAPayerReel(dep)/depenseNbMensualites(dep) : (Number(dep.montant)||0);
}
function depenseMensualiteDuMois(dep, key){
  if(dep.modePaiement==='Echelonne'){
    if(!dep.dateDebut) return 0;
    if((dep.moisRetires||[]).includes(key)) return 0; // mensualité retirée/reportée ce mois-là
    const dateFin = depenseDateFin(dep);
    return inRangeMonth(key, dep.dateDebut, dateFin) ? depenseMensualite(dep) : 0;
  }
  if(dep.modePaiement==='Recurrent'){
    return dep.statut==='Actif' ? monthlyCost(dep) : 0;
  }
  if(dep.modePaiement==='Previsionnelle') return 0;
  if(!dep.date) return 0;
  return dep.date.slice(0,7)===key ? (Number(dep.montant)||0) : 0;
}
/* Deux notions distinctes de "reste à payer", pour ne jamais confondre
   "ce qu'il est prévu qu'il te reste" et "ce que tu dois vraiment encore" :
   - RÉEL : ce que tu dois vraiment, ne bouge qu'avec un versement
     exceptionnel déclaré (le montant lui-même EST le réel, un retrait
     de mensualité ne change rien à ce que tu dois réellement, juste à
     quand tu le payes).
   - PRÉVISIONNEL : ce qu'il resterait, selon le planning, en te plaçant
     au mois consulté — même si ce mois n'est pas encore passé et même
     si tu n'as rien saisi. Ex. 4x 400€ à partir d'octobre : vu depuis
     novembre, le prévisionnel affiche 300€ (une mensualité "consommée"
     par le planning), qu'on ait payé ou non. */
function echeanceVerseTotal(dep){
  return mine(state.echVersements).filter(v=>v.echeanceId===dep.id).reduce((s,v)=>s+(Number(v.montant)||0),0);
}
function depenseResteAPayerReel(dep){
  return dep.modePaiement==='Echelonne' ? Math.max((Number(dep.montant)||0) - echeanceVerseTotal(dep), 0) : 0;
}
function depenseResteAPayerPrevisionnel(dep, key){
  if(dep.modePaiement!=='Echelonne' || !dep.dateDebut) return 0;
  const [y0,m0] = dep.dateDebut.split('-').map(Number);
  const [ky,km] = key.split('-').map(Number);
  const idx = (ky-y0)*12 + (km-m0); // index du mois consulté dans le planning (0 = mois de dateDebut)
  const nb = depenseNbMensualites(dep);
  const moisEcoules = Math.max(Math.min(idx, nb), 0); // mensualités déjà "consommées" par le planning AVANT ce mois
  return Math.max((Number(dep.montant)||0) - moisEcoules*depenseMensualite(dep), 0);
}
function depensesTotalMois(key, excludeCompte, mode){
  return sumR2(mine(state.depenses).filter(d=> d.modePaiement!=='Recurrent' && (!mode || d.modePaiement===mode) && (excludeCompte ? d.compte!==excludeCompte : true)), d=>depenseMensualiteDuMois(d,key));
}
/* Échéancier : mensualités échues jusqu'au mois consulté (inclus), d'après le
   planning (une mensualité est considérée payée automatiquement le mois où elle
   tombe ; un mois retiré ne compte pas). Le reste à payer en découle :
   « 3/6 payées » et un reste égal au total ne peuvent plus coexister. */
function echeanceMoisEchus(dep, key){
  if(dep.modePaiement!=='Echelonne' || !dep.dateDebut) return [];
  const out = [];
  for(let k = dep.dateDebut.slice(0,7); k<=key; k = addMonths(k,1)){
    if(depenseMensualiteDuMois(dep,k)>0) out.push(k);
    if(out.length>=depenseNbMensualites(dep)) break;
  }
  return out;
}
function echeanceNbVersementsPrevus(dep){ return Math.max(depenseNbMensualites(dep) - (dep.moisRetires||[]).length, 1); }
function echeanceResteAPayer(dep, key){
  const paye = sumR2(echeanceMoisEchus(dep, key), k=>depenseMensualiteDuMois(dep,k));
  return Math.max(r2(depenseResteAPayerReel(dep) - paye), 0);
}
function echeanceProchaine(dep, key){
  const fin = depenseDateFin(dep).slice(0,7);
  for(let k = addMonths(key,1); k<=fin; k = addMonths(k,1)){
    if(depenseMensualiteDuMois(dep,k)>0) return `${k}-${dep.dateDebut.slice(8,10)}`;
  }
  return null;
}
function depensesEchelonneesResteAPayerTotal(key){
  return mine(state.depenses).filter(d=>d.modePaiement==='Echelonne').reduce((s,d)=>s+depenseResteAPayerReel(d),0);
}

function chargesActivesMois(key, excludeCompte){
  return mine(state.charges).filter(c=> inRangeMonth(key, c.dateDebut, c.dateFin) && (excludeCompte ? c.compte!==excludeCompte : true));
}
function chargesTotalMois(key, excludeCompte){ return sumR2(chargesActivesMois(key, excludeCompte), c=>c.budget); }

function objectifVerse(obj){ return mine(state.versements).filter(v=>v.objectifNom===obj.nom).reduce((s,v)=>s+(Number(v.montant)||0),0); }
function objectifMoisRestants(obj){
  if(!obj.dateDebut || !obj.dateFin) return 1;
  const [y0,m0] = obj.dateDebut.split('-').map(Number);
  const [y1,m1] = obj.dateFin.split('-').map(Number);
  const diff = (y1-y0)*12 + (m1-m0) + 1;
  return Math.max(diff,1);
}
function objectifCalc(obj){
  const verse = objectifVerse(obj);
  const restant = Math.max((Number(obj.montantCible)||0) - verse, 0);
  const moisRestants = objectifMoisRestants(obj);
  const mensualite = restant>0 ? restant/moisRestants : 0;
  const pct = obj.montantCible>0 ? Math.min(verse/obj.montantCible,1) : 0;
  let statut = 'À venir';
  if(pct>=1) statut='Atteint';
  else if(verse>0) statut='En cours';
  return {verse, restant, moisRestants, mensualite, pct, statut};
}
function objectifsEpargneMensuelleTotal(){ return mine(state.objectifs).reduce((s,o)=>s+objectifCalc(o).mensualite,0); }
function objectifsEpargneMensuelleMois(key){
  return sumR2(mine(state.objectifs).filter(o=>inRangeMonth(key, o.dateDebut, o.dateFin)), o=>objectifCalc(o).mensualite);
}

/* ---- Compte joint : agrège les saisies taguées "Compte Joint" de MOI et de mon partenaire ---- */
function forOwner(arr, ownerId){ return (arr||[]).filter(e=>e.ownerId===ownerId); }
function jointPartner(){
  const me = currentUser();
  if(!me || !me.jointWith) return null;
  return authState.users.find(u=>u.id===me.jointWith) || null;
}
function jointAboTotalFor(ownerId){
  return sumR2(forOwner(state.depenses, ownerId).filter(d=>d.modePaiement==='Recurrent' && d.statut==='Actif' && d.compte==='Compte Joint'), monthlyCost);
}
function jointChargesTotalFor(ownerId, key){
  return sumR2(forOwner(state.charges, ownerId).filter(c=>c.compte==='Compte Joint' && inRangeMonth(key, c.dateDebut, c.dateFin)), c=>c.budget);
}
function jointDepensesTotalFor(ownerId, key){
  return sumR2(forOwner(state.depenses, ownerId).filter(d=>d.compte==='Compte Joint' && d.modePaiement!=='Recurrent'), d=>depenseMensualiteDuMois(d,key));
}
function jointDetailFor(ownerId, key){
  const ch = forOwner(state.charges, ownerId).filter(c=>c.compte==='Compte Joint' && inRangeMonth(key, c.dateDebut, c.dateFin)).map(c=>({id:c.id, itemType:'charges', nom:c.categorie, montant:Number(c.budget), cat:c.description||c.type}));
  const dep = forOwner(state.depenses, ownerId).filter(d=>d.compte==='Compte Joint' && depenseMensualiteDuMois(d,key)>0).map(d=>({id:d.id, itemType:'depenses', nom:d.libelle, montant:depenseMensualiteDuMois(d,key), cat:d.modePaiement==='Echelonne'?'Dépense échelonnée':(d.modePaiement==='Recurrent'?'Abonnement':'Dépense')}));
  return [...ch, ...dep];
}
/* Répartition du compte joint au prorata des revenus de chacun.
   Si personne n'a de revenu déclaré ce mois-là, on retombe sur un 50/50.
   Un revenu peut être explicitement exclu de ce calcul (excludeFromJoint). */
function jointPaidBy(ownerId, key){
  return r2(jointAboTotalFor(ownerId) + jointChargesTotalFor(ownerId, key) + jointDepensesTotalFor(ownerId, key));
}
function jointTotalChargesFor(meId, partnerId, key){
  return r2(jointPaidBy(meId, key) + jointPaidBy(partnerId, key));
}
function revenusDuMoisPourPartage(ownerId, key){
  let total = 0;
  forOwner(state.revenusRecurrents, ownerId).filter(r=>!r.excludeFromJoint).forEach(r=>{ if(inRangeMonth(key, r.dateDebut, r.dateFin)) total += Number(r.montant)||0; });
  const {start,end} = monthBounds(key);
  forOwner(state.revenusExceptionnels, ownerId).filter(r=>!r.excludeFromJoint).forEach(r=>{
    const d = r.date ? new Date(r.date+'T00:00:00') : null;
    if(d && d>=start && d<=end) total += Number(r.montant)||0;
  });
  return total;
}
function jointIncomeShares(key){
  const me = currentUser(); const partner = jointPartner();
  if(!partner) return null;
  const myInc = revenusDuMoisPourPartage(me.id, key);
  const partnerInc = revenusDuMoisPourPartage(partner.id, key);
  const total = myInc + partnerInc;
  const myShare = total>0 ? myInc/total : 0.5;
  return { myInc, partnerInc, myShare, partnerShare: 1-myShare, totalCharges: jointTotalChargesFor(me.id, partner.id, key) };
}
function myJointContribution(key){
  const shares = jointIncomeShares(key);
  return shares ? r2(shares.totalCharges * shares.myShare) : 0;
}

/* Chaque partie est arrondie au centime avant d'être additionnée : le total et
   le solde correspondent toujours aux montants affichés. Les dépenses non
   récurrentes sont séparées en achats (en une fois) et échéances (échelonnées). */
function dashboardData(key){
  const partner = jointPartner();
  const revenu = r2(revenusDuMois(key));
  // Sans compte joint actif, les saisies taguées "Compte Joint" restent des
  // dépenses perso classiques (rien ni personne avec qui les partager).
  const excl = partner ? 'Compte Joint' : undefined;
  const aboHorsCJ = abonnementsTotalMensuel(excl);
  const chargesHorsCJ = chargesTotalMois(key, excl);
  const achatsHorsCJ = depensesTotalMois(key, excl, 'Unique');
  const echeancesHorsCJ = depensesTotalMois(key, excl, 'Echelonne');
  const depensesHorsCJ = r2(achatsHorsCJ + echeancesHorsCJ);
  const virementCJ = partner ? myJointContribution(key) : 0;
  const epargneObj = objectifsEpargneMensuelleMois(key);
  const parts = { fixe:r2(aboHorsCJ + chargesHorsCJ), achats:achatsHorsCJ, echeances:echeancesHorsCJ, joint:virementCJ, epargne:epargneObj };
  const totalDepenses = r2(parts.fixe + parts.achats + parts.echeances + parts.joint + parts.epargne);
  const solde = r2(revenu - totalDepenses);
  return {key, revenu, aboHorsCJ, chargesHorsCJ, achatsHorsCJ, echeancesHorsCJ, depensesHorsCJ, virementCJ, epargneObj, parts, totalDepenses, solde};
}
function anneeData(year){
  const months = [];
  for(let m=1;m<=12;m++){
    const key = monthKey(year,m);
    const d = dashboardData(key);
    months.push({key, ...d});
  }
  const totals = {revenu:sumR2(months,m=>m.revenu), depenses:sumR2(months,m=>m.totalDepenses), solde:sumR2(months,m=>m.solde)};
  return {months, totals};
}

/* ============================== ANALYSE PAR POSTE DE DÉPENSE ============================== */
/* Vue transversale : combien a été dépensé pour un poste donné (ex. "Netflix",
   "Tabac"), mois par mois sur une année, tous types de saisies confondus
   (abonnements, charges, dépenses). */
function analyseSearchableTerms(){
  const terms = new Set();
  mine(state.charges).forEach(c=>{ terms.add(c.categorie); if(c.description) terms.add(c.description); });
  mine(state.depenses).forEach(d=>terms.add(d.libelle));
  const partner = jointPartner();
  if(partner){
    forOwner(state.charges, partner.id).filter(c=>c.compte==='Compte Joint').forEach(c=>{ terms.add(c.categorie); if(c.description) terms.add(c.description); });
    forOwner(state.depenses, partner.id).filter(d=>d.compte==='Compte Joint').forEach(d=>terms.add(d.libelle));
  }
  return Array.from(terms).filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function analyseMatchingEntries(term){
  const t = (term||'').trim().toLowerCase();
  if(!t) return [];
  const out = [];
  mine(state.charges).forEach(c=>{ if((c.categorie||'').toLowerCase().includes(t) || (c.description||'').toLowerCase().includes(t)) out.push({type:'charge', item:c, mine:true}); });
  mine(state.depenses).forEach(d=>{ if(d.libelle.toLowerCase().includes(t)) out.push({type:'depense', item:d, mine:true}); });
  // Les saisies jointes du/de la partenaire comptent aussi, même si on n'en est
  // pas à l'origine — c'est bien une dépense commune, on doit la voir dans le total.
  const partner = jointPartner();
  if(partner){
    forOwner(state.charges, partner.id).filter(c=>c.compte==='Compte Joint').forEach(c=>{ if((c.categorie||'').toLowerCase().includes(t) || (c.description||'').toLowerCase().includes(t)) out.push({type:'charge', item:c, mine:false}); });
    forOwner(state.depenses, partner.id).filter(d=>d.compte==='Compte Joint').forEach(d=>{ if(d.libelle.toLowerCase().includes(t)) out.push({type:'depense', item:d, mine:false}); });
  }
  return out;
}
function analyseMonthlyTotals(term, year){
  const matches = analyseMatchingEntries(term);
  const months = [];
  for(let m=1;m<=12;m++){
    const key = monthKey(year,m);
    let total = 0, totalMine = 0, totalPartner = 0;
    matches.forEach(({type,item,mine:isMine})=>{
      let v = 0;
      if(type==='charge'){ if(inRangeMonth(key, item.dateDebut, item.dateFin)) v = Number(item.budget)||0; }
      else if(type==='depense'){ v = depenseMensualiteDuMois(item, key); }
      total += v; if(isMine) totalMine += v; else totalPartner += v;
    });
    months.push({key, total, totalMine, totalPartner});
  }
  return months;
}
function analyseYearsWithData(term){
  const matches = analyseMatchingEntries(term);
  const years = new Set();
  const now = new Date();
  years.add(now.getFullYear());
  matches.forEach(({type,item})=>{
    if(type==='charge'){
      if(item.dateDebut) years.add(Number(item.dateDebut.slice(0,4)));
      if(item.dateFin) years.add(Number(item.dateFin.slice(0,4)));
      if(!item.dateDebut && !item.dateFin) years.add(now.getFullYear());
    }
    if(type==='depense'){
      if(item.modePaiement==='Recurrent') years.add(now.getFullYear()); // pas d'historique de date sur les dépenses récurrentes
      if(item.date) years.add(Number(item.date.slice(0,4)));
      if(item.dateDebut) years.add(Number(item.dateDebut.slice(0,4)));
      if(item.dateFin) years.add(Number(item.dateFin.slice(0,4)));
    }
  });
  return Array.from(years).sort((a,b)=>a-b);
}

/* ============================== SIDEBAR / NAV ============================== */
const SPACES = [
  { id:'finance', label:'Finance', icon:'wallet' },
  { id:'groupes', label:'Groupes', icon:'users' },
];
var currentSpace = 'finance'; // espace actif, non persisté (comme currentView) — repart sur Finance à chaque connexion
const NAV_FINANCE = [
  {id:'dashboard', label:'Tableau de bord', icon:'dashboard'},
  {id:'revenus', label:'Revenus', icon:'income'},
  {id:'depenses', label:'Dépenses', icon:'wallet'},
  {id:'releve', label:'Import relevé', icon:'fileIn'},
  {id:'echeances', label:'Échéances', icon:'calendar'},
  {id:'objectifs', label:'Objectifs', icon:'target'},
  {id:'charges', label:'Charges', icon:'home'},
  {id:'compteJoint', label:'Compte joint', icon:'users'},
  {id:'annuelle', label:'Vue annuelle', icon:'chart'},
  {id:'analyse', label:'Analyse', icon:'search'},
];
const NAV_GROUPES = [
  {id:'groupesListe', label:'Mes groupes', icon:'users'},
];
function navForSpace(space){ return space==='groupes' ? NAV_GROUPES : NAV_FINANCE; }
function defaultViewForSpace(space){ return space==='groupes' ? 'groupesListe' : 'dashboard'; }
function spaceOfView(view){ return NAV_GROUPES.some(n=>n.id===view) ? 'groupes' : 'finance'; }
function orderedNavItems(space){
  space = space || currentSpace;
  const nav = navForSpace(space);
  const savedOrder = (state.navOrder && state.navOrder[space]) || [];
  const order = savedOrder.length ? savedOrder : nav.map(n=>n.id);
  const byId = {}; nav.forEach(n=>byId[n.id]=n);
  const ordered = order.filter(id=>byId[id]).map(id=>byId[id]);
  nav.forEach(n=>{ if(!order.includes(n.id)) ordered.push(n); }); // tout nouvel onglet non encore rangé va à la fin
  return ordered;
}
let dragNavId = null, dragOverId = null, dragOverPos = null, dragGhostEl = null;
let dragPending = null;      // { id, el, startX, startY } — clic maintenu, pas encore un vrai glissement
let dragJustHappened = false; // empêche le clic de navigation juste après un glissement réel
const NAV_DRAG_THRESHOLD = 6; // px de mouvement avant de considérer que c'est un glissement, pas un clic
// Au doigt, un glissement immédiat se confond avec le défilement de la barre latérale :
// on attend un appui long (comme pour réorganiser les applis d'un téléphone).
const NAV_LONG_PRESS_MS = 350;
const NAV_LONG_PRESS_TOLERANCE = 10; // px de mouvement tolérés pendant l'appui long avant d'y voir un défilement
function setupNavDragAndDrop(){
  const draggableIds = new Set(navForSpace(currentSpace).map(n=>n.id));
  const items = Array.from(document.querySelectorAll('#sidebar .nav-item[data-nav]')).filter(el=>draggableIds.has(el.dataset.nav));
  items.forEach(el=>{
    el.addEventListener('pointerdown', (e)=>{
      if(e.pointerType==='mouse'){
        if(e.button!==0) return; // clic gauche uniquement
        dragPending = { id: el.dataset.nav, el, startX: e.clientX, startY: e.clientY };
        return;
      }
      cancelNavLongPress();
      dragPending = { id: el.dataset.nav, el, startX: e.clientX, startY: e.clientY, touch: true };
      dragPending.timer = setTimeout(()=>{
        if(!dragPending || dragPending.el!==el) return;
        startNavDrag(dragPending.startX, dragPending.startY);
        if(navigator.vibrate) navigator.vibrate(15);
      }, NAV_LONG_PRESS_MS);
    });
    // Alt + ↑ / ↓ : même réorganisation, au clavier.
    el.addEventListener('keydown', async (e)=>{
      if(!e.altKey || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return;
      e.preventDefault();
      const ids = orderedNavItems().map(n=>n.id);
      const idx = ids.indexOf(el.dataset.nav);
      const target = ids[idx + (e.key==='ArrowUp' ? -1 : 1)];
      if(!target) return;
      await moveNavItem(el.dataset.nav, target, e.key==='ArrowUp' ? 'before' : 'after');
      document.querySelector(`#sidebar .nav-item[data-nav="${el.dataset.nav}"]`)?.focus();
    });
  });
}
function cancelNavLongPress(){ if(dragPending && dragPending.timer) clearTimeout(dragPending.timer); }
function startNavDrag(x, y){
  dragNavId = dragPending.id;
  dragPending.el.classList.add('nav-dragging');
  createNavDragGhost(dragPending.el, x, y);
}
async function moveNavItem(from, overId, pos){
  const items = orderedNavItems().map(n=>n.id);
  items.splice(items.indexOf(from),1);
  let toIdx = items.indexOf(overId);
  if(pos==='after') toIdx += 1;
  items.splice(toIdx,0,from);
  if(!state.navOrder) state.navOrder = {};
  state.navOrder[currentSpace] = items;
  await persist();
  await render();
}
function createNavDragGhost(el, x, y){
  const rect = el.getBoundingClientRect();
  dragGhostEl = el.cloneNode(true);
  dragGhostEl.classList.remove('nav-dragging');
  dragGhostEl.classList.add('nav-drag-ghost');
  dragGhostEl.style.width = rect.width+'px';
  dragGhostEl.style.left = x+'px';
  dragGhostEl.style.top = y+'px';
  document.body.appendChild(dragGhostEl);
}
document.addEventListener('pointermove', (e)=>{
  if(dragPending && !dragNavId){
    const dx = e.clientX-dragPending.startX, dy = e.clientY-dragPending.startY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dragPending.touch){
      // le doigt a bougé avant la fin de l'appui long : c'est un défilement, pas un glissement
      if(dist > NAV_LONG_PRESS_TOLERANCE){ cancelNavLongPress(); dragPending = null; }
      return;
    }
    if(dist > NAV_DRAG_THRESHOLD){
      // le mouvement dépasse le seuil : ce n'est plus un simple clic, on démarre le glissement
      startNavDrag(e.clientX, e.clientY);
    }
  }
  if(!dragNavId) return;
  if(dragGhostEl){ dragGhostEl.style.left = e.clientX+'px'; dragGhostEl.style.top = e.clientY+'px'; }
  let found = null;
  const draggableIds = new Set(navForSpace(currentSpace).map(n=>n.id));

// L'île passe d'une taille mesurée à l'autre : CSS anime largeur, hauteur et rayon avec un ressort.
function sizeIsland(){
  const isl = document.getElementById('island');
  if(!isl) return;
  const compact = isl.querySelector('.isl-compact');
  if(islandOpen){
    const pw = Math.min(innerWidth - 24, innerWidth <= 640 ? 440 : 600);
    isl.style.setProperty('--pw', pw+'px');
    const panel = isl.querySelector('.isl-panel');
    isl.style.setProperty('--iw', pw+'px');
    isl.style.setProperty('--ih', panel.scrollHeight+'px');
    isl.style.setProperty('--ir', '30px');
  }else{
    // Largeur naturelle du contenu compact, mesurée hors flux.
    compact.style.position='static'; compact.style.width='max-content';
    const w = Math.ceil(compact.getBoundingClientRect().width);
    compact.style.position=''; compact.style.width='';
    isl.style.setProperty('--iw', Math.min(innerWidth - 32, Math.max(180, w))+'px');
    isl.style.setProperty('--ih', '48px');
    isl.style.setProperty('--ir', '24px');
  }
}
function placeBlob(target, animate){
  const blob = document.querySelector('#island .isl-blob');
  if(!blob || !target) { if(blob) blob.style.opacity = 0; return null; }
  const to = {x:target.offsetLeft, y:target.offsetTop, w:target.offsetWidth, h:target.offsetHeight};
  const from = blob._at;
  blob.style.opacity = 1;
  blob.style.width = to.w+'px'; blob.style.height = to.h+'px';
  blob.style.transform = `translate(${to.x}px,${to.y}px)`;
  blob._at = to;
  if(!animate || !from || motionOff()) return null;
  // La goutte s'étire dans le sens du trajet, puis reprend sa forme en rebondissant.
  const dx = to.x - from.x, dy = to.y - from.y;
  const sx = 1 + Math.min(.45, Math.abs(dx)/600), sy = 1 + Math.min(.35, Math.abs(dy)/300);
  return blob.animate([
    {transform:`translate(${from.x}px,${from.y}px) scale(1,1)`},
    {transform:`translate(${from.x+dx*.55}px,${from.y+dy*.55}px) scale(${sx},${2-sx > .7 ? 2-sx : .7})`, offset:.45},
    {transform:`translate(${to.x}px,${to.y}px) scale(${1/sx*.98+.04},${sy})`, offset:.75},
    {transform:`translate(${to.x}px,${to.y}px) scale(1,1)`},
  ], {duration:440, easing:'cubic-bezier(.3,.7,.3,1)'}).finished.catch(()=>{});
}

    const blob = isl.querySelector('.isl-blob'); if(blob) blob._at = null;

function initials(u){
  if(!u) return '?';
  const name = (u.displayName||u.username||'').trim();
  const words = name.split(/\s+/).filter(w=>/\p{L}/u.test(w)); // ignore les mots sans lettre (emoji seul…)
  if(!words.length) return '?';
  const first = w => [...w].find(ch=>/\p{L}/u.test(ch)) || '';
  const pick = words.length>1 ? [words[0], words[words.length-1]] : [words[0]];
  return pick.map(first).join('').toUpperCase();
}

const AVATAR_TINTS = [['#2a2a30','#d8d8de'],['#1f3326','#a8e6bc'],['#3a2f14','#f0d78c'],['#2b2140','#cdb8ff']];
function avatarTint(u){
  if(!u) return ['var(--raised)','var(--muted)'];

  if(me && u.id===me.id) return ['#12324f','#9fd1ff'];
  if(me && me.jointWith && u.id===me.jointWith) return ['#4a1a26','#ffb3c2'];
  let h=0; for(const c of (u.id||'')) h = (h*31 + c.charCodeAt(0)) % AVATAR_TINTS.length;
  return AVATAR_TINTS[Math.abs(h)%AVATAR_TINTS.length];

/* ============================== MODAL SYSTEM ============================== */
function openModal(title, fields, values, onSave, extraHtml){
  const root = document.getElementById('modal-root');
  const isEdit = !!(values && values.id);
  if(!document.querySelector('#modal-root .modal')) modalReturnFocus = document.activeElement;
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">${title}</h3>
        <form id="modal-form">
          ${fields.map(f=>fieldHTML(f, values)).join('')}
          ${extraHtml||''}
          ${fields.length>0 ? `<div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancel-btn">Annuler</button>
            <button type="submit" class="btn btn-primary">${icon('check')}${isEdit?'Enregistrer':'Ajouter'}</button>
          </div>` : ''}
        </form>
      </div>
    </div>`;
  const ov = document.getElementById('ov');
  ov.addEventListener('click', (e)=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('cancel-btn')?.addEventListener('click', closeModal);
  fields.forEach(f=>{
    const el = document.getElementById('f_'+f.key);
    el?.addEventListener('input', ()=>clearFieldError(f.key));
    el?.addEventListener('change', ()=>clearFieldError(f.key));
  });
  if(fields.some(f=>f.showIf)){
    const updateConditionalFields = ()=>{
      const current = {};
      fields.forEach(f=>{ const el = document.getElementById('f_'+f.key); if(el) current[f.key] = f.type==='checkbox' ? el.checked : el.value; });
      fields.forEach(f=>{
        if(!f.showIf) return;
        const el = document.getElementById('f_'+f.key);
        const wrap = el?.closest('.field');
        if(wrap) wrap.hidden = !f.showIf(current);
      });
    };
    document.getElementById('modal-form').addEventListener('input', updateConditionalFields);
    document.getElementById('modal-form').addEventListener('change', updateConditionalFields);
    updateConditionalFields();
  }
  document.getElementById('modal-form').onsubmit = async (e)=>{
    e.preventDefault();
    clearFieldErrors();
    const data = {};
    fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      if(!el) return;
      let v = f.type==='checkbox' ? el.checked : el.value;
      if(f.type==='number') v = v===''? 0 : parseFloat(v);
      if(f.type==='date' && v==='') v = null;
      data[f.key] = v;
    });
    // onSave peut renvoyer explicitement false pour signaler une validation
    // échouée : dans ce cas, le modal reste ouvert (rien n'est perdu, l'utilisateur
    // corrige simplement sa saisie) plutôt que de se fermer sur une erreur. Il peut
    // aussi avoir mis en évidence les champs fautifs via markFieldError avant de renvoyer false.
    // Pendant l'enregistrement (synchro GitHub comprise), le bouton est désactivé :
    // un double clic ou un Entrée répété ne crée pas de doublon.
    const submitBtn = e.submitter || document.querySelector('#modal-form button[type=submit]');
    if(submitBtn && submitBtn.disabled) return;
    const submitHTML = submitBtn ? submitBtn.innerHTML : '';
    if(submitBtn){ submitBtn.disabled = true; submitBtn.setAttribute('aria-busy','true'); submitBtn.textContent = 'Enregistrement…'; }
    let result;
    try{ result = await onSave(data); }
    finally{
      if(submitBtn && submitBtn.isConnected){ submitBtn.disabled = false; submitBtn.removeAttribute('aria-busy'); submitBtn.innerHTML = submitHTML; }
    }
    if(result===false) return;
    closeModal();
  };
  setTimeout(()=>{ const first = document.querySelector('#modal-form input:not([type=hidden]),#modal-form select') || document.getElementById('del-yes') || modalFocusables()[0]; if(first) first.focus(); }, 50);
}
function fieldHTML(f, values){
  const val = values && values[f.key]!==undefined && values[f.key]!==null ? values[f.key] : (f.default!==undefined?f.default:'');
  const hiddenAttr = f.showIf && !f.showIf(values||{}) ? ' hidden' : '';
  if(f.type==='select'){
    const opts = f.options.map(o=> typeof o==='object' ? o : {value:o, label:o});
    return `<div class="field"${hiddenAttr}><label for="f_${f.key}">${f.label}</label><select id="f_${f.key}">${opts.map(o=>`<option value="${attrEsc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
  }
  if(f.type==='category'){
    return categoryFieldHTML(f, val, hiddenAttr);
  }
  if(f.type==='checkbox'){
    return `<div class="field"${hiddenAttr} style="display:flex;align-items:center;gap:9px;"><input id="f_${f.key}" type="checkbox" ${val?'checked':''} style="width:16px;height:16px;accent-color:#FFFFFF;"><label for="f_${f.key}" style="margin:0;font-size:13px;color:var(--text);">${f.label}</label></div>`;
  }
  if(f.type==='password'){
    return `<div class="field"${hiddenAttr}><label for="f_${f.key}">${f.label}</label><div class="pw-wrap"><input id="f_${f.key}" type="password"${f.maxlength?` maxlength="${f.maxlength}"`:''} value="${attrEsc(val||'')}" placeholder="${f.placeholder||''}" autocomplete="${f.autocomplete||'current-password'}"><button type="button" class="pw-toggle" data-toggle-pw="f_${f.key}" aria-label="Afficher ou masquer la saisie">${icon('eye')}</button></div></div>`;
  }
  const amount = f.type==='number' && /montant|budget/i.test(f.key);
  return `<div class="field${amount?' amount':''}"${hiddenAttr}><label for="f_${f.key}">${f.label}</label><input id="f_${f.key}" type="${f.type||'text'}"${amount?' inputmode="decimal"':''} ${f.step?`step="${f.step}"`:''}${f.maxlength?` maxlength="${f.maxlength}"`:''} value="${attrEsc(val===0?0:(val||''))}" placeholder="${f.placeholder||''}"></div>`;
}
function attrEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
// Échappe une valeur saisie par l'utilisateur avant de l'insérer dans du HTML (texte ou attribut).
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>ESC_MAP[c]); }
// Champ « Catégorie » personnalisable : au lieu d'un <select> figé, un menu
// déroulant où chaque catégorie porte sa propre croix de suppression, et où
// une dernière ligne « + Autre… » ouvre un champ texte pour en créer une
// nouvelle sans jamais quitter le formulaire en cours.
function categoryFieldHTML(f, val, hiddenAttr){
  const hasVal = val!==undefined && val!==null && val!=='';
  return `<div class="field cat-field"${hiddenAttr||''} data-cat-type="${f.categoryType}" data-cat-key="${f.key}">
    <label id="lbl_${f.key}">${f.label}</label>
    <input type="hidden" id="f_${f.key}" value="${attrEsc(val)}">
    <div class="cat-select">
      <button type="button" class="cat-select-btn" data-cat-toggle aria-expanded="false" aria-labelledby="lbl_${f.key}">
        <span class="cat-select-label ${hasVal?'':'is-placeholder'}">${hasVal?esc(val):'Choisir une catégorie'}</span>
        ${icon('chevD')}
      </button>
      <div class="cat-dropdown">${categoryDropdownListHTML(f.categoryType, val)}</div>
    </div>
  </div>`;
}
function categoryDropdownListHTML(type, currentValue){
  const cats = myCategories(type);
  const names = cats.map(c=>c.nom);
  const ghost = (currentValue && !names.includes(currentValue))
    ? `<div class="cat-option cat-option-ghost"><button type="button" class="cat-option-label" data-cat-select="${attrEsc(currentValue)}">${esc(currentValue)} <em>(supprimée)</em></button></div>`
    : '';
  const rows = cats.map(c=>`
    <div class="cat-option ${c.nom===currentValue?'is-selected':''}">
      <button type="button" class="cat-option-label" data-cat-select="${attrEsc(c.nom)}">${esc(c.nom)}</button>
      <button type="button" class="cat-option-del" data-cat-delete="${c.id}" title="Supprimer cette catégorie" aria-label="Supprimer cette catégorie">${icon('x')}</button>
    </div>`).join('');
  const empty = cats.length===0 ? `<div class="field-note" style="padding:8px 9px;">Aucune catégorie pour l'instant.</div>` : '';
  return `${ghost}${rows}${empty}
    <button type="button" class="cat-add-row" data-cat-add-toggle>${icon('plus')}<span>Autre…</span></button>
    <div class="cat-add-input-row" hidden>
      <input type="text" class="cat-add-input" placeholder="Nouvelle catégorie" maxlength="40">
      <button type="button" class="cat-add-confirm" data-cat-add-confirm title="Ajouter" aria-label="Ajouter">${icon('check')}</button>
      <button type="button" class="cat-add-cancel" data-cat-add-cancel title="Annuler" aria-label="Annuler">${icon('x')}</button>
    </div>`;
}
// Champ catégorie tel qu'il est à l'écran après un render() : une ligne du relevé
// est reconstruite, un champ de modale reste le même élément.
function catFieldVivant(field){
  return field.isConnected ? field : (document.querySelector(`.cat-field[data-cat-key="${field.dataset.catKey}"]`) || field);
}
function resetCatDropdown(wrap){
  const addRow = wrap.querySelector('.cat-add-row');
  const inputRow = wrap.querySelector('.cat-add-input-row');
  if(addRow) addRow.hidden = false;
  if(inputRow) inputRow.hidden = true;
  wrap.querySelector('[data-cat-toggle]')?.setAttribute('aria-expanded', String(wrap.classList.contains('open')));
}
// Élément qui avait le focus avant l'ouverture de la modale : on le lui rend à la fermeture.
let modalReturnFocus = null;
function closeModal(){
  const root = document.getElementById('modal-root');
  const ov = root.querySelector('.modal-overlay');
  // Sortie plus rapide que l'entrée (150 ms) ; une nouvelle modale ouverte entre-temps n'est pas effacée.
  if(ov && !motionOff()){
    ov.classList.add('closing'); ov.id = '';
    setTimeout(()=>{ if(ov.isConnected) ov.remove(); }, 150);
  } else root.innerHTML='';
  if(modalReturnFocus && modalReturnFocus.isConnected) modalReturnFocus.focus();
  modalReturnFocus = null;
}
function modalFocusables(){
  return Array.from(document.querySelectorAll('#modal-root .modal-overlay:not(.closing) .modal :is(button, input, select, textarea, [tabindex]:not([tabindex="-1"]))'))
    .filter(el=>!el.disabled && el.type!=='hidden' && el.offsetParent!==null);
}
function markFieldError(key, msg){
  const input = document.getElementById('f_'+key);
  const field = input?.closest('.field');
  if(!field) return;
  field.classList.add('has-error');
  if(msg && !field.querySelector('.field-error-text')){
    const p = document.createElement('div');
    p.className = 'field-error-text';
    p.textContent = msg;
    field.appendChild(p);
  }
}
function clearFieldError(key){
  const field = document.getElementById('f_'+key)?.closest('.field');
  if(!field) return;
  field.classList.remove('has-error');
  field.querySelector('.field-error-text')?.remove();
}
function clearFieldErrors(){
  document.querySelectorAll('#modal-form .field.has-error').forEach(field=>{
    field.classList.remove('has-error');
    field.querySelector('.field-error-text')?.remove();
  });
}
// Validation générique pour les formulaires de saisie : un champ marqué
// `required` doit être non vide (montant strictement positif pour les
// champs numériques) sous peine de rester en évidence et de bloquer l'ajout.
function fieldRequiredErrors(fields, data){
  const errors = [];
  fields.forEach(f=>{
    if(!f.required) return;
    const v = data[f.key];
    const empty = v===undefined || v===null || (typeof v==='string' && !v.trim());
    if(f.type==='number'){
      if(empty || Number(v)<=0) errors.push([f.key, f.errorMsg || 'Renseigne un montant supérieur à 0']);
    } else if(empty){
      errors.push([f.key, f.errorMsg || (f.type==='date' ? 'Renseigne une date' : (f.type==='category' ? 'Choisis une catégorie' : 'Ce champ est obligatoire'))]);
    }
  });
  return errors;
}
function reportFieldErrors(errors){
  if(!errors.length) return false;
  errors.forEach(([key,msg])=>markFieldError(key,msg));
  toast(errors[0][1]);
  return true;
}

// La phrase nomme la conséquence ; le bouton destructif est un texte rouge, sans fond.
function confirmDelete(label, onYes, opts){
  opts = opts || {};
  openModal(opts.title || `Supprimer « ${esc(label)} » ?`, [], {}, ()=>{}, `
    <p class="modal-lead">${opts.consequence || 'Cette action est définitive.'}</p>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" id="del-cancel">Annuler</button>
    <button type="button" class="btn btn-text danger" id="del-yes">${icon('trash')}${opts.confirmLabel || 'Supprimer'}</button></div>
  `);
  document.getElementById('del-cancel').onclick = closeModal;
  document.getElementById('del-yes').onclick = ()=>{ onYes(); closeModal(); };
}

/* ============================== URL ============================== */
// La vue affichée (et son mois / son année) est reflétée dans l'adresse :
// #depenses/2026-10, #annuelle/2026, #parametres… — un rechargement ramène au même
// endroit, un lien peut être partagé et le bouton Retour revient à la vue précédente.
const ROUTE_VIEWS = ['dashboard','revenus','depenses','releve','echeances','objectifs','charges','compteJoint','annuelle','analyse','parametres','groupesListe'];
const MONTH_VIEWS = new Set(['dashboard','revenus','depenses','echeances','objectifs','charges','compteJoint']);
let lastRoutedView = null;
function routeHash(){
  if(MONTH_VIEWS.has(currentView)) return `#${currentView}/${state.selectedMonth}`;
  if(currentView==='annuelle') return `#annuelle/${state.selectedYear}`;
  return '#'+currentView;
}
function syncRouteToUrl(){
  const h = routeHash();
  if(location.hash!==h){
    // Changer de vue crée une entrée d'historique ; changer de mois remplace l'entrée
    // courante, pour que Retour ne repasse pas par chaque mois parcouru.
    if(lastRoutedView && lastRoutedView!==currentView) history.pushState(null, '', h);
    else history.replaceState(null, '', h);
  }
  lastRoutedView = currentView;
}
function applyRouteFromUrl(){
  const m = /^#(\w+)(?:\/(\d{4}-\d{2}|\d{4}))?$/.exec(location.hash);
  if(!m || !ROUTE_VIEWS.includes(m[1])) return false;
  currentView = m[1];
  if(currentView!=='parametres') currentSpace = spaceOfView(currentView);
  if(m[2] && MONTH_VIEWS.has(currentView) && /^\d{4}-(0[1-9]|1[0-2])$/.test(m[2])) state.selectedMonth = m[2];
  if(m[2] && currentView==='annuelle' && /^\d{4}$/.test(m[2])) state.selectedYear = Number(m[2]);
  lastRoutedView = currentView;
  return true;
}
window.addEventListener('popstate', async ()=>{
  if(!currentUser()) return;
  if(!applyRouteFromUrl()){ history.replaceState(null, '', routeHash()); return; } // adresse inconnue : on garde la vue courante
  closeModal(); closeSidebarMobile();
  await render();
});

/* ============================== DASHBOARD ============================== */
// Les graphiques SVG sont dessinés à la largeur réelle (initiales des mois
// sous 560 px) : on les redessine après un redimensionnement, avec un léger
// anti-rebond pour ne pas recalculer pendant un redimensionnement continu.
let resizeChartsTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeChartsTimer);
  resizeChartsTimer = setTimeout(()=>{
    // Un double requestAnimationFrame garantit qu'on attend un cycle de rendu
    // complet du navigateur — le redimensionnement peut faire basculer la mise
    // en page (barre latérale → barre mobile) de façon asynchrone, un peu après
    // le setTimeout lui-même ; sans ça, le graphique se redessine parfois sur
    // des dimensions transitoires, pas encore stabilisées.
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ redrawCurrentCharts(); updateTableScrollHints(); }); });
  }, 250);
});
// Filet supplémentaire, plus précis qu'un minuteur arbitraire : redessine
// exactement au moment où le seuil mobile/desktop est franchi (correspond au
// point où la barre latérale bascule vers la barre mobile), plutôt que de
// deviner un délai qui couvre ce cas.
if(window.matchMedia){
  const mobileBreakpointQuery = window.matchMedia('(max-width: 880px)');
  mobileBreakpointQuery.addEventListener('change', ()=>{
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ redrawCurrentCharts(); }); });
  });
}

/* ---------- Tableau de bord : « combien me reste-t-il ce mois-ci ? » ---------- */
let dashFocusPoste = null;   // poste mis en avant par un clic (segment de la barre)
let dashEntered = false;     // l'animation d'entrée ne joue qu'une fois par chargement
let dashYearGrown = false;   // idem pour la pousse des colonnes de l'année
const dashPrevWidths = new Map(); // dernières largeurs affichées : les barres repartent de là
function dashYear(){ return Number(state.selectedMonth.slice(0,4)); }

// Phrase de constat, calculée depuis les chiffres du mois (jamais écrite en dur).
function dashFinding(key, d){
  const mois = monthName(key);
  if(d.revenu<=0.01) return `Aucun revenu saisi pour ${monthLabel(key)}. <button class="link" data-action="add-revrec">Ajouter un revenu</button>`;
  const resteTxt = v => v<0 ? `<strong>${fmtEUR0(-v)}</strong> de dépassement` : `<strong>${fmtEUR0(v)}</strong> de reste à vivre`;
  if(isFutureMonth(key)) return `Prévision pour ${mois} : ${resteTxt(d.solde)} si rien d’autre n’est ajouté.`;
  const prev = [1,2,3].map(i=>dashboardData(addMonths(key,-i)));
  const avg = prev.reduce((s,p)=>s+p.totalDepenses,0)/3;
  if(avg<=0.01) return `${ucfirst(mois)} : ${resteTxt(d.solde)}.`;
  const diff = d.totalDepenses - avg;
  if(diff > avg*0.15){
    let top = null, topD = 0;
    POSTES.forEach(p=>{ const dv = d.parts[p.k] - prev.reduce((s,q)=>s+q.parts[p.k],0)/3; if(dv>topD){ topD = dv; top = p; } });
    return `${ucfirst(mois)} : <strong>${fmtEUR0(diff)} de dépenses en plus</strong> que la moyenne des trois mois précédents${top?`, surtout en ${top.short} (+${fmtEUR0(topD)})`:''}.`;
  }
  if(diff < -avg*0.15) return `${ucfirst(mois)} : <strong>${fmtEUR0(-diff)} de dépenses en moins</strong> que la moyenne des trois mois précédents.`;
  return `Mois dans la moyenne : ${resteTxt(d.solde)}.`;
}

function dashPosteSubs(key, d){
  const partner = jointPartner();
  const exclCJ = partner ? 'Compte Joint' : null;
  const nbAbos = abonnementsActifs().filter(a=> exclCJ ? a.compte!==exclCJ : true).length;
  const nbCharges = chargesActivesMois(key, exclCJ||undefined).length;
  const nbAchats = mine(state.depenses).filter(x=>x.modePaiement==='Unique' && (exclCJ ? x.compte!==exclCJ : true) && depenseMensualiteDuMois(x,key)>0.004).length;
  const nbEch = mine(state.depenses).filter(x=>x.modePaiement==='Echelonne' && (exclCJ ? x.compte!==exclCJ : true) && depenseMensualiteDuMois(x,key)>0.004).length;
  const nbObj = mine(state.objectifs).filter(o=>inRangeMonth(key, o.dateDebut, o.dateFin) && objectifCalc(o).mensualite>0).length;
  const shares = partner ? jointIncomeShares(key) : null;
  return {
    fixe: (nbAbos||nbCharges) ? `${fmtCount(nbAbos,'abonnement','abonnements')} · ${fmtCount(nbCharges,'charge','charges')}${partner?', hors compte joint':''}` : 'aucun abonnement ni charge',
    achats: nbAchats ? `${fmtCount(nbAchats,'achat','achats')} ce mois` : 'aucun achat',
    echeances: nbEch ? `${fmtCount(nbEch,'échéancier','échéanciers')} en cours` : 'aucun en cours',
    joint: shares ? `ta part : ${pctFmt(shares.myShare)}` : 'pas de compte joint',
    epargne: nbObj ? `${fmtCount(nbObj,'objectif','objectifs')} en cours` : 'aucun objectif ce mois',
  };
}
function fmtCount(n, singular, plural){ return `${n} ${n>1 ? plural : singular}`; }

function renderDashboard(){
  const key = state.selectedMonth;
  const d = dashboardData(key);
  const partner = jointPartner();
  const enter = dashEntered || reduceMotion.matches ? '' : ' enter';
  // Contrôle : les cinq postes plus le reste redonnent exactement le revenu.
  console.assert(Math.abs(POSTES.reduce((s,p)=>s+d.parts[p.k],0) + d.solde - d.revenu) < 0.005, 'Tableau de bord : postes + reste ≠ revenu', key, d);

  const noRev = d.revenu<=0.01;
  const base = Math.max(d.revenu, d.totalDepenses) || 1;
  const subs = dashPosteSubs(key, d);
  const mois = monthName(key);
  const widthOf = k => motionOff() || !dashPrevWidths.has(k) ? (k==='reste' ? null : d.parts[k]/base) : dashPrevWidths.get(k);
  const segs = POSTES.map((p,i)=>`<div class="seg${dashFocusPoste===p.k?' hl':''}" data-k="${p.k}" data-w="${d.parts[p.k]/base}" style="width:calc((100% - ${POSTES.length*3}px) * ${widthOf(p.k)||0});transition-delay:${motionOff()?0:i*45}ms" title="${attrEsc(p.label)} : ${fmtEUR(d.parts[p.k])}"></div>`).join('')
    + `<div class="seg${d.solde<0?' over':''}" data-k="reste" title="${d.solde<0?'Dépassement':'Reste à vivre'} : ${fmtEUR(Math.abs(d.solde))}"></div>`;
  const flowLabel = `Répartition du revenu de ${mois} : ${POSTES.map(p=>`${p.label} ${fmtEUR(d.parts[p.k])}`).join(', ')}, ${d.solde<0?'dépassement':'reste'} ${fmtEUR(Math.abs(d.solde))}`;

  const postes = POSTES.map(p=>`
    <button class="poste" data-action="focus-poste" data-k="${p.k}" aria-pressed="${dashFocusPoste===p.k}">
      <span class="lbl">${posteDot(p.k)}${p.label}</span>
      <span class="val" data-tween="poste:${p.k}" data-v="${d.parts[p.k]}">${fmtEUR(motionOff()||!tweenValues.has('poste:'+p.k) ? d.parts[p.k] : tweenValues.get('poste:'+p.k))}</span>
      <span class="sub">${subs[p.k]}</span>
    </button>`).join('');

  return `
    <div class="dash">
      <div class="${enter.trim()}">${pageHeadHTML({
        title:'Tableau de bord', finding: dashFinding(key, d), findingKey:'dash-finding',
        stepper: monthStepperHTML(key,'dashboard'),
        action: `<button class="btn btn-primary" data-action="add-depense">${icon('plus')}Ajouter une dépense</button>`,
      })}</div>

      <section class="card hero${enter}" aria-labelledby="hero-l">
        <div class="hero-top">
          <div>
            <div class="hero-label" id="hero-l">${d.solde<0 && !noRev ? 'Reste à vivre · dépassé' : 'Reste à vivre'}</div>
            ${noRev
              ? `<div class="big fig none" data-dash="reste" aria-label="Aucun revenu">—</div>
                 <div class="hero-norev">Aucun revenu saisi pour ${monthLabel(key)}. <button class="link" data-action="add-revrec">Ajouter un revenu</button></div>`
              : `<div class="big fig${d.solde<0?' over':''}" data-dash="reste" data-tween="reste" data-v="${d.solde}">${bigFmt(motionOff()||!tweenValues.has('reste') ? d.solde : tweenValues.get('reste'))}</div>
                 <div class="hero-of">sur <b class="num" data-dash="revenu">${fmtEUR(d.revenu)}</b> de revenu en ${mois}</div>`}
          </div>
          ${noRev ? '' : `<div class="ratio"><div class="pct fig" data-tween="pct" data-v="${d.totalDepenses/d.revenu}">${pctFmt(motionOff()||!tweenValues.has('pct') ? d.totalDepenses/d.revenu : tweenValues.get('pct'))}</div><small>${d.solde<0?'du revenu, dépassé':'du revenu engagé'}</small></div>`}
        </div>
        <div class="flow${dashFocusPoste?' has-focus':''}" role="img" aria-label="${attrEsc(flowLabel)}">${segs}</div>
        <div class="postes">${postes}</div>
      </section>

      <div class="row2${enter}">
        <section class="card cats-card" aria-labelledby="cat-h">${dashCatsHTML(key)}</section>
        <div class="stack">
          <section class="card" aria-labelledby="joint-h">${dashJointHTML(key, d)}</section>
          <section class="card" aria-labelledby="goal-h">${dashGoalsHTML(key)}</section>
        </div>
      </div>

      <section class="card ychart${enter}${dashYearGrown||reduceMotion.matches?'':' first'}" aria-labelledby="year-h">
        <div class="chart-head">
          <h2 id="year-h">Dépenses mois par mois, ${dashYear()}</h2>
          <div class="chart-head-right"><span class="side-note">Touchez un mois pour l’afficher</span>${chartFilterButtonHTML('revAnnuel', 'Nom du revenu')}</div>
        </div>
        ${chartFilterActive('revAnnuel') ? chartFilterActiveBarHTML('revAnnuel') : ''}
        <div class="legend">${POSTES.map(p=>`<span>${posteDot(p.k)}${p.label}</span>`).join('')}<span><i class="ln" aria-hidden="true"></i>Revenu${chartFilterActive('revAnnuel')?' (filtré)':''}</span></div>
        <div class="ychart-host" data-year="${dashYear()}" data-sel="${key}"></div>
        <div class="note-ex">${yearForecastNote(dashYear())}</div>
      </section>
    </div>`;
}
function yearForecastNote(year){
  const fut = []; for(let m=1;m<=12;m++){ const k = monthKey(year,m); if(isFutureMonth(k)) fut.push(MONTH_NAMES[m-1]); }
  if(!fut.length) return '';
  if(fut.length===12) return `${year} : prévision`;
  return fut.length===1 ? `${ucfirst(fut[0])} : prévision` : `${ucfirst(fut[0])} à ${fut[fut.length-1]} : prévision`;
}

/* « Où part l'argent » : catégories du mois triées, chacune dans la couleur
   de son poste (le poste majoritaire si elle en mélange deux). */
function dashCatsHTML(key){
  const parts = chartFilteredGrouped('depRepartition');
  const total = sumR2(parts, p=>p.value);
  const head = `<div class="chart-head"><h2 id="cat-h">Où part l’argent</h2><div class="chart-head-right"><span class="side-note num">${fmtEUR(total)}</span>${chartFilterButtonHTML('depRepartition', 'Nom de la dépense')}</div></div>
    ${chartFilterActive('depRepartition') ? chartFilterActiveBarHTML('depRepartition') : ''}`;
  if(!parts.length) return `${head}<div class="empty-line">${chartFilterActive('depRepartition') ? 'Aucune dépense ne correspond au filtre.' : 'Aucune dépense ce mois-ci.'}</div>`;
  const shown = parts.slice(0,8), max = shown[0].value;
  const rows = shown.map(c=>{
    const ks = Object.entries(c.postes).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
    const k = ks[0], fk = 'cat:'+c.label;
    const w = motionOff() || !dashPrevWidths.has(fk) ? c.value/max : dashPrevWidths.get(fk);
    return `<li class="cat">
      <span class="name" title="${attrEsc(c.label)}">${esc(c.label)}</span><span class="amt">${fmtEUR(c.value)}</span>
      <span class="track"><span class="fill" data-fk="${attrEsc(fk)}" data-w="${c.value/max}" style="background:${POSTE_BY_KEY[k].color};transform:scaleX(${w})"></span></span>

  return `${head}<ol class="cats">${rows}</ol>
    ${parts.length>shown.length ? `<div class="field-note" style="margin-top:10px;">+ ${fmtCount(parts.length-shown.length,'autre catégorie','autres catégories')}</div>` : ''}

}

/* Objectifs : un anneau à la manière de l'app Forme, 3 au maximum. */
const RING_C = 2*Math.PI*52;
const ringCelebrated = new Set();
function ringSVG(o, cls){
  const c = objectifCalc(o), rk = 'ring:'+o.id;
  const from = motionOff() || !dashPrevWidths.has(rk) ? (motionOff() ? c.pct : 0) : dashPrevWidths.get(rk);
  // Objectif atteint : une seule célébration par session (c'est rare, ça peut se permettre un peu de joie).
  const celebrate = c.pct>=1 && !ringCelebrated.has(o.id);
  if(celebrate) ringCelebrated.add(o.id);
  return `<svg class="ring${cls?' '+cls:''}${celebrate?' done':''}" viewBox="0 0 132 132" role="img" aria-label="${attrEsc(o.nom)} : ${pctFmt(c.pct)}">
    <circle class="trk" cx="66" cy="66" r="52"/>
    <circle class="val" cx="66" cy="66" r="52" data-rk="${attrEsc(rk)}" data-w="${c.pct}" style="stroke-dasharray:${RING_C.toFixed(2)};stroke-dashoffset:${(RING_C*(1-from)).toFixed(2)}${c.pct<=0?';stroke:none':''}"/>
    <text x="66" y="76" text-anchor="middle" class="num">${pctFmt(c.pct)}</text></svg>`;
}
function objectifEcheanceLabel(o){ return o.dateFin ? shortMonthLabel(o.dateFin.slice(0,7)) : 'sans échéance'; }
function dashGoalsHTML(key){

/* Après insertion : les barres, anneaux et chiffres partent de leur valeur
   précédente et vont vers la nouvelle (transitions CSS + tween). */
function dashAfterRender(){
  const view = document.getElementById('view');
  const apply = ()=>{
    view.querySelectorAll('.seg[data-w]').forEach(sg=>{ const w = Number(sg.dataset.w); sg.style.width = `calc((100% - ${POSTES.length*3}px) * ${w})`; dashPrevWidths.set(sg.dataset.k, w); });
    view.querySelectorAll('.fill[data-fk]').forEach((f,i)=>{ const w = Number(f.dataset.w); f.style.transitionDelay = motionOff()?'0ms':`${i*40}ms`; f.style.transform = `scaleX(${w})`; dashPrevWidths.set(f.dataset.fk, w); });
    view.querySelectorAll('.ring .val[data-rk]').forEach(r=>{ const w = Number(r.dataset.w); r.style.strokeDashoffset = (RING_C*(1-w)).toFixed(2); dashPrevWidths.set(r.dataset.rk, w); });
  };
  if(motionOff()) apply(); else requestAnimationFrame(()=>requestAnimationFrame(apply));
  view.querySelectorAll('[data-tween]').forEach(el=>{
    const k = el.dataset.tween, v = Number(el.dataset.v);
    const fmt = k==='reste' ? bigFmt : k==='pct' ? pctFmt : fmtEUR;
    tween(el, k, v, fmt, k==='reste' ? 700 : 600);
  });
  const finding = view.querySelector('[data-swap]');
  if(finding){ const html = finding.innerHTML; swapText(finding, finding.dataset.swap, html); }
  drawYearCharts();
  dashEntered = true;
}

// Toutes les vues : les chiffres marqués data-tween défilent depuis leur valeur précédente.
function animateView(){
  document.querySelectorAll('#view [data-tween]').forEach(el=>{
    const k = el.dataset.tween, v = Number(el.dataset.v), f = el.dataset.fmt;
    tween(el, k, v, f==='big' ? bigFmt : f==='pct' ? pctFmt : fmtEUR, f==='big' ? 700 : 600);
  });
  document.querySelectorAll('#view .ring .val[data-rk]').forEach(r=>{
    const w = Number(r.dataset.w);
    const set = ()=>{ r.style.strokeDashoffset = (RING_C*(1-w)).toFixed(2); dashPrevWidths.set(r.dataset.rk, w); };
    if(motionOff()) set(); else requestAnimationFrame(()=>requestAnimationFrame(set));
  });
}

/* ---------- Graphique annuel en SVG : colonnes empilées par poste, revenu en
   repère (trait blanc), mois futurs hachurés. Réutilisé par la Vue annuelle. ---------- */
const MONTH_SHORT = ['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
function niceCeil(v){ if(v<=0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function yearChartSVG(host){
  const year = Number(host.dataset.year), sel = host.dataset.sel, tall = host.dataset.tall==='1';
  const {months} = anneeData(year);
  const revOf = m => host.dataset.revfilter==='0' ? m.revenu : revAnnuelFilteredTotalForMonth(m.key);
  const narrow = host.clientWidth < 560;
  const W = narrow ? Math.max(300, host.clientWidth) : 1100, H = narrow ? (tall?300:230) : (tall?400:300);
  const padL = narrow ? 34 : 48, padB = 28, padT = 10, plotH = H-padB-padT, plotW = W-padL;
  const step4 = niceCeil(Math.max(...months.map(m=>Math.max(revOf(m), m.totalDepenses)), 1)/4), max = step4*4;
  const step = plotW/12, bw = Math.min(46, step*(narrow?0.62:0.56));
  const y = v => padT + plotH*(1-Math.min(v,max)/max);
  const tick = v => v===0 ? '0' : v>=1000 ? `${sp(String(v/1000).replace('.',','))} k` : String(v);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Dépenses de chaque mois de ${year}, par poste, avec le revenu en repère"><defs><pattern id="hatch-${year}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#050506" stroke-width="2.4" stroke-opacity=".55"/></pattern></defs><g class="axis">`;
  for(let i=0;i<=4;i++){ const v = step4*i; svg += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-10}" y="${y(v)+4}" text-anchor="end">${tick(v)}</text>`; }
  svg += `</g>`;
  months.forEach((mm,i)=>{
    const cx = padL + step*i + step/2, x = cx-bw/2, future = isFutureMonth(mm.key), selected = mm.key===sel;
    let acc = 0, rects = '';
    POSTES.forEach(p=>{ const v = mm.parts[p.k]; if(v<=0) return; const y0 = y(acc+v), h = y(acc)-y(acc+v); rects += `<rect class="b" x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h-1.5).toFixed(1)}" rx="3" fill="${p.color}" style="animation-delay:${i*35}ms"/>`; acc += v; });
    const hatch = future && acc>0 ? `<rect x="${x.toFixed(1)}" y="${y(acc).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(acc)).toFixed(1)}" fill="url(#hatch-${year})" pointer-events="none"/>` : '';
    const rev = revOf(mm);
    const label = narrow ? 'JFMAMJJASOND'[i] : MONTH_SHORT[i];
    svg += `<g class="col${sel && !selected?' dim':''}" data-action="goto-month" data-k="${mm.key}" tabindex="0" role="button" aria-pressed="${selected}" aria-label="${monthLabel(mm.key)} : ${fmtEUR(mm.totalDepenses)} de dépenses, ${fmtEUR(rev)} de revenu${future?' (prévision)':''}">
      <rect class="hit" x="${(cx-step/2).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${plotH+padB}" fill="transparent" rx="8"/>
      ${rects}${hatch}
      ${rev>0 ? `<line class="revline" x1="${(x-6).toFixed(1)}" x2="${(x+bw+6).toFixed(1)}" y1="${y(rev).toFixed(1)}" y2="${y(rev).toFixed(1)}"/>` : ''}
      <text class="mlabel${selected?' sel':''}" x="${cx.toFixed(1)}" y="${H-8}">${label}</text>
    </g>`;
  });
  return svg + `</svg>`;
}
function drawYearCharts(){
  document.querySelectorAll('#view .ychart-host').forEach(host=>{ host.innerHTML = yearChartSVG(host); });
  if(document.querySelector('#view .ychart.first')) setTimeout(()=>{ document.querySelectorAll('.ychart.first').forEach(c=>c.classList.remove('first')); dashYearGrown = true; }, 1300);
