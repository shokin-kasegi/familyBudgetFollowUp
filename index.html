/* ============================== SYNCHRONISATION GITHUB (recommandée) ============================== */
/* Stocke le fichier de données dans un dépôt GitHub PRIVÉ séparé (différent
   de celui qui héberge le site), via l'API GitHub. Fonctionne sur tout
   navigateur et tout appareil (y compris mobile), contrairement au dossier
   partagé qui nécessite Chrome/Edge sur PC. Chaque personne renseigne son
   propre jeton d'accès (Personal Access Token) à privilèges restreints. */
function ghConfig(){ try{ return JSON.parse(localStorage.getItem('github_sync_config')||'{}'); }catch(e){ return {}; } }
function ghSaveConfig(cfg){ localStorage.setItem('github_sync_config', JSON.stringify(cfg)); }
function ghClearConfig(){ localStorage.removeItem('github_sync_config'); }
function ghConfigured(){ const c = ghConfig(); return !!(c.owner && c.repo && c.token); }
let ghLastSync = null, ghSha = null, ghAuthSha = null, ghSocialSha = null;

function b64EncodeUnicode(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))); }
function b64DecodeUnicode(str){ return new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\n/g,'')), c=>c.charCodeAt(0))); }

function ghHeaders(token){ return { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; }
function ghUrl(cfg, path){ return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`; }

async function ghPull(){
  const a = await ghPullAuth();
  const b = await ghPullBudget(true);
  const c = await ghPullSocial(true);
  return a || b || c;
}
/* Fusion sûre des données du budget : chacun ne modifie jamais que SES PROPRES
   saisies (ownerId). On peut donc fusionner sans risque : on garde toujours ma
   version locale pour ce qui m'appartient (même pas encore synchronisé), et on
   récupère la version distante pour ce qui appartient à quelqu'un d'autre —
   c'est ce qui permet de voir les ajouts du partenaire sans jamais écraser les
   miens en cours de frappe. */
function mergeOwned(localArr, remoteArr, myId){
  const mine = (localArr||[]).filter(x=>x.ownerId===myId);
  const others = (remoteArr||[]).filter(x=>x.ownerId!==myId);
  return [...mine, ...others];
}
function mergeBudget(local, remote, myId){
  const merged = {...local};
  OWNED_ARRAYS.forEach(key=>{ merged[key] = mergeOwned(local[key], remote[key], myId); });
  return merged;
}

async function ghPullBudget(merge){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const res = await fetch(ghUrl(cfg, cfg.path||'data.json'), { headers: ghHeaders(cfg.token) });
    if(res.status===404){ ghSha = null; return false; }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const data = await res.json();
    ghSha = data.sha;
    const text = b64DecodeUnicode(data.content);
    const remote = JSON.parse(text);
    if(remote && remote.selectedMonth!==undefined){
      const me = currentUser();
      state = (merge && me) ? mergeBudget(state, remote, me.id) : remote;
      localStorage.setItem('budget_store', JSON.stringify(state));
      ghLastSync = new Date();
      return true;
    }
    return false;
  }catch(e){ console.error('GitHub pull error (budget)', e); return false; }
}
async function ghPullAuth(){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const res = await fetch(ghUrl(cfg, cfg.authPath||'auth.json'), { headers: ghHeaders(cfg.token) });
    if(res.status===404){ ghAuthSha = null; return false; }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const data = await res.json();
    ghAuthSha = data.sha;
    const text = b64DecodeUnicode(data.content);
    const remote = JSON.parse(text);
    if(remote && remote.users){ authState = remote; localStorage.setItem('budget_auth', JSON.stringify(authState)); ghLastSync = new Date(); return true; }
    return false;
  }catch(e){ console.error('GitHub pull error (auth)', e); return false; }
}
async function ghPullSocial(merge){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const res = await fetch(ghUrl(cfg, cfg.socialPath||'social.json'), { headers: ghHeaders(cfg.token) });
    if(res.status===404){ ghSocialSha = null; return false; }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const data = await res.json();
    ghSocialSha = data.sha;
    const text = b64DecodeUnicode(data.content);
    const remote = JSON.parse(text);
    if(remote){
      socialState = merge ? mergeSocial(socialState, remote) : remote;
      localStorage.setItem('budget_social', JSON.stringify(socialState));
      ghLastSync = new Date();
      return true;
    }
    return false;
  }catch(e){ console.error('GitHub pull error (social)', e); return false; }
}
async function ghPush(){
  const a = await ghPushAuth();
  const b = await ghPushBudget();
  const c = await ghPushSocial();
  return a || b || c;
}
/* Écrit un fichier sur GitHub, avec une nouvelle tentative automatique en cas de
   conflit (HTTP 409 — le fichier a changé entre-temps, ex. deux appareils qui
   synchronisent au même moment). On relit simplement le sha à jour et on
   réessaie une fois, ce qui suffit dans l'immense majorité des cas. */
async function ghPutWithRetry(path, dataObj, message, attempt){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const check = await fetch(ghUrl(cfg, path), { headers: ghHeaders(cfg.token) });
    let sha = null;
    if(check.status===200){ const d = await check.json(); sha = d.sha; }
    const body = { message, content: b64EncodeUnicode(JSON.stringify(dataObj, null, 2)) };
    if(sha) body.sha = sha;
    const res = await fetch(ghUrl(cfg, path), { method:'PUT', headers:{...ghHeaders(cfg.token), 'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if(res.status===409 && !attempt){
      // Conflit : quelqu'un d'autre a écrit entre-temps. On relit et réessaie une fois.
      return ghPutWithRetry(path, dataObj, message, true);
    }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    ghLastSync = new Date();
    return true;
  }catch(e){ console.error('GitHub push error ('+path+')', e); return false; }
}
async function ghPushBudget(){ return ghPutWithRetry(ghConfig().path||'data.json', state, 'Mise à jour budget'); }
async function ghPushAuth(){ return ghPutWithRetry(ghConfig().authPath||'auth.json', authState, 'Mise à jour comptes'); }
async function ghPushSocial(){ return ghPutWithRetry(ghConfig().socialPath||'social.json', socialState, 'Mise à jour social'); }
async function ghTestAndConnect(owner, repo, token){
  ghSaveConfig({owner, repo, token, path:'data.json', authPath:'auth.json', socialPath:'social.json'});
  const found = await ghPull();
  return found;
}

function renderGithubSection(){
  const cfg = ghConfig();
  if(!ghConfigured()){
    return `
      <div class="field"><label>Propriétaire du dépôt (username GitHub)</label><input id="gh-owner" type="text" placeholder="tonpseudo"></div>
      <div class="field"><label>Nom du dépôt privé de données</label><input id="gh-repo" type="text" placeholder="mon-budget-data"></div>
      <div class="field"><label>Jeton d'accès (Personal Access Token)</label><div class="pw-wrap"><input id="gh-token" type="password" placeholder="github_pat_..."><button type="button" class="pw-toggle" data-toggle-pw="gh-token">${icon('eye')}</button></div></div>
      <button class="btn btn-primary btn-sm" data-action="gh-connect">${icon('cloud')}Connecter</button>
      ${exportImportHTML()}`;
  }
  return `
    <div class="status-row"><span class="status-dot" style="background:var(--teal);"></span>Connecté à ${cfg.owner}/${cfg.repo}${ghLastSync ? ' · synchronisé '+ghLastSync.toLocaleTimeString('fr-FR') : ''}</div>
    <div class="row-actions" style="justify-content:flex-start;gap:10px;">
      <button class="btn btn-primary btn-sm" data-action="gh-sync-now">${icon('refresh')}Synchroniser maintenant</button>
      <button class="btn btn-ghost btn-sm" data-action="gh-disconnect">Déconnecter</button>
    </div>
    ${exportImportHTML()}`;
}
function exportImportHTML(){
  return `
    <div class="row-actions" style="justify-content:flex-start;gap:10px;border-top:1px solid var(--border);padding-top:14px;margin-top:14px;">
      <button class="btn btn-ghost btn-sm" data-action="export-data">${icon('arrowDown')}Exporter (.json)</button>
      <button class="btn btn-ghost btn-sm" data-action="import-data">${icon('arrowUp')}Importer un fichier</button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
    </div>`;
}

/* ============================== ASSISTANT CLAUDE ============================== */
function claudeKey(){ return localStorage.getItem('claude_api_key')||''; }
let chatOpen = false;
let chatHistory = [];
try{ chatHistory = JSON.parse(localStorage.getItem('claude_chat_msgs')||'[]'); }catch(e){ chatHistory=[]; }

function renderClaudeSection(){
  const key = claudeKey();
  if(!key){
    return `
      <div class="field"><label>Clé API Anthropic</label>
        <div class="kv-input-row"><input id="claude-key-input" type="password" placeholder="sk-ant-..."><button class="btn btn-primary btn-sm" data-action="save-claude-key">Activer</button></div>
        <div class="field-note">Crée une clé sur console.anthropic.com → API Keys. Des frais d'usage s'appliquent selon ta consommation.</div>
      </div>`;
  }
  return `
    <div class="status-row"><span class="status-dot" style="background:var(--teal);"></span>Assistant activé</div>
    <button class="btn btn-ghost btn-sm" data-action="remove-claude-key">${icon('trash')}Retirer la clé</button>`;
}
function updateFab(){ document.getElementById('claude-fab').style.display = claudeKey() ? 'flex' : 'none'; }

/* ============================== NOTIFICATIONS ============================== */
let notifOpen = false;
function toggleNotifPanel(force){
  notifOpen = force!==undefined ? force : !notifOpen;
  const panel = document.getElementById('notif-panel');
  panel.classList.toggle('open', notifOpen);
  renderNotifPanel();
}
function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');
  const me = currentUser();
  if(!me){ panel.innerHTML=''; return; }
  const incoming = myPendingIncomingRequests();
  const unread = socialState.messages.filter(m=>m.toId===me.id && !(m.readBy||[]).includes(me.id));
  const items = [];
  incoming.forEach(r=>{
    const from = authState.users.find(u=>u.id===r.fromId);
    items.push(`<div class="notif-item">
      <div class="avatar" style="background:${avatarColor(from)};width:32px;height:32px;font-size:12px;">${initials(from)}</div>
      <div class="info"><div class="name">${from?from.displayName:'?'}</div><div class="meta">souhaite un compte joint avec toi</div></div>
      <div class="row-actions" style="gap:6px;">
        <button class="icon-btn" data-action="accept-joint-request" data-id="${r.id}" style="color:var(--teal);">${icon('check')}</button>
        <button class="icon-btn del" data-action="decline-joint-request" data-id="${r.id}">${icon('x')}</button>
      </div>
    </div>`);
  });
  unread.forEach(m=>{
    const from = authState.users.find(u=>u.id===m.fromId);
    items.push(`<div class="notif-item" data-action="open-messages">
      <div class="avatar" style="background:${avatarColor(from)};width:32px;height:32px;font-size:12px;">${initials(from)}</div>
      <div class="info"><div class="name">${from?from.displayName:'?'}</div><div class="meta">${m.text}</div></div>
    </div>`);
  });
  pendingAccountRequests().forEach(r=>{
    const from = authState.users.find(u=>u.id===r.fromId);
    const label = accountRequestLabel(r.type);
    items.push(`<div class="notif-item" data-action="open-parametres">
      <div class="avatar" style="background:${avatarColor(from)};width:32px;height:32px;font-size:12px;">${initials(from)}</div>
      <div class="info"><div class="name">${from?from.displayName:'?'}</div><div class="meta">${label}</div></div>
    </div>`);
  });
  if(myApprovedExportRequest()){
    items.push(`<div class="notif-item" data-action="open-parametres">
      <div class="avatar" style="background:${avatarColor(me)};width:32px;height:32px;font-size:12px;">${initials(me)}</div>
      <div class="info"><div class="name">Ton export est prêt</div><div class="meta">Va dans Paramètres pour le télécharger</div></div>
    </div>`);
  }
  myPendingExpenseDeleteRequestsReceived().forEach(r=>{
    const from = authState.users.find(u=>u.id===r.fromId);
    items.push(`<div class="notif-item">
      <div class="avatar" style="background:${avatarColor(from)};width:32px;height:32px;font-size:12px;">${initials(from)}</div>
      <div class="info"><div class="name">${r.itemLabel}</div><div class="meta">${from?from.displayName:'?'} souhaite retirer cette ligne du compte joint</div></div>
      <div class="row-actions" style="gap:6px;">
        <button class="icon-btn" data-action="approve-expense-delete" data-id="${r.id}" style="color:var(--teal);">${icon('check')}</button>
        <button class="icon-btn del" data-action="decline-expense-delete" data-id="${r.id}">${icon('x')}</button>
      </div>
    </div>`);
  });
  panel.innerHTML = `
    <div class="notif-head"><span>Notifications</span><button class="icon-btn" data-action="close-notif">${icon('x')}</button></div>
    <div class="notif-body">
      ${items.length===0 ? `<div class="cp-empty">${icon('bell')}<br>Rien de nouveau.</div>` : items.join('')}
    </div>`;
}

/* ============================== SONDAGE PÉRIODIQUE (quasi temps-réel) ============================== */
let pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollNow, 45000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
async function pollNow(){
  if(document.getElementById('modal-root').innerHTML) return; // ne pas perturber une saisie en cours
  if(!ghConfigured()) return;
  const beforeCount = notifBadgeCount();
  const touchedSocial = await ghPullSocial(true);
  // Le budget n'est rafraîchi en tâche de fond que sur la page compte joint,
  // pour limiter les appels — la fusion sûre (mergeOwned) protège de toute
  // façon tes propres saisies en cours, même ailleurs.
  const touchedBudget = (currentView==='compteJoint') ? await ghPullBudget(true) : false;
  if(!touchedSocial && !touchedBudget) return;
  const afterCount = notifBadgeCount();
  if(afterCount > beforeCount) notifyBrowser(afterCount - beforeCount);
  renderSidebar();
  renderNotifPanel();
  if(currentView==='compteJoint' || currentView==='parametres'){ await render(); }
}
function notifyBrowser(n){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  try{ new Notification('Solde', { body: n>1 ? `${n} nouvelles notifications` : 'Nouvelle notification' }); }catch(e){}
}

function toggleChat(force){
  chatOpen = force!==undefined ? force : !chatOpen;
  document.getElementById('claude-panel').classList.toggle('open', chatOpen);
  if(chatOpen) renderChatPanel();
}
function renderChatPanel(){
  const panel = document.getElementById('claude-panel');
  panel.innerHTML = `
    <div class="cp-head"><span class="dot"></span><span class="t">Assistant budget</span><button class="icon-btn" data-action="close-chat">${icon('x')}</button></div>
    <div class="cp-body" id="cp-body">
      ${chatHistory.length===0 ? `<div class="cp-empty">${icon('bot')}<br>Demande-moi des conseils sur ton budget, ou comment tu pourrais faire évoluer ce site.</div>` : chatHistory.map(m=>`<div class="cp-msg ${m.role}">${escapeHTML(m.content)}</div>`).join('')}
    </div>
    <div class="cp-foot">
      <textarea id="cp-input" placeholder="Écris un message…" enterkeyhint="send"></textarea>
      <button class="cp-send" id="cp-send">${icon('send')}</button>
    </div>`;
  const body = document.getElementById('cp-body'); body.scrollTop = body.scrollHeight;
  const input = document.getElementById('cp-input');
  document.getElementById('cp-send').onclick = sendChatMessage;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); } });
  input.focus();
}
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function budgetContextSummary(){
  const key = state.selectedMonth;
  const d = dashboardData(key);
  return `Contexte budget (${monthLabel(key)}) : revenu ${fmtEUR(d.revenu)}, dépenses totales ${fmtEUR(d.totalDepenses)}, solde ${fmtEUR(d.solde)}. `+
    `Abonnements actifs mensuels : ${fmtEUR(abonnementsTotalMensuel())}. Charges fixes hors compte joint : ${fmtEUR(d.chargesHorsCJ)}. `+
    `Virement compte joint : ${fmtEUR(d.virementCJ)}. Épargne objectifs à provisionner : ${fmtEUR(d.epargneObj)}. `+
    `Objectifs en cours : ${mine(state.objectifs).map(o=>o.nom+' ('+Math.round(objectifCalc(o).pct*100)+'%)').join(', ')||'aucun'}.`;
}
async function sendChatMessage(){
  const input = document.getElementById('cp-input');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  chatHistory.push({role:'user', content:text});
  persistChat(); renderChatPanel();
  const body = document.getElementById('cp-body');
  const typing = document.createElement('div');
  typing.className='cp-msg assistant'; typing.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  body.appendChild(typing); body.scrollTop = body.scrollHeight;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key': claudeKey(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:1000,
        system: `Tu es l'assistant intégré au site de budget personnel "Solde" de l'utilisateur. Réponds en français, de façon chaleureuse et concise. Tu peux donner des conseils financiers généraux (pas de conseil réglementé), expliquer les chiffres du tableau de bord, ou suggérer des idées d'amélioration pour le site. ${budgetContextSummary()}`,
        messages: chatHistory.slice(-16).map(m=>({role:m.role, content:m.content}))
      })
    });
    const data = await res.json();
    typing.remove();
    if(data.error){ chatHistory.push({role:'assistant', content:'Erreur API : '+(data.error.message||'clé invalide ou quota dépassé.')}); }
    else{
      const textOut = (data.content||[]).map(b=>b.text||'').join('\n').trim() || 'Pas de réponse.';
      chatHistory.push({role:'assistant', content:textOut});
    }
  }catch(e){
    typing.remove();
    chatHistory.push({role:'assistant', content:'Impossible de contacter Claude — vérifie ta connexion ou ta clé API.'});
  }
  persistChat(); renderChatPanel();
}
function persistChat(){ chatHistory = chatHistory.slice(-30); localStorage.setItem('claude_chat_msgs', JSON.stringify(chatHistory)); }

/* ============================== BOOT ============================== */
async function boot(){
  await loadState();
  if(ghConfigured()){ await ghPull().catch(()=>{}); }
  const ok = await renderAuthGate();
  if(!ok) return;
  currentView = 'dashboard';
  await render();
  updateFab();
  if(ghConfigured()) startPolling();
}
(async function init(){
  await boot();
})();
</script>
