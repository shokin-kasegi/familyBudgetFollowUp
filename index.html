/* ---------- Filtre des graphiques du tableau de bord ---------- */
/* Permet de choisir la dimension de regroupement (catégorie ou nom) et
   d'exclure certaines valeurs de cette dimension, indépendamment pour
   chaque graphique. Même mécanique "Excel" (panneau à cases à cocher,
   validé par OK) que le filtre des tableaux, mais l'état confirmé vit
   dans state.chartFilters plutôt que state.tableFilters. */
let chartFilterOpen = null;          // clé du graphique dont le panneau est ouvert ('depRepartition' | 'revAnnuel')
let chartFilterPendingDim = null;    // dimension en cours d'édition dans le panneau ouvert
let chartFilterPendingChecked = null; // Set des valeurs cochées (= incluses) pour cette dimension, en cours d'édition

function chartFilterState(chartKey){
  if(!state.chartFilters) state.chartFilters = {};
  if(!state.chartFilters[chartKey]) state.chartFilters[chartKey] = { dim:'categorie', excluded:{categorie:[], libelle:[]} };
  if(!state.chartFilters[chartKey].excluded) state.chartFilters[chartKey].excluded = {categorie:[], libelle:[]};
  return state.chartFilters[chartKey];
}
function chartFilterActive(chartKey){
  const f = chartFilterState(chartKey);
  return (f.excluded[f.dim]||[]).length>0;
}
function chartValueLabel(item, dim){
  const v = item[dim] && String(item[dim]).trim();
  if(v) return v;
  return dim==='categorie' ? 'Sans catégorie' : (item.libelle || 'Sans nom');
}
function depRepartitionItems(key){
  return mine(state.depenses).filter(d=>d.modePaiement!=='Previsionnelle')
    .map(d=>({ libelle:d.libelle, categorie:d.categorie, montant:r2(depenseMensualiteDuMois(d,key)), poste:posteOfDepense(d) }))
    .filter(it=>it.montant>0.01);
}
function revAnnuelItemsForMonth(key){
  const items = [];
  mine(state.revenusRecurrents).forEach(r=>{ if(inRangeMonth(key, r.dateDebut, r.dateFin)) items.push({libelle:r.libelle, categorie:r.categorie, montant:Number(r.montant)||0}); });
  const {start,end} = monthBounds(key);
  mine(state.revenusExceptionnels).forEach(r=>{
    const d = r.date ? new Date(r.date+'T00:00:00') : null;
    if(d && d>=start && d<=end) items.push({libelle:r.libelle, categorie:r.categorie, montant:Number(r.montant)||0});
  });
  return items;
}
function revAnnuelItemsForYear(year){
  const items = [];
  for(let m=1;m<=12;m++) items.push(...revAnnuelItemsForMonth(monthKey(year,m)));
  return items;
}
function chartItemsFor(chartKey){
  if(chartKey==='depRepartition') return depRepartitionItems(state.selectedMonth);
  if(chartKey==='revAnnuel') return revAnnuelItemsForYear(Number(state.selectedMonth.slice(0,4)));
  return [];
}
function chartDistinctValuesForDim(items, dim){
  const set = new Set(items.map(it=>chartValueLabel(it, dim)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
}
function chartFilteredGrouped(chartKey){
  const f = chartFilterState(chartKey);
  const excluded = new Set(f.excluded[f.dim]||[]);
  const map = new Map();
  chartItemsFor(chartKey).forEach(it=>{
    const label = chartValueLabel(it, f.dim);
    if(excluded.has(label)) return;
    const e = map.get(label) || {label, value:0, postes:{}};
    e.value = r2(e.value + it.montant);
    if(it.poste) e.postes[it.poste] = r2((e.postes[it.poste]||0) + it.montant);
    map.set(label, e);
  });
  return Array.from(map.values()).filter(p=>p.value>0.004).sort((a,b)=>b.value-a.value);
}
function revAnnuelFilteredTotalForMonth(key){
  const f = chartFilterState('revAnnuel');
  const excluded = new Set(f.excluded[f.dim]||[]);
  return revAnnuelItemsForMonth(key).reduce((s,it)=> excluded.has(chartValueLabel(it, f.dim)) ? s : s + it.montant, 0);
}
function chartFilterButtonHTML(chartKey, secondDimLabel){
  const active = chartFilterActive(chartKey);
  const isOpen = chartFilterOpen === chartKey;
  return `<span class="th-filter-wrap chart-filter-wrap">
    <button class="th-filter-btn ${active?'active':''}" data-action="toggle-chart-filter" data-chart="${chartKey}" title="Filtrer le graphique" aria-label="Filtrer le graphique">${icon('filterDown')}</button>
    ${isOpen ? chartFilterPanelHTML(chartKey, secondDimLabel) : ''}
  </span>`;
}
function chartFilterPanelHTML(chartKey, secondDimLabel){
  const dim = chartFilterPendingDim;
  const values = chartDistinctValuesForDim(chartItemsFor(chartKey), dim);
  const shown = colFilterSearch ? values.filter(v=>v.toLowerCase().includes(colFilterSearch.toLowerCase())) : values;
  const allChecked = shown.length>0 && shown.every(v=>chartFilterPendingChecked.has(v));
  return `
    <div class="col-filter-panel chart-filter-panel" data-chart="${chartKey}">
      <div class="cf-dim-row">
        <button type="button" class="${dim==='categorie'?'active':''}" data-action="chart-filter-set-dim" data-chart="${chartKey}" data-dim="categorie">Catégorie</button>
        <button type="button" class="${dim==='libelle'?'active':''}" data-action="chart-filter-set-dim" data-chart="${chartKey}" data-dim="libelle">${secondDimLabel}</button>
      </div>
      <input type="text" class="cf-search" data-action="col-filter-search" placeholder="Rechercher…" value="${colFilterSearch.replace(/"/g,'&quot;')}">
      <div class="cf-list">
        <label class="cf-item"><input type="checkbox" data-action="chart-filter-toggle-all" data-chart="${chartKey}" ${allChecked?'checked':''}> <strong>(Tout sélectionner)</strong></label>
        ${shown.map(v=>`<label class="cf-item" data-value-row="${attrEsc(v)}"><input type="checkbox" data-action="chart-filter-toggle-value" data-chart="${chartKey}" data-value="${attrEsc(v)}" ${chartFilterPendingChecked.has(v)?'checked':''}> ${esc(v)}</label>`).join('')}
      </div>
      <div class="cf-actions">
        <button class="btn btn-primary btn-sm" data-action="chart-filter-ok" data-chart="${chartKey}">${icon('check')}OK</button>
        <button class="btn btn-ghost btn-sm" data-action="chart-filter-cancel">Annuler</button>
      </div>
    </div>`;
}
function chartFilterActiveBarHTML(chartKey){
  return `<div class="row-actions" style="justify-content:flex-start;margin-bottom:10px;"><button class="btn btn-ghost btn-sm" data-action="clear-chart-filter" data-chart="${chartKey}">${icon('x')}Réinitialiser le filtre</button></div>`;
}

/* ============================== FILTRE GÉNÉRIQUE (façon Excel) ============================== */
/* Réutilisé sur toutes les pages ayant des tableaux de saisies : tri
   croissant/décroissant par colonne + sélection des valeurs à afficher
   (cases à cocher). L'état confirmé (après OK) vit dans state.tableFilters,
   par nom de table ; l'état en cours d'édition du panneau ouvert vit en
   mémoire (colFilterOpen/colFilterPending), pour ne synchroniser qu'à la
   validation (Annuler ne doit rien changer, comme dans Excel). */
let colFilterOpen = null;      // { table, col }
const depGroupsOpen = new Set(); // libellés (normalisés) dont le détail est déplié dans « Achats et échéanciers »
let colFilterPending = null;   // Set des valeurs cochées, en cours d'édition
let colFilterSearch = '';      // texte de recherche dans le panneau ouvert

function tableFilterState(table){
  if(!state.tableFilters) state.tableFilters = {};
  if(!state.tableFilters[table] || !state.tableFilters[table].selected){
    state.tableFilters[table] = { sortCol:null, sortDir:'asc', selected:{} };
  }
  return state.tableFilters[table];
}
function tableFilterActive(table){
  const f = tableFilterState(table);
  return Object.values(f.selected).some(v=>v!==null && v!==undefined);
}
function applyTableFilterAndSort(table, columns, arr){
  const f = tableFilterState(table);
  let out = arr.filter(item=>{
    for(const col in f.selected){
      const sel = f.selected[col];
      if(sel && columns[col] && !sel.includes(String(columns[col].get(item)))) return false;
    }
    return true;
  });
  if(f.sortCol && columns[f.sortCol]){
    const {type, get} = columns[f.sortCol];
    out = [...out].sort((a,b)=>{
      let va=get(a), vb=get(b);
      if(type==='text'){ va=String(va).toLowerCase(); vb=String(vb).toLowerCase(); }
      if(va<vb) return f.sortDir==='asc'?-1:1;
      if(va>vb) return f.sortDir==='asc'?1:-1;
      return 0;
    });
  }
  return out;
}
function colDistinctValues(table, columns, col, arr){
  return Array.from(new Set(arr.map(item=>String(columns[col].get(item))))).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
}
function colFilterHeaderHTML(table, columns, col, arr){
  const c = columns[col];
  const f = tableFilterState(table);
  const active = !!f.selected[col] || f.sortCol===col;
  const isOpen = colFilterOpen && colFilterOpen.table===table && colFilterOpen.col===col;
  return `<th${c.type==='number'?' class="num"':''}><span class="th-filter-wrap">${c.label}<button class="th-filter-btn ${active?'active':''}" data-action="toggle-col-filter" data-table="${table}" data-col="${col}" aria-label="Filtrer ou trier la colonne">${icon('filterDown')}</button>${isOpen ? colFilterPanelHTML(table, columns, col, arr) : ''}</span></th>`;
}
function colFilterPanelHTML(table, columns, col, arr){
  const c = columns[col];
  const values = colDistinctValues(table, columns, col, arr);
  const shown = colFilterSearch ? values.filter(v=>v.toLowerCase().includes(colFilterSearch.toLowerCase())) : values;
  const allChecked = shown.length>0 && shown.every(v=>colFilterPending.has(v));
  const isNumeric = c.type==='number';
  return `
    <div class="col-filter-panel" data-table="${table}" data-col="${col}">
      <div class="cf-sort-row">
        <button data-action="col-sort" data-table="${table}" data-col="${col}" data-dir="asc">${icon('sortAsc')}${isNumeric?'Croissant':'A à Z'}</button>
        <button data-action="col-sort" data-table="${table}" data-col="${col}" data-dir="desc">${icon('sortDesc')}${isNumeric?'Décroissant':'Z à A'}</button>
      </div>
      <input type="text" class="cf-search" data-action="col-filter-search" placeholder="Rechercher…" value="${colFilterSearch.replace(/"/g,'&quot;')}">
      <div class="cf-list">
        <label class="cf-item"><input type="checkbox" data-action="col-filter-toggle-all" ${allChecked?'checked':''}> <strong>(Tout sélectionner)</strong></label>
        ${shown.map(v=>`<label class="cf-item" data-value-row="${attrEsc(v)}"><input type="checkbox" data-action="col-filter-toggle-value" data-value="${attrEsc(v)}" ${colFilterPending.has(v)?'checked':''}> ${isNumeric?fmtEUR(Number(v)):esc(v)}</label>`).join('')}
      </div>
      <div class="cf-actions">
        <button class="btn btn-primary btn-sm" data-action="col-filter-ok">${icon('check')}OK</button>
        <button class="btn btn-ghost btn-sm" data-action="col-filter-cancel">Annuler</button>
      </div>
    </div>`;
}

function depGroupKey(d){ return String(d.libelle||'').trim().toLowerCase(); }
// Regroupe une liste (déjà filtrée et triée) par libellé, en gardant l'ordre de la
// première occurrence ; si le tri porte sur le montant, ce sont les totaux qui comptent.
function depGroups(list, key){
  const map = new Map();
  list.forEach(x=>{
    const k = depGroupKey(x);
    if(!map.has(k)) map.set(k, {key:k, items:[], total:0});
    map.get(k).items.push(x);
  });
  const groups = [...map.values()];
  groups.forEach(g=>{ g.total = sumR2(g.items, x=>depenseMensualiteDuMois(x,key)); });
  const f = tableFilterState('depenses');
  if(f.sortCol==='montant') groups.sort((a,b)=> f.sortDir==='asc' ? a.total-b.total : b.total-a.total);
  return groups;
}

/* ============================== CATÉGORIES (personnalisables, dépenses & revenus) ============================== */
// Chacun gère sa propre liste de catégories (créer/supprimer directement depuis le
// menu déroulant « Catégorie ») — seules les siennes apparaissent dans ses formulaires.
// Une même mécanique (ajout via « Autre… », suppression via la croix affichée dans
// la liste) est partagée par les dépenses et les revenus ; seul le tableau d'état
// et les lignes à nettoyer quand une catégorie est supprimée diffèrent.
const CATEGORY_TYPES = {
  depenses: {
    stateKey: 'categoriesDepenses',
    clearFrom(nom){ mine(state.depenses).forEach(d=>{ if(d.categorie===nom) d.categorie=''; }); }
  },
  revenus: {
    stateKey: 'categoriesRevenus',
    clearFrom(nom){
      mine(state.revenusRecurrents).forEach(r=>{ if(r.categorie===nom) r.categorie=''; });
      mine(state.revenusExceptionnels).forEach(r=>{ if(r.categorie===nom) r.categorie=''; });
    }
  },
  objectifs: {
    stateKey: 'categoriesObjectifs',
    clearFrom(nom){ mine(state.objectifs).forEach(o=>{ if(o.categorie===nom) o.categorie=''; }); }
  },
  charges: {
    stateKey: 'categoriesCharges',
    clearFrom(nom){ mine(state.charges).forEach(c=>{ if(c.categorie===nom) c.categorie=''; }); }
  }
};
function seedDefaultCategoriesDep(userId){
  CATS_DEP.forEach(nom=>{ state.categoriesDepenses.push({id:uid(), ownerId:userId, nom}); });
}
function seedDefaultCategoriesRev(userId){
  CATS_REV.forEach(nom=>{ state.categoriesRevenus.push({id:uid(), ownerId:userId, nom}); });
}
function seedDefaultCategoriesObj(userId){
  CATS_OBJ.forEach(nom=>{ state.categoriesObjectifs.push({id:uid(), ownerId:userId, nom}); });
}
function seedDefaultCategoriesCharges(userId){
  CATS_CHARGES.forEach(nom=>{ state.categoriesCharges.push({id:uid(), ownerId:userId, nom}); });
}
function myCategories(type){
  return mine(state[CATEGORY_TYPES[type].stateKey]).slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
}
function myCategoriesDep(){ return myCategories('depenses'); }
function addCategory(type, nom){
  nom = (nom||'').trim();
  if(!nom) return {ok:false, msg:'Donne un nom à la catégorie'};
  if(myCategories(type).some(c=>c.nom.toLowerCase()===nom.toLowerCase())) return {ok:false, msg:'Cette catégorie existe déjà'};
  const cat = {id:uid(), ownerId:currentUser().id, nom};
  state[CATEGORY_TYPES[type].stateKey].push(cat);
  return {ok:true, cat};
}
// Supprimer une catégorie retire aussi ce choix de toutes les lignes déjà
// saisies qui l'utilisaient (dépense, revenu récurrent ou exceptionnel) —
// leur champ Catégorie repasse simplement à vide, la ligne elle-même reste.
function deleteCategory(type, id){
  const item = mine(state[CATEGORY_TYPES[type].stateKey]).find(c=>c.id===id);
  if(!item) return null;
  CATEGORY_TYPES[type].clearFrom(item.nom);
  state[CATEGORY_TYPES[type].stateKey] = state[CATEGORY_TYPES[type].stateKey].filter(c=>c.id!==item.id);
  return item;
}
function depense_fields(){
  return [
    {key:'libelle', label:'Libellé', placeholder:'Canapé, restaurant, réparation, Netflix…'},

    {key:'date', label:'Date de la dépense', type:'date', showIf:(v)=>v.modePaiement==='Unique'},

    {key:'nbMensualites', label:'Nombre de mensualités', type:'number', step:'1', showIf:(v)=>v.modePaiement==='Echelonne'},
    {key:'priorite', label:'Priorité', type:'select', options:['Haute','Moyenne','Basse'], showIf:(v)=>v.modePaiement==='Previsionnelle'},
    {key:'frequence', label:'Fréquence', type:'select', options:['Mensuel','Hebdomadaire','Journalier','Trimestriel','Annuel'], showIf:(v)=>v.modePaiement==='Recurrent'},
    {key:'statut', label:'Statut', type:'select', options:['Actif','Inactif'], showIf:(v)=>v.modePaiement==='Recurrent'},
    {key:'notes', label:'Commentaire', placeholder:'Facultatif'},
  ];
}
function depenseValidationErrors(data){
  const errors = [];
  if(!data.libelle || !String(data.libelle).trim()) errors.push(['libelle','Renseigne un libellé']);
  if(!data.montant || Number(data.montant)<=0) errors.push(['montant','Renseigne un montant supérieur à 0']);
  if(data.modePaiement==='Echelonne'){
    if(!data.dateDebut) errors.push(['dateDebut','Renseigne une date de début']);
    if(!data.nbMensualites || data.nbMensualites<1) errors.push(['nbMensualites','Renseigne au moins 1 mensualité']);
  } else if(data.modePaiement==='Unique'){
    if(!data.date) errors.push(['date','Renseigne une date']);
  }
  return errors;
}
// Ouvre la modale de modification d'une dépense. overrideValues permet de
// forcer certains champs à l'ouverture (ex. Type=Unique pour « Planifier
// une date », afin que le champ Date apparaisse tout de suite).
function openDepenseEditModal(depenseId, overrideValues){
  const base = mine(state.depenses).find(x=>x.id===depenseId);
  const values = overrideValues ? {...base, ...overrideValues} : base;
  openModal('Modifier la dépense', depense_fields(), values, async (data)=>{
    const errors = depenseValidationErrors(data);
    if(errors.length){ errors.forEach(([key,msg])=>markFieldError(key,msg)); toast(errors[0][1]); return false; }
    const dep = mine(state.depenses).find(x=>x.id===depenseId);
    const wasEchelonne = dep.modePaiement==='Echelonne', prevMoisRetires = dep.moisRetires;
    const wasPrevisionnelle = dep.modePaiement==='Previsionnelle';
    dep.libelle=data.libelle; dep.categorie=data.categorie; dep.compte=data.compte; dep.montant=data.montant; dep.modePaiement=data.modePaiement; dep.notes=(data.notes||'').trim();
    delete dep.date; delete dep.dateDebut; delete dep.nbMensualites; delete dep.moisRetires; delete dep.priorite; delete dep.frequence; delete dep.statut;
    if(data.modePaiement==='Echelonne'){ dep.dateDebut=data.dateDebut; dep.nbMensualites=data.nbMensualites; dep.moisRetires = wasEchelonne ? (prevMoisRetires||[]) : []; }
    else if(data.modePaiement==='Previsionnelle'){ dep.priorite=data.priorite; }
    else if(data.modePaiement==='Recurrent'){ dep.frequence=data.frequence; dep.statut=data.statut; }
    else{ dep.date=data.date; }
    const justPlanned = wasPrevisionnelle && data.modePaiement!=='Previsionnelle';
    await persist(); await render(); toast(justPlanned ? 'Dépense planifiée' : 'Dépense mise à jour'); },
    '<div id="depense-preview" class="field-note" style="margin-top:-8px;margin-bottom:14px;min-height:16px;"></div>');
  setTimeout(setupDepensePreview, 0);
}
// Visibilité des champs (date/échelonné/priorité/fréquence/statut) gérée
// génériquement via showIf dans depense_fields() ; il ne reste ici que le
// calcul d'aperçu de la mensualité, propre à ce formulaire.
function setupDepensePreview(){
  const sel = document.getElementById('f_modePaiement');
  const montantEl = document.getElementById('f_montant');
  const nbEl = document.getElementById('f_nbMensualites');
  const preview = document.getElementById('depense-preview');
  if(!sel || !preview) return;
  function updatePreview(){
    if(sel.value!=='Echelonne'){ preview.innerHTML=''; return; }
    const montant = parseFloat(montantEl?.value)||0;
    const nb = parseInt(nbEl?.value)||0;
    if(nb<1){ preview.innerHTML = 'Renseigne le nombre de mensualités pour voir le calcul.'; return; }
    const mensualite = montant/nb;
    preview.innerHTML = `→ <strong style="color:var(--text);">${nb}</strong> mensualité${nb>1?'s':''} de <strong style="color:var(--text);">${fmtEURPrecise(mensualite)}</strong>`;
  }
  sel.addEventListener('change', updatePreview);
  montantEl?.addEventListener('input', updatePreview);
  nbEl?.addEventListener('input', updatePreview);
  updatePreview();
}

function echeanceStatut(d, key){

function renderEchHistorique(d, key){

// Rythme réel : moyenne des versements par mois depuis le début de l'objectif.
function objectifRythme(o){
  const c = objectifCalc(o);
  if(c.pct>=1) return 'Objectif atteint';
  if(c.verse<=0) return 'Aucun versement pour l’instant';
  const cur = currentMonthKey();
  const start = (o.dateDebut||cur).slice(0,7);
  let elapsed = 1; for(let k=start; k<cur; k=addMonths(k,1)) elapsed++;
  const avg = c.verse/elapsed;
  const reach = addMonths(cur, Math.ceil(c.restant/avg));
  if(!o.dateFin || reach <= o.dateFin.slice(0,7)) return `À ce rythme : atteint en ${monthLabel(reach)}`;
  const total = objectifMoisRestants(o);
  const attendu = r2((Number(o.montantCible)||0) * Math.min(elapsed/total,1));
  return attendu>c.verse ? `À ce rythme : en retard de ${fmtEUR0(attendu - c.verse)}` : `À ce rythme : atteint en ${monthLabel(reach)}`;
}

function renderMessagesList(partner){
  const me = currentUser();
  const msgs = socialState.messages.filter(m=>(m.fromId===me.id && m.toId===partner.id) || (m.fromId===partner.id && m.toId===me.id))
    .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

// Indice visuel de défilement horizontal : un tableau qui déborde (fréquent
// sur mobile, où les colonnes — et parfois les boutons d'action — sortent de
// l'écran) reçoit un léger fondu sur le(s) bord(s) qui cachent du contenu,
// pour signaler qu'on peut faire glisser. Pas de fondu si tout tient déjà,
// et le fondu du côté déjà atteint disparaît une fois qu'on y a défilé.
function updateTableScrollHints(){
  document.querySelectorAll('.table-wrap').forEach(w=>{
    const canScroll = w.scrollWidth > w.clientWidth + 1;
    const atStart = w.scrollLeft <= 1;
    const atEnd = w.scrollLeft >= w.scrollWidth - w.clientWidth - 1;
    w.classList.toggle('scroll-fade-left', canScroll && !atStart);
    w.classList.toggle('scroll-fade-right', canScroll && !atEnd);
    if(!w.dataset.scrollHintBound){
      w.dataset.scrollHintBound = '1';
      w.addEventListener('scroll', updateTableScrollHints, {passive:true});
    }
  });
}
function afterRender(){
  // Un souci ponctuel de graphique ou d'animation ne doit jamais interrompre
  // le reste de l'application (notifications, sync...).
  try{
    updateTableScrollHints();
    if(currentView==='dashboard') dashAfterRender();
    if(currentView==='releve') releveAfterRender();
    else animateView();
    redrawCurrentCharts();
    if(currentView==='analyse'){
      const input = document.getElementById('analyse-search');
      if(input) input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); handleAction('run-analyse'); } });
    }
    if(currentView==='compteJoint'){
      markMessagesRead();
      const input = document.getElementById('msg-input');
      if(input) input.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleAction('send-message'); } });
      const list = document.getElementById('joint-messages');
      if(list) list.scrollTop = list.scrollHeight;
    }
  }catch(e){ console.error('afterRender: erreur non bloquante', e); }
}
// Les graphiques sont en SVG, dessinés à la largeur réelle : on les redessine
// quand la mise en page change (passage téléphone / bureau).

// Lignes de tableau et notifications cliquables : activables au clavier (Entrée / Espace),
// et le focus est rendu à l'élément équivalent une fois la vue redessinée.
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target;
  if(!el.matches || !el.matches('[data-action][tabindex="0"]:not(button)')) return;
  e.preventDefault();
  const sel = `[data-action="${el.dataset.action}"]` + (el.dataset.id ? `[data-id="${el.dataset.id}"]` : '') + (el.dataset.k ? `[data-k="${el.dataset.k}"]` : '');
  motionInstant = true; // une action au clavier ne s'anime pas
  try{ el.dispatchEvent(new MouseEvent('click', {bubbles:true})); } finally { motionInstant = false; }
  setTimeout(()=>{ const again = document.querySelector(sel); if(again && !again.closest('[hidden]')) again.focus(); }, 60);
});
// Tableau de bord : ← et → changent de mois, sans animation (une action
// répétée au clavier ne s'anime jamais).
document.addEventListener('keydown', async (e)=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(currentView!=='dashboard' || !currentUser() || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if(document.querySelector('#modal-root .modal') || colFilterOpen || chartFilterOpen) return;
  if(e.target.closest && e.target.closest('input,textarea,select,[contenteditable],#sidebar,#island,.ychart')) return;
  e.preventDefault();
  const dir = e.key==='ArrowLeft' ? -1 : 1;
  motionInstant = true;
  try{ await changeMonth(addMonths(state.selectedMonth, dir), dir); } finally { motionInstant = false; }
});
document.addEventListener('keydown', (e)=>{
  // Tab reste à l'intérieur de la modale ouverte (piège de focus).
  if(e.key==='Tab' && document.querySelector('#modal-root .modal')){
    const els = modalFocusables();
    if(!els.length) return;
    const first = els[0], last = els[els.length-1];
    const outside = !els.includes(document.activeElement);
    if(e.shiftKey && (outside || document.activeElement===first)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (outside || document.activeElement===last)){ e.preventDefault(); first.focus(); }
    return;
  }
  if(e.target.classList && e.target.classList.contains('cat-add-input') && e.key==='Enter'){
    e.preventDefault();
    e.target.closest('.cat-add-input-row')?.querySelector('[data-cat-add-confirm]')?.click();
    return;
  }
  if(e.key!=='Enter' && e.key!=='Escape') return;
  if(e.isComposing || e.defaultPrevented) return;
  // Raccourcis clavier universels : Entrée valide, Échap annule — sur toutes
  // les fenêtres (modales de saisie, confirmations de suppression, panneaux de filtre).
  const modalOpen = !!document.querySelector('#modal-root .modal');
  if(e.key==='Escape'){
    // Un menu de catégorie ouvert se referme d'abord, sans fermer la modale.
    const openCat = document.querySelector('.cat-select.open');
    if(openCat){ e.preventDefault(); openCat.classList.remove('open'); resetCatDropdown(openCat); return; }
    const openUserMenu = !modalOpen && document.querySelector('.user-row.actions-open');
    if(openUserMenu){ e.preventDefault(); closeUserActionMenus(); openUserMenu.querySelector('.user-more')?.focus(); return; }
    if(modalOpen){ e.preventDefault(); closeModal(); return; }
    const panelCancel = (colFilterOpen || chartFilterOpen) && document.querySelector('[data-action="col-filter-cancel"],[data-action="chart-filter-cancel"]');
    if(panelCancel){ e.preventDefault(); panelCancel.click(); return; }
    if(notifOpen){ e.preventDefault(); toggleNotifPanel(false); return; }
    return;
  }
  // Entrée : on laisse le comportement natif sur les boutons (activation du bouton
  // ciblé) et sur les zones de texte multilignes (retour à la ligne).
  const tag = e.target.tagName;
  if(tag==='BUTTON' || tag==='TEXTAREA' || tag==='A') return;
  if(e.target.closest && e.target.closest('.cat-select.open')) return;
  if(modalOpen){
    const yes = document.getElementById('del-yes');
    if(yes){ e.preventDefault(); yes.click(); return; }
    const form = document.getElementById('modal-form');
    const submit = form?.querySelector('button[type=submit]');
    if(form && submit){ e.preventDefault(); if(!submit.disabled) form.requestSubmit(submit); }
    return;
  }
  const panelOk = document.querySelector('[data-action="col-filter-ok"],[data-action="chart-filter-ok"]');
  if(panelOk && (colFilterOpen || chartFilterOpen)){ e.preventDefault(); panelOk.click(); }
});

async function handleAction(action, id, el){

  switch(action){
    /* Revenus récurrents */
    case 'add-revrec': openModal('Ajouter un revenu récurrent', revrecFields(), {categorie:(myCategories('revenus').find(c=>c.nom==='Salaire')||myCategories('revenus')[0]||{}).nom||'', dateDebut: defaultDateForSelectedMonth()}, async (data)=>{

      if(Number(data.montant)<0){ markFieldError('montant','Un revenu ne peut pas être négatif'); toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense récurrente.'); return false; }

      Object.assign(find(mine(state.revenusRecurrents)), data); await persist(); await render(); toast('Revenu mis à jour'); }); break;
    case 'del-revrec': { const item=find(mine(state.revenusRecurrents)); confirmDelete(item.libelle, async ()=>{ state.revenusRecurrents = state.revenusRecurrents.filter(x=>x.id!==id); await persist(); await render(); toast('Revenu supprimé'); }); break; }

    /* Revenus exceptionnels */
    case 'add-revexc': openModal('Ajouter une rentrée exceptionnelle', revexcFields(), {date:defaultDateForSelectedMonth(), categorie:(myCategories('revenus').find(c=>c.nom==='Autre')||myCategories('revenus')[0]||{}).nom||''}, async (data)=>{
      if(Number(data.montant)<0){ markFieldError('montant','Un revenu ne peut pas être négatif'); toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense exceptionnelle.'); return false; }
      if(reportFieldErrors(fieldRequiredErrors(revexcFields(), data))) return false;
      state.revenusExceptionnels.push({id:uid(), ownerId:currentUser().id, ...data}); await persist(); await render(); toast('Rentrée ajoutée'); }); break;
    case 'edit-revexc': openModal('Modifier la rentrée', revexcFields(), find(mine(state.revenusExceptionnels)), async (data)=>{
      if(Number(data.montant)<0){ markFieldError('montant','Un revenu ne peut pas être négatif'); toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense exceptionnelle.'); return false; }
      if(reportFieldErrors(fieldRequiredErrors(revexcFields(), data))) return false;
      Object.assign(find(mine(state.revenusExceptionnels)), data); await persist(); await render(); toast('Rentrée mise à jour'); }); break;
    case 'del-revexc': { const item=find(mine(state.revenusExceptionnels)); confirmDelete(item.libelle, async ()=>{ state.revenusExceptionnels = state.revenusExceptionnels.filter(x=>x.id!==id); await persist(); await render(); toast('Rentrée supprimée'); }); break; }

    /* Dépenses (uniques, échelonnées, récurrentes/abonnements, ou prévisionnelles) */

      const legacy = isAdmin() && !isValidUsername(u.username);

      openModal('Modifier le compte', fields, legacy ? {...u, username:suggestUsername(u)} : u, async (data)=>{

          if(authState.users.some(x=>x.id!==u.id && x.username===newUsername)){

          }

    case 'approve-account-request': {
      const req = socialState.accountRequests.find(r=>r.id===id);
      if(!req) break;
      const u = authState.users.find(x=>x.id===req.fromId);
      if(req.type==='export'){
        // On n'exporte plus directement côté admin : on approuve, et c'est la
        // personne concernée qui télécharge elle-même, une seule fois.
        req.status='approved'; await persistSocial(); await render(); renderNotifPanel(); toast('Demande approuvée — la personne peut maintenant télécharger ses données.'); break;
      }
      if(req.type==='reset'){
        // "Reset" : on vide les données mais on garde le compte (identifiants intacts).
        confirmDelete(u ? `les données de ${u.displayName} (demande approuvée)` : 'ces données', async ()=>{
          if(u){
            wipeUserData(u.id);
            if(u.jointWith){
              const partner = authState.users.find(x=>x.id===u.jointWith);
              if(partner){ partner.jointWith = null; untagJointExpenses([partner.id]); }
              u.jointWith = null;
              await persistAuth();
            }
          }
          req.status='done';
          socialState.accountRequests = socialState.accountRequests.filter(r=>r.id!==req.id);
          await Promise.all([persistSocial(), persist()]); await render(); renderNotifPanel(); toast('Données réinitialisées'); });
        break;
      }
      // type 'delete' : on redemande une confirmation explicite avant d'agir, c'est irréversible
      confirmDelete(u ? `le compte de ${u.displayName} (demande approuvée)` : 'ce compte', async ()=>{
        if(u){
          const partner = authState.users.find(x=>x.jointWith===u.id);
          if(partner){ partner.jointWith = null; untagJointExpenses([partner.id]); }
          authState.users = authState.users.filter(x=>x.id!==u.id);
          socialState.jointRequests = socialState.jointRequests.filter(r=>r.fromId!==u.id && r.toId!==u.id);
          wipeUserData(u.id);
        }
        req.status='done';
        socialState.accountRequests = socialState.accountRequests.filter(r=>r.id!==req.id);
        await Promise.all([persistAuth(), persistSocial(), persist()]); await render(); renderNotifPanel(); toast('Compte supprimé'); });
      break; }
    case 'decline-account-request': {
      const req = socialState.accountRequests.find(r=>r.id===id);
      if(req) req.status='declined';
      await persistSocial(); await render(); renderNotifPanel(); toast('Demande refusée'); break; }
    case 'download-my-export': {
      const req = myApprovedExportRequest();
      if(!req) break;
      exportUserData(currentUser().id);
      socialState.accountRequests = socialState.accountRequests.filter(r=>r.id!==req.id); // usage unique : la demande disparaît après téléchargement
      await persistSocial(); await render(); renderNotifPanel(); toast('Téléchargement effectué'); break; }

    /* Compte joint : demande de suppression d'une ligne appartenant au/à la partenaire */
    case 'request-delete-expense': {
      const itemId = el.dataset.itemId, itemType = el.dataset.itemType, itemLabel = el.dataset.itemLabel;
      const partner = jointPartner();
      if(!partner) break;
      if(existingExpenseDeleteRequest(itemId)) return toast('Une demande est déjà en attente pour cette ligne.');
      socialState.expenseDeleteRequests.push({id:uid(), fromId:currentUser().id, toId:partner.id, itemType, itemId, itemLabel, status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande de suppression envoyée'); break; }
    case 'approve-expense-delete': {
      const req = socialState.expenseDeleteRequests.find(r=>r.id===id);
      if(!req) break;
      const arr = itemArrayFor(req.itemType);
      const idx = arr.findIndex(x=>x.id===req.itemId);
      if(idx>=0) arr.splice(idx,1);
      req.status='done';
      socialState.expenseDeleteRequests = socialState.expenseDeleteRequests.filter(r=>r.id!==req.id);
      await Promise.all([persist(), persistSocial()]); await render(); renderNotifPanel(); toast('Ligne supprimée'); break; }
    case 'decline-expense-delete': {
      const req = socialState.expenseDeleteRequests.find(r=>r.id===id);
      if(req) req.status='declined';
      await persistSocial(); await render(); renderNotifPanel(); toast('Demande refusée'); break; }

    /* Compte joint : demandes */
    case 'send-joint-request': {
      const me = currentUser();
      if(me.jointWith) return toast('Tu as déjà un compte joint actif — quitte-le avant d\'en proposer un autre.');
      const toId = el.dataset.to;
      const target = authState.users.find(u=>u.id===toId);
      if(target && target.jointWith) return toast(`${target.displayName} a déjà un compte joint actif avec quelqu'un d'autre.`);
      if(socialState.jointRequests.some(r=>r.fromId===me.id && r.toId===toId && r.status==='pending')) return toast('Demande déjà envoyée');
      socialState.jointRequests.push({id:uid(), fromId:me.id, toId, status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande envoyée'); break; }
    case 'send-joint-request-by-username': {
      const me = currentUser();
      const errEl = document.getElementById('joint-target-error');
      if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
      if(me.jointWith) return toast('Tu as déjà un compte joint actif — quitte-le avant d\'en proposer un autre.');
      const inputEl = document.getElementById('joint-target-username');
      const uname = (inputEl?.value||'').trim().toLowerCase();
      if(!uname) return toast('Entre un identifiant.');
      const target = authState.users.find(u=>u.username===uname);
      if(!target){
        if(errEl){ errEl.textContent = 'Aucun compte trouvé avec cet identifiant.'; errEl.style.display=''; }
        else toast('Aucun compte trouvé avec cet identifiant.');
        return;
      }
      if(target.id===me.id) return toast('Tu ne peux pas te proposer un compte joint à toi-même.');
      if(target.jointWith) return toast(`${target.displayName} a déjà un compte joint actif avec quelqu'un d'autre.`);
      if(socialState.jointRequests.some(r=>r.fromId===me.id && r.toId===target.id && r.status==='pending')) return toast('Demande déjà envoyée');
      socialState.jointRequests.push({id:uid(), fromId:me.id, toId:target.id, status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande envoyée'); break; }
    case 'cancel-joint-request':
      socialState.jointRequests = socialState.jointRequests.filter(r=>r.id!==id);
      await persistSocial(); await render(); toast('Demande annulée'); break;
    case 'accept-joint-request': {
      const req = socialState.jointRequests.find(r=>r.id===id);
      if(!req) break;
      const me = currentUser();
      if(me.jointWith){ toast('Tu as déjà un compte joint actif.'); break; }
      const other = authState.users.find(u=>u.id===req.fromId);
      if(other && other.jointWith){ req.status='declined'; await persistSocial(); await render(); renderNotifPanel(); toast(`${other.displayName} a déjà rejoint un autre compte joint entre-temps.`); break; }
      req.status = 'accepted';
      me.jointWith = req.fromId; if(other) other.jointWith = me.id;
      await persistAuth(); await persistSocial(); await render(); renderNotifPanel(); toast('Compte joint accepté'); break; }
    case 'decline-joint-request': {
      const req = socialState.jointRequests.find(r=>r.id===id);
      if(req) req.status = 'declined';
      await persistSocial(); await render(); renderNotifPanel(); toast('Demande refusée'); break; }
    case 'break-joint': { const partnerName = (authState.users.find(u=>u.id===currentUser().jointWith)||{}).displayName || 'ton/ta partenaire';
      confirmDelete('votre compte joint', async ()=>{
      const me = currentUser(); const partner = authState.users.find(u=>u.id===me.jointWith);
      me.jointWith = null; if(partner) partner.jointWith = null;
      socialState.jointRequests = socialState.jointRequests.filter(r=>!((r.fromId===me.id||r.toId===me.id) && r.status==='accepted'));
      socialState.expenseDeleteRequests = socialState.expenseDeleteRequests.filter(r=>!(r.fromId===me.id||r.toId===me.id));
      untagJointExpenses(partner ? [me.id, partner.id] : [me.id]);
      await persistAuth(); await persistSocial(); await persist(); await render(); toast('Compte joint rompu'); },
      {title:'Quitter le compte joint ?', consequence:`Les lignes communes ne seront plus partagées avec ${esc(partnerName)} : elles redeviennent des dépenses perso.`, confirmLabel:'Quitter le compte joint'}); break; }

    /* Messagerie */
    case 'send-message': {
      const input = document.getElementById('msg-input');
      const text = input ? input.value.trim() : '';
      if(!text) break;
      const partner = jointPartner(); if(!partner) break;
      socialState.messages.push({id:uid(), fromId:currentUser().id, toId:partner.id, text, createdAt:new Date().toISOString(), readBy:[currentUser().id]});
      await persistSocial(); await render(); break; }

    /* Notifications */
    case 'toggle-notif-panel': toggleNotifPanel(); break;
    case 'enable-browser-notif': await enableBrowserNotifications(); await render(); break;

    /* Synchronisation GitHub */
    case 'gh-connect': {
      const token = document.getElementById('gh-token').value.trim();
      if(!token) return toast('Renseigne le jeton d\u2019accès');
      if(!(await isValidGhToken(token))) return toast('Ce jeton ne correspond pas au jeton attendu pour ce budget');
      try{
        await ghTestAndConnect(token);
        await ghPush(); // crée le fichier avec les données actuelles si le dépôt était vide
        await render(); toast('GitHub connecté');
      }catch(e){ toast('Connexion impossible — vérifie le jeton'); }
      break; }
    case 'gh-sync-now': { const ok = await ghPull(); await ghPush(); await render(); toast(ok!==false ? 'Synchronisé' : 'Synchronisé (nouveau fichier créé)'); break; }
    case 'export-data': exportData(); break;
    case 'import-data': document.getElementById('import-file-input').click(); break;

    /* Assistant Claude */
    case 'save-claude-key': { const v = document.getElementById('claude-key-input').value.trim(); if(!v) return; localStorage.setItem('claude_api_key', v); updateFab(); await render(); toast('Assistant activé'); break; }
    case 'remove-claude-key': localStorage.removeItem('claude_api_key'); updateFab(); await render(); toast('Clé retirée'); break;
  }
}

/* ============================== AUTH ============================== */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pass, salt){
  return sha256(salt + ':' + pass);
}
const REMEMBER_DAYS = 15;
function getSession(){
  // Session de l'onglet en cours (par défaut, ne survit pas à la fermeture du navigateur)
  try{
    const raw = sessionStorage.getItem('budget_session');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // "Rester connecté" — persiste jusqu'à 15 jours, vérifié à chaque ouverture
  try{
    const raw = localStorage.getItem('budget_session_remember');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.expiresAt && parsed.expiresAt > Date.now()) return {userId: parsed.userId};
      localStorage.removeItem('budget_session_remember'); // expiré
    }
  }catch(e){}
  return null;
}
function setSession(userId, remember){
  try{ sessionStorage.removeItem('budget_session'); }catch(e){}
  try{ localStorage.removeItem('budget_session_remember'); }catch(e){}
  if(remember){
    try{ localStorage.setItem('budget_session_remember', JSON.stringify({userId, expiresAt: Date.now() + REMEMBER_DAYS*24*60*60*1000})); }catch(e){}
  } else {
    try{ sessionStorage.setItem('budget_session', JSON.stringify({userId})); }catch(e){}
  }
}
function clearSession(){
  try{ sessionStorage.removeItem('budget_session'); }catch(e){}
  try{ localStorage.removeItem('budget_session_remember'); }catch(e){}
  try{ localStorage.removeItem('budget_session'); }catch(e){} // ancienne clé (avant cette mise à jour)
}
function currentUser(){ const s = getSession(); return s ? authState.users.find(u=>u.id===s.userId) : null; }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

async function renderAuthGate(){
  const root = document.getElementById('auth-root');
  const shell = document.getElementById('shell');
  const session = getSession();
  const loggedIn = session && authState.users.some(u=>u.id===session.userId);
  const me = loggedIn ? currentUser() : null;
  if(me && me.mustChangePassword){
    shell.style.display='none';
    root.style.display='flex';
    renderForcePasswordChangeScreen(me);
    return false;
  }
  if(loggedIn){
    root.style.display='none'; root.innerHTML='';
    shell.style.display='';
    return true;
  }
  shell.style.display='none';
  root.style.display='flex';
  if(authState.users.length===0){ renderSetupScreen(); } else { renderLoginScreen(); }
  return false;
}

    e.preventDefault();
    // Re-vérification du code juste avant la création : une protection uniquement
    // côté rendu ne suffit pas, on ne fait jamais confiance à l'état affiché seul.
    const hash = await sha256(verifiedCode);
    if(hash !== SETUP_CODE_HASH) return authError('Code invalide — recommence depuis le début.');
    const name = document.getElementById('su-name').value.trim();
    const username = document.getElementById('su-username').value.trim().toLowerCase();

    // Garantie de repartir totalement vierge : certains navigateurs partagent le
    // stockage entre fichiers locaux (file://) — on efface tout avant de créer
    // ce nouvel admin, pour ne jamais hériter de données d'un autre usage.
    try{
      localStorage.removeItem('budget_store');
      localStorage.removeItem('budget_auth');
      localStorage.removeItem('budget_social');
      localStorage.removeItem('budget_session');
      localStorage.removeItem('budget_session_remember');
      sessionStorage.removeItem('budget_session');
    }catch(e){}
    state = defaultState();
    authState = defaultAuth();
    socialState = defaultSocial();
    const salt = randomSalt();
    const passwordHash = await hashPassword(pass, salt);
    const user = {id:uid(), username, salt, passwordHash, displayName:name||username, role:'admin'};
    authState.users.push(user);
    seedDefaultCategoriesDep(user.id);
    seedDefaultCategoriesRev(user.id);
    seedDefaultCategoriesObj(user.id);
    seedDefaultCategoriesCharges(user.id);
    authState.setupCodeUsed = true; // le code ne pourra plus jamais resservir, même si ce compte est supprimé un jour
    await Promise.all([persist(), persistSocial(), persistAuth()]);
    setSession(user.id, document.getElementById('su-remember')?.checked);
    await boot();
  };

// Poste d'un terme cherché : celui des saisies qui le portent (majoritaire).
function analysePosteOf(term){
  const count = {};
  analyseMatchingEntries(term).forEach(({type,item,mine:isMine})=>{
    const k = !isMine ? 'joint' : type==='charge' ? 'fixe' : posteOfDepense(item);
    count[k] = (count[k]||0) + 1;
  });
  return Object.entries(count).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'achats';
}

    .map(t=>({t, total:sumR2(analyseMonthlyTotals(t, year), m=>m.total)}))

}

/* ============================== IMPORT DE RELEVÉ ============================== */
/* Le relevé de compte (CSV, OFX/QFX, QIF, PDF ou texte collé) est analysé dans
   le navigateur : rien n'est envoyé nulle part. Chaque opération devient une
   ligne pré-remplie (type, libellé, catégorie) que l'utilisateur valide ou
   ignore. Chaque décision enrichit l'apprentissage, propre à chaque compte et
   synchronisé avec le reste du budget (state.importApprentissage, un objet par
   utilisateur) :
   - formats : pour un CSV, quelles colonnes portent la date, le libellé et le
     montant — reconnues ensuite à l'en-tête du fichier, sans rien redemander ;
     pour un PDF, où se trouvent les colonnes Débit / Crédit ;
   - regles : pour un commerçant (libellé bancaire normalisé), ce que
     l'utilisateur en a fait et combien de fois de suite ;
   - mots : les mots des libellés comptés par type et catégorie, pour deviner
     un commerçant jamais vu à partir de ceux qui lui ressemblent ;
   - historique : suggestion juste (1) ou corrigée (0), pour mesurer les progrès. */
let releveSession = null;        // import en cours (null = aucun) ; recopié dans le localStorage de l'appareil
let releveSessionOwner = null;   // utilisateur auquel appartient releveSession chargée
let releveFocusApres = null;     // index de la ligne à focaliser après un re-render (validation au clavier)

function releveModele(creer){
  const me = currentUser();
  if(!Array.isArray(state.importApprentissage)) state.importApprentissage = [];
  let m = state.importApprentissage.find(x=>x.ownerId===me.id);
  if(!m){
    if(!creer) return {formats:{}, regles:{}, mots:{}, historique:[]};
    m = {id:uid(), ownerId:me.id, formats:{}, regles:{}, mots:{}, historique:[]};
    state.importApprentissage.push(m);
  }
  ['formats','regles','mots'].forEach(k=>{ if(!m[k] || typeof m[k]!=='object') m[k] = {}; });
  if(!Array.isArray(m.historique)) m.historique = [];
  return m;
}

/* ---------- Lecture des valeurs : libellés, montants, dates ---------- */
// Mots sans valeur pour reconnaître un commerçant : moyens de paiement,
// mentions SEPA, articles… « CB CARREFOUR 12/10 » et « CARTE X1234 CARREFOUR »
// donnent tous deux la clé « CARREFOUR » (les deux premiers mots qui restent).
const RELEVE_BRUIT = new Set(['CB','CARTE','CARTES','PAIEMENT','PAIEMT','PAI','PAR','PRLV','PRELEVEMENT','PRELEVT','PREL','SEPA','VIR','VIREMENT','VIRT','RECU','EMIS','INST','INSTANTANE','FACTURE','FACT','ACHAT','DU','LE','LA','LES','DE','DES','ET','EN','AU','AUX','SUR','POUR','CHEZ','REF','REFERENCE','MOTIF','ECH','ECHEANCE','MANDAT','ID','EMETTEUR','NUM','NO','DONNEUR','ORDRE','BENEF','BENEFICIAIRE','TPE','CONTACTLESS','SANS','CONTACT','EUR','EUROS','FR','SAS','SARL','SA','WWW','COM','HTTPS','HTTP','DATE','OPERATION','OPE','TRANSACTION','RUM','ICS','LIB']);
const RELEVE_HORS_OPS = /^(nouveau |ancien )?solde|^total|^sous[- ]total|^report|^montant (total|net)/i;
function releveSansAccents(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function releveMots(lib){
  return releveSansAccents(lib).toUpperCase()
    .replace(/\b\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/g,' ')
    .split(/[^A-Z0-9]+/)
    .filter(w=>w.length>=2 && !/\d/.test(w) && !RELEVE_BRUIT.has(w));
}
function releveCle(lib){
  const mots = releveMots(lib);
  if(mots.length) return mots.slice(0,2).join(' '); // deux mots : la ville ou le n° de magasin qui suivent varient d'un paiement à l'autre
  return releveSansAccents(lib).toUpperCase().replace(/[^A-Z]+/g,' ').trim().split(' ').slice(0,2).join(' ') || '?';
}
function releveJoli(cle){ return String(cle||'').toLowerCase().replace(/(^|\s)\S/g, c=>c.toUpperCase()); }
// « 1 234,56 », « -12,30 », « 1,234.56 », « 12.30- », « (12,30) », « 45,00 € » → nombre signé.
function releveMontant(s){
  if(s==null) return NaN;
  let t = String(s).replace(/[\s  €]|EUR/gi,'');
  if(!t) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1); }
  if(/[-−–]$/.test(t)){ neg = true; t = t.slice(0,-1); }
  if(/^[-−–]/.test(t)){ neg = true; t = t.slice(1); }
  else if(t[0]==='+') t = t.slice(1);
  if(!/^\d[\d.,']*$/.test(t)) return NaN;
  t = t.replace(/'/g,'');
  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  if(lc>-1 && ld>-1) t = lc>ld ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'');
  else if(lc>-1) t = t.split(',').length>2 ? t.replace(/,/g,'') : t.replace(',','.');
  else if(ld>-1 && t.split('.').length>2) t = t.replace(/\./g,'');
  const n = parseFloat(t);
  return isNaN(n) ? NaN : (neg ? -n : n);
}
const RELEVE_MOIS = {JAN:1,JANV:1,JANVIER:1,FEB:2,FEV:2,FEVR:2,FEVRIER:2,MAR:3,MARS:3,APR:4,AVR:4,AVRIL:4,MAY:5,MAI:5,JUN:6,JUIN:6,JUL:7,JUIL:7,JUILLET:7,AUG:8,AOU:8,AOUT:8,SEP:9,SEPT:9,SEPTEMBRE:9,OCT:10,OCTOBRE:10,NOV:11,NOVEMBRE:11,DEC:12,DECEMBRE:12};
function releveIso(y,m,d){
  if(!(m>=1 && m<=12 && d>=1 && d<=31 && y>=1990 && y<=2100)) return null;
  const dt = new Date(y, m-1, d);
  if(dt.getMonth()!==m-1) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
// ordre : 'dmy' (France) ou 'mdy'. anneeDefaut permet les dates sans année
// (« 12/10 » dans un PDF) ; sans elle, une date doit être complète — sinon un
// montant « 12.50 » passerait pour le 12 mai.
function releveDate(s, ordre, anneeDefaut){
  const t = String(s||'').trim();
  let m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?!\d)/.exec(t);
  if(m) return releveIso(+m[1], +m[2], +m[3]);
  m = /^(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?(?![\d.,])/.exec(t);
  if(m && (m[3] || anneeDefaut)){
    let y = m[3] ? +m[3] : anneeDefaut;
    if(y<100) y += 2000;
    return ordre==='mdy' ? releveIso(y, +m[1], +m[2]) : releveIso(y, +m[2], +m[1]);
  }
  m = /^(\d{1,2})[\s-]+([A-Za-zÀ-ÿ]{3,9})\.?(?:[\s-]+(\d{2,4}))?/.exec(t);
  if(m){
    const mo = RELEVE_MOIS[releveSansAccents(m[2]).toUpperCase()];
    let y = m[3] ? +m[3] : anneeDefaut;
    if(mo && y){ if(y<100) y += 2000; return releveIso(y, mo, +m[1]); }
  }
  return null;
}
// Jour/mois ou mois/jour ? Un premier nombre > 12 tranche pour jour/mois, un
// second > 12 pour mois/jour ; à défaut, l'usage français.
function releveOrdre(valeurs){
  let dmy = 0, mdy = 0;
  valeurs.forEach(v=>{
    const m = /^(\d{1,2})[-\/.](\d{1,2})/.exec(String(v||'').trim());
    if(!m || /^\d{4}/.test(String(v).trim())) return;
    if(+m[1]>12) dmy++;
    if(+m[2]>12) mdy++;
  });
  return mdy>dmy ? 'mdy' : 'dmy';
}

/* ---------- Formats de fichier ---------- */
function releveDecoder(buffer){
  let texte;
  try{ texte = new TextDecoder('utf-8', {fatal:true}).decode(buffer); }
  catch(e){ texte = new TextDecoder('windows-1252').decode(buffer); } // exports bancaires « Excel » en Latin-1
  return texte.replace(/^﻿/, '');
}
function releveCsvDecoupe(ligne, sep){
  const out = []; let cur = '', q = false;
  for(let i=0;i<ligne.length;i++){
    const c = ligne[i];
    if(q){ if(c==='"'){ if(ligne[i+1]==='"'){ cur+='"'; i++; } else q = false; } else cur += c; }
    else if(c==='"') q = true;
    else if(c===sep){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(c=>c.trim());
}
// Séparateur : celui qui donne le plus souvent le même nombre de colonnes.
function releveCsvLignes(texte){
  const lignes = texte.split(/\r\n|\n|\r/).filter(l=>l.trim());
  let best = ';', bestScore = -1;
  [';', '\t', ',', '|'].forEach(sep=>{
    const freq = {};
    lignes.slice(0, 60).forEach(l=>{ const n = releveCsvDecoupe(l, sep).length; if(n>1) freq[n] = (freq[n]||0)+1; });
    const top = Object.entries(freq).sort((a,b)=>b[1]-a[1] || b[0]-a[0])[0];
    const score = top ? top[1]*100 + Number(top[0]) : 0;
    if(score>bestScore){ bestScore = score; best = sep; }
  });
  return lignes.map(l=>releveCsvDecoupe(l, best));
}
const releveEstDateCsv = c => !!releveDate(c, 'dmy');
const releveEstMontant = c => c!=='' && !releveEstDateCsv(c) && !isNaN(releveMontant(c));
function releveNormEntete(h){ return releveSansAccents(h).toLowerCase().replace(/\s+/g,' ').trim(); }
// Repère l'en-tête et les lignes d'opérations (les banques ajoutent souvent
// quelques lignes d'informations sur le compte avant le tableau), puis la
// signature du format, qui sert à retrouver les colonnes apprises.
function releveCsvStructure(texte){
  const rows = releveCsvLignes(texte);
  const estDonnee = r => r.some(releveEstDateCsv) && r.some(releveEstMontant);
  // Une ligne « Date ; … Libellé / Montant / Débit » annonce le tableau ; à défaut, la première ligne d'opération.
  const iEntete = rows.findIndex((r,i)=>r.some(c=>/^date/.test(releveNormEntete(c))) && r.some(c=>/libelle|label|montant|amount|debit|credit|description/.test(releveNormEntete(c))) && rows.slice(i+1).some(estDonnee));
  const premiere = iEntete>=0 ? rows.findIndex((r,i)=>i>iEntete && estDonnee(r)) : rows.findIndex(estDonnee);
  if(premiere<0) return null;
  const donnees = rows.slice(premiere).filter(r=>r.some(releveEstDateCsv));
  const freq = {}; donnees.forEach(r=>{ freq[r.length] = (freq[r.length]||0)+1; });
  const nbCol = Number(Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0]);
  let entete = iEntete>=0 ? rows[iEntete] : null;
  for(let i=premiere-1;i>=0 && !entete;i--){
    if(!rows[i].some(releveEstDateCsv) && Math.abs(rows[i].length-nbCol)<=1 && rows[i].filter(Boolean).length>=2){ entete = rows[i]; break; }
  }
  const sig = entete ? 'csv:'+entete.map(releveNormEntete).join('|') : 'csv:sans-entete:'+nbCol;
  return {rows: donnees, entete, nbCol, sig};
}
// Devine les colonnes : d'abord par les noms d'en-tête, puis par le contenu.
function releveCsvDeviner(st){
  const {rows, entete, nbCol} = st;
  const col = {date:-1, libelle:-1, libelle2:-1, montant:-1, debit:-1, credit:-1};
  (entete||[]).forEach((h,i)=>{
    const n = releveNormEntete(h);
    if(/date/.test(n)){ if(col.date<0 && !/valeur/.test(n)) col.date = i; }
    else if(/^type|categor|devise|currency|solde|balance/.test(n)){ /* ni libellé ni montant de l'opération */ }
    else if(/debit|sortie|depense/.test(n)){ if(col.debit<0) col.debit = i; }
    else if(/credit|entree|recette/.test(n)){ if(col.credit<0) col.credit = i; }
    else if(/montant|amount|somme|^eur|euros?$|valeur/.test(n)){ if(col.montant<0) col.montant = i; }
    else if(/libelle|label|description|intitule|detail|operation|nature|beneficiaire|tiers|payee|memo|communication|commentaire/.test(n)){
      if(col.libelle<0) col.libelle = i; else if(col.libelle2<0) col.libelle2 = i;
    }
  });
  const part = (i, test) => rows.filter(r=>test(r[i]||'')).length / Math.max(rows.length,1);
  const idx = [...Array(nbCol).keys()];
  if(col.date<0) col.date = idx.sort((a,b)=>part(b,releveEstDateCsv)-part(a,releveEstDateCsv))[0];
  if(col.montant<0 && (col.debit<0 || col.credit<0)){
    const nums = [...Array(nbCol).keys()].filter(i=>i!==col.date && part(i, releveEstMontant)>0.15);
    // Deux colonnes numériques qui ne sont presque jamais remplies ensemble : Débit / Crédit.
    const exclusives = nums.length>=2 && rows.filter(r=>releveEstMontant(r[nums[0]]||'') && releveEstMontant(r[nums[1]]||'')).length < rows.length*0.1;
    if(col.debit>=0 || col.credit>=0){ /* une seule des deux nommée : on garde la colonne Montant devinée ci-dessous */ col.debit = col.credit = -1; }
    if(exclusives){ col.debit = nums[0]; col.credit = nums[1]; }
    else if(nums.length) col.montant = nums.sort((a,b)=>part(b,releveEstMontant)-part(a,releveEstMontant))[0];
  }
  if(col.montant>=0){ col.debit = col.credit = -1; }
  if(col.libelle<0){
    const longueur = i => rows.reduce((s,r)=>s+((r[i]||'').length),0);
    col.libelle = [...Array(nbCol).keys()].filter(i=>![col.date,col.montant,col.debit,col.credit].includes(i) && part(i, releveEstMontant)<0.5)
      .sort((a,b)=>longueur(b)-longueur(a))[0] ?? -1;
  }
  return col;
}
function releveCsvOps(st, col){
  const ordre = releveOrdre(st.rows.map(r=>r[col.date]));
  return st.rows.map(r=>{
    const lib = [r[col.libelle], col.libelle2>=0 ? r[col.libelle2] : ''].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    let montant;
    if(col.montant>=0) montant = releveMontant(r[col.montant]);
    else{
      const d = releveMontant(r[col.debit]), c = releveMontant(r[col.credit]);
      montant = !isNaN(d) && d!==0 ? -Math.abs(d) : (!isNaN(c) ? Math.abs(c) : NaN);
    }
    return {date: releveDate(r[col.date], ordre), libelle: lib, montant};
  });
}
function releveHtmlEntites(s){ return String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;|&#39;/g,"'"); }
function releveOfx(texte){
  return texte.split(/<STMTTRN>/i).slice(1).map(b=>{
    const champ = n => { const m = new RegExp('<'+n+'>([^<\\r\\n]*)','i').exec(b); return m ? releveHtmlEntites(m[1].trim()) : ''; };
    const d = /^(\d{4})(\d{2})(\d{2})/.exec(champ('DTPOSTED'));
    const nom = champ('NAME'), memo = champ('MEMO');
    return {date: d ? releveIso(+d[1], +d[2], +d[3]) : null, libelle: [nom, memo && memo!==nom ? memo : ''].filter(Boolean).join(' '), montant: releveMontant(champ('TRNAMT'))};
  });
}
function releveQif(texte){
  const ops = []; let cur = {};
  texte.split(/\r\n|\n|\r/).forEach(l=>{
    const k = l[0], v = l.slice(1).trim();
    if(k==='^'){ if(cur.dateBrute) ops.push(cur); cur = {}; }
    else if(k==='D') cur.dateBrute = v.replace(/'/g,'/').replace(/\s/g,'');
    else if(k==='T' || k==='U'){ if(cur.montant===undefined) cur.montant = releveMontant(v); }
    else if(k==='P') cur.libelle = v + (cur.libelle ? ' '+cur.libelle : '');
    else if(k==='M') cur.libelle = (cur.libelle ? cur.libelle+' ' : '') + v;
  });
  const ordre = releveOrdre(ops.map(o=>o.dateBrute));
  return ops.map(o=>({date: releveDate(o.dateBrute, ordre), libelle: o.libelle||'', montant: o.montant}));
}

/* ---------- PDF et texte collé : lignes « date … libellé … montant » ---------- */
let relevePdfJs = null;
function releveChargerPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!relevePdfJs) relevePdfJs = new Promise((resolve, reject)=>{
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const s = document.createElement('script');
    s.src = base+'pdf.min.js';
    s.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+'pdf.worker.min.js'; resolve(window.pdfjsLib); };
    s.onerror = ()=>{ relevePdfJs = null; s.remove(); reject(new Error('pdf.js indisponible')); };
    document.head.appendChild(s);
  });
  return relevePdfJs;
}
// Une ligne = la liste de ses morceaux de texte avec leur position (x, largeur),
// pour savoir sous quelle colonne (Débit, Crédit, Solde) tombe un montant.
async function releveLirePdf(buffer){
  const pdfjs = await releveChargerPdfJs();
  const doc = await pdfjs.getDocument({data: buffer}).promise;
  const lignes = [];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const rows = [];
    (await page.getTextContent()).items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find(r=>Math.abs(r.y-y)<3);
      if(!row){ row = {y, items:[]}; rows.push(row); }
      row.items.push({str: it.str.trim(), x, w: it.width||0});
    });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>lignes.push(r.items.sort((a,b)=>a.x-b.x)));
  }
  return lignes;
}
// Texte collé : les morceaux sont séparés par une tabulation ou au moins deux espaces ;
// leur position est le numéro de caractère, ce qui garde l'alignement des colonnes.
function releveTexteEnLignes(texte){
  return texte.split(/\r\n|\n|\r/).map(l=>{
    const items = []; const re = /[^\t]+?(?=\t| {2,}|$)/g; let m;
    while((m = re.exec(l))){ const str = m[0].trim(); if(str) items.push({str, x: m.index + m[0].indexOf(str), w: str.length}); if(re.lastIndex===m.index) re.lastIndex++; }
    return items;
  }).filter(items=>items.length);
}
const RELEVE_ARGENT = /^[-+−]?\d{1,3}(?:[\s  .]\d{3})*,\d{2}\s?€?-?$|^[-+−]?\d+\.\d{2}\s?€?-?$|^[-+−]?\d{1,3}(?:,\d{3})+\.\d{2}\s?€?-?$/;
const RELEVE_DATE_DEBUT = /^(\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?|\d{1,2} [A-Za-zÀ-ÿ]{3,9}\.?(?: \d{4})?)\s+/;
const RELEVE_ENTREE = /\b(VIR(EMENT)?S? (SEPA )?(RECU|DE|INST RECU)|REMBOURSEMENT|REMB|SALAIRE|AVOIR|ALLOCATION|CAF|POLE EMPLOI|FRANCE TRAVAIL|PRIME|INTERETS)\b/i;
function releveSigTexte(lignes){
  return 'pdf:' + releveSansAccents(lignes.slice(0,3).map(l=>l.map(i=>i.str).join(' ')).join(' ')).toUpperCase().replace(/[^A-Z]+/g,' ').trim().slice(0,60);
}
function releveDepuisLignes(lignes, format, colonnesApprises){
  // Année des dates sans année : la plus récente trouvée en toutes lettres dans le document.
  const datesCompletes = [];
  lignes.forEach(l=>l.forEach(i=>{ const m = i.str.match(/\b\d{1,2}[\/.-]\d{1,2}[\/.-](\d{4}|\d{2})\b/g); (m||[]).forEach(x=>{ const d = releveDate(x,'dmy'); if(d) datesCompletes.push(d); }); }));
  const fin = datesCompletes.sort().pop();
  const anneeFin = fin ? Number(fin.slice(0,4)) : new Date().getFullYear(), moisFin = fin ? Number(fin.slice(5,7)) : 12;
  const ordre = releveOrdre(lignes.map(l=>(l[0]||{}).str));
  let colonnes = colonnesApprises || null, colonnesVues = null;
  const ops = [];
  let dernier = null, dernierIndex = -2;
  lignes.forEach((items, idx)=>{
    const texte = items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
    const norm = releveNormEntete(texte);
    if(/debit/.test(norm) && /credit/.test(norm)){
      colonnes = {};
      items.forEach(i=>{ const n = releveNormEntete(i.str); const k = /debit/.test(n) ? 'debit' : /credit/.test(n) ? 'credit' : /solde/.test(n) ? 'solde' : null; if(k) colonnes[k] = i.x + i.w; });
      colonnesVues = colonnes;
      return;
    }
    const md = RELEVE_DATE_DEBUT.exec(texte + ' ');
    const argent = items.filter(i=>RELEVE_ARGENT.test(i.str));
    if(!md){
      // Suite du libellé de l'opération précédente (libellés sur deux lignes).
      if(dernier && dernierIndex===idx-1 && !argent.length && texte.length<70 && !RELEVE_HORS_OPS.test(texte)){ dernier.libelle += ' ' + texte; }
      return;
    }
    const brut = md[1];
    let date = releveDate(brut, ordre, anneeFin);
    const sansAnnee = /^\d{1,2}[\/.-]\d{1,2}$|^\d{1,2} [A-Za-zÀ-ÿ]{3,9}\.?$/.test(brut);
    if(date && sansAnnee && Number(date.slice(5,7)) > moisFin + 1) date = releveDate(brut, ordre, anneeFin-1); // relevé à cheval sur deux années
    if(!date || !argent.length) return;
    let choisi = null, signe = 0;
    if(colonnes && (colonnes.debit!==undefined || colonnes.credit!==undefined)){
      // Montants alignés à droite : on compare le bord droit de chaque montant à celui des en-têtes.
      const proche = i => Object.entries(colonnes).sort((a,b)=>Math.abs(a[1]-(i.x+i.w)) - Math.abs(b[1]-(i.x+i.w)))[0][0];
      choisi = argent.find(i=>proche(i)!=='solde');
      if(choisi) signe = proche(choisi)==='debit' ? -1 : 1;
    }
    if(!choisi){ choisi = argent[0]; } // sans colonnes : le premier montant après le libellé (le solde, s'il y en a un, vient après)
    let montant = releveMontant(choisi.str);
    if(isNaN(montant) || montant===0) return;
    const explicite = /^[-+−]|-$/.test(choisi.str.trim());
    const signeIncertain = !signe && !explicite;
    if(signe) montant = signe * Math.abs(montant);
    else if(signeIncertain) montant = RELEVE_ENTREE.test(texte) ? Math.abs(montant) : -Math.abs(montant);
    let libelle = texte.slice(md[0].length);
    libelle = libelle.replace(RELEVE_DATE_DEBUT, ''); // date de valeur juste après la date d'opération
    argent.forEach(i=>{ const a = i.str.replace(/\s+/g,' '), k = libelle.lastIndexOf(a); if(k>=0) libelle = libelle.slice(0,k) + libelle.slice(k+a.length); });
    libelle = libelle.replace(/\s+/g,' ').trim();
    if(!libelle || RELEVE_HORS_OPS.test(libelle)) return;
    dernier = {date, libelle, montant, signeIncertain}; dernierIndex = idx;
    ops.push(dernier);
  });
  return {format, ops, sig: releveSigTexte(lignes), colonnes: colonnesVues};
}

/* ---------- Suggestions ---------- */
function releveCategorieDefaut(type){
  const cats = myCategories(type==='revenu' ? 'revenus' : 'depenses');
  return (cats.find(c=>c.nom==='Autre') || cats[0] || {}).nom || '';
}
// Ce qui est déjà suivi ailleurs dans Solde n'est pas à ressaisir : une dépense
// déjà notée (même montant, à 3 jours près), un abonnement, une mensualité,
// une charge ou un revenu récurrent du même montant.
function releveDejaSuivi(op){
  const abs = Math.abs(op.montant), key = op.date.slice(0,7);
  const egal = v => Math.abs((Number(v)||0) - abs) < 0.006;
  const proche = d => d && Math.abs(new Date(d+'T00:00:00') - new Date(op.date+'T00:00:00')) <= 3*86400000;
  if(op.montant<0){
    const deps = mine(state.depenses);
    const d = deps.find(x=>x.modePaiement==='Unique' && egal(x.montant) && proche(x.date));
    if(d) return `Déjà saisie : ${d.libelle}`;
    const ab = deps.find(x=>x.modePaiement==='Recurrent' && x.statut==='Actif' && egal(x.montant));
    if(ab) return `Abonnement déjà suivi : ${ab.libelle}`;
    const ech = deps.find(x=>x.modePaiement==='Echelonne' && egal(depenseMensualiteDuMois(x, key)));
    if(ech) return `Mensualité déjà suivie : ${ech.libelle}`;
    const ch = chargesActivesMois(key).find(c=>egal(c.budget));
    if(ch) return `Charge déjà suivie : ${ch.categorie}`;
  } else {
    const r = mine(state.revenusExceptionnels).find(x=>egal(x.montant) && proche(x.date));
    if(r) return `Déjà saisie : ${r.libelle}`;
    const rr = mine(state.revenusRecurrents).find(x=>egal(x.montant) && inRangeMonth(key, x.dateDebut, x.dateFin));
    if(rr) return `Revenu récurrent déjà suivi : ${rr.libelle}`;
  }
  return '';
}
// Ordre de confiance : la règle apprise pour ce commerçant ; sinon un commerçant
// proche déjà vu (même premier mot : « CARREFOUR CITY » ↔ « CARREFOUR MARKET ») ;
// sinon les mots du libellé ; sinon le sens du montant.
function releveSuggestion(op, modele){
  const cle = releveCle(op.libelle);
  const sens = op.montant<0 ? 'depense' : 'revenu';
  const base = {cle, compte:'Compte Perso'};
  const regle = modele.regles[cle];
  // Un commerçant habituellement en dépense qui crédite le compte : c'est un remboursement.
  if(regle && regle.type!=='ignorer' && regle.type!==sens && !op.signeIncertain){
    const cats = myCategories(sens==='revenu' ? 'revenus' : 'depenses').map(c=>c.nom);
    const cat = sens==='revenu' && cats.includes('Remboursement') ? 'Remboursement' : releveCategorieDefaut(sens);
    return {...base, type: sens, libelle: (sens==='revenu' ? 'Remboursement ' : '') + (regle.libelle || releveJoli(cle)), categorie: cat, compte: regle.compte || 'Compte Perso', confiance:'devine', raison:'Sens inhabituel pour ce commerçant'};
  }
  if(regle){
    return {...base, type: regle.type, libelle: regle.libelle || releveJoli(cle), categorie: regle.categorie || '', compte: regle.compte || 'Compte Perso',
      confiance: regle.n>=2 ? 'sur' : 'appris', raison: regle.type==='ignorer' ? `Déjà ignorée ${regle.n>1?regle.n+' fois':'une fois'}` : `Reconnue (${regle.n>1?regle.n+' fois':'une fois'})`};
  }
  const premier = cle.split(' ')[0];
  if(premier.length>=4){
    const voisin = Object.entries(modele.regles).filter(([k,r])=>k.split(' ')[0]===premier && (r.type===sens || op.signeIncertain && r.type!=='ignorer')).sort((a,b)=>b[1].n-a[1].n)[0];
    // Le libellé du voisin n'est repris que si l'utilisateur l'a renommé (« Courses ») ; sinon chacun garde le sien.
    if(voisin){ const r = voisin[1]; const renomme = r.libelle && r.libelle!==releveJoli(voisin[0]); return {...base, type: r.type, libelle: renomme ? r.libelle : releveJoli(cle), categorie: r.categorie||'', compte: r.compte||'Compte Perso', confiance:'appris', raison:`Proche de « ${r.libelle || releveJoli(voisin[0])} »`}; }
  }
  const scores = {}; let total = 0;
  releveMots(op.libelle).forEach(w=>{
    Object.entries(modele.mots[w]||{}).forEach(([lab,n])=>{
      const t = lab.split('|')[0];
      if(t!==sens && !(op.signeIncertain && t!=='ignorer')) return; // une catégorie de dépense ne s'applique pas à une rentrée, et inversement
      scores[lab] = (scores[lab]||0) + n; total += n;
    });
  });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  if(best && best[1]>=2 && best[1]/total>=0.6){
    const [type, categorie] = best[0].split('|');
    return {...base, type, libelle: releveJoli(cle), categorie, confiance:'devine', raison:`Catégorie devinée d’après le libellé`};
  }
  return {...base, type: sens, libelle: releveJoli(cle), categorie: releveCategorieDefaut(sens), confiance:'nouveau', raison:'Nouvelle opération'};
}
function releveCreerLignes(ops){
  const modele = releveModele(false);
  return ops.filter(o=>o.date && isFinite(o.montant) && Math.abs(o.montant)>=0.005 && (o.libelle||'').trim())
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(o=>{
      const s = releveSuggestion(o, modele);
      const suivi = releveDejaSuivi(o);
      if(suivi){ s.type = 'ignorer'; s.confiance = 'sur'; s.raison = suivi; }
      const {cle, confiance, raison, ...valeurs} = s;
      return {id: uid(), date: o.date, brut: o.libelle.trim(), montant: r2(o.montant), cle, suivi: !!suivi, confiance, raison, etat:'attente', s:{...valeurs}, v:{...valeurs}};
    });
}

/* ---------- Session d'import ---------- */
function releveCleStockage(){ const me = currentUser(); return me ? 'releve_en_cours_'+me.id : null; }
function releveChargerSession(){
  const me = currentUser();
  if(!me || releveSessionOwner===me.id) return;
  releveSessionOwner = me.id; releveSession = null;
  try{ const raw = localStorage.getItem(releveCleStockage()); if(raw) releveSession = JSON.parse(raw); }catch(e){ releveSession = null; }
}
function releveSauverSession(){
  try{
    const k = releveCleStockage(); if(!k) return;
    if(releveSession) localStorage.setItem(k, JSON.stringify(releveSession)); else localStorage.removeItem(k);
  }catch(e){}
}
async function releveOuvrirFichier(file){
  const nom = file.name || 'relevé';
  const ext = (nom.split('.').pop()||'').toLowerCase();
  const modele = releveModele(false);
  let res = null;
  try{
    if(ext==='pdf' || file.type==='application/pdf'){
      toast('Lecture du PDF…');
      let lignes;
      try{ lignes = await releveLirePdf(await file.arrayBuffer()); }
      catch(e){ console.error(e); toast('Impossible de lire ce PDF — essaie l’export CSV ou OFX de ta banque'); return; }
      const appris = modele.formats[releveSigTexte(lignes)];
      res = releveDepuisLignes(lignes, 'pdf', appris && appris.colonnes);
    } else {
      const texte = releveDecoder(await file.arrayBuffer());
      res = releveAnalyserTexte(texte, modele);
    }
  }catch(e){ console.error(e); toast('Ce fichier n’a pas pu être lu'); return; }
  await releveDemarrer(nom, res);
}
function releveAnalyserTexte(texte, modele){
  if(/<STMTTRN>/i.test(texte)) return {format:'ofx', ops: releveOfx(texte)};
  if(/^\s*!Type:/im.test(texte)) return {format:'qif', ops: releveQif(texte)};
  const st = releveCsvStructure(texte);
  if(st && st.nbCol>=3){
    const appris = modele.formats[st.sig];
    const col = appris && appris.colonnes ? {...appris.colonnes} : releveCsvDeviner(st);
    return {format:'csv', ops: releveCsvOps(st, col), sig: st.sig, csv:{rows: st.rows, entete: st.entete, nbCol: st.nbCol, col}, formatConnu: !!appris};
  }
  const lignes = releveTexteEnLignes(texte);
  const appris = modele.formats[releveSigTexte(lignes)];
  return releveDepuisLignes(lignes, 'texte', appris && appris.colonnes);
}
async function releveDemarrer(nom, res){
  const lignes = res ? releveCreerLignes(res.ops||[]) : [];
  if(!lignes.length){ toast('Aucune opération trouvée — essaie l’export CSV ou OFX de ta banque'); return; }
  const modele = releveModele(false);
  releveSession = {nom, format: res.format, sig: res.sig||null, csv: res.csv||null, colonnes: res.colonnes||null,
    formatConnu: !!(res.sig && modele.formats[res.sig]), lignes, debut: new Date().toISOString()};
  releveSauverSession();
  await render();
  toast(`${lignes.length} opération${lignes.length>1?'s':''} à vérifier`);
}
// L'utilisateur corrige une colonne du CSV : on relit le fichier avec ce choix,
// et on le retient tout de suite pour les prochains relevés de même format.
async function releveChangerColonne(el){
  const s = releveSession; if(!s || !s.csv) return;
  const champ = el.dataset.rlCol, val = Number(el.value);
  const col = {...s.csv.col};
  if(champ==='montantMode'){
    if(el.value==='un'){ col.montant = col.debit>=0 ? col.debit : 0; col.debit = col.credit = -1; }
    else{ col.debit = col.montant>=0 ? col.montant : 0; col.credit = Math.min(col.debit+1, s.csv.nbCol-1); col.montant = -1; }
  } else col[champ] = val;
  s.csv.col = col;
  const traitees = s.lignes.filter(l=>l.etat!=='attente');
  s.lignes = [...traitees, ...releveCreerLignes(releveCsvOps(s.csv, col))];
  const modele = releveModele(true);
  modele.formats[s.sig] = {...(modele.formats[s.sig]||{}), colonnes: col, nom: s.nom, maj: new Date().toISOString().slice(0,10)};
  s.formatConnu = true;
  releveSauverSession(); await persist(); await render();
}
function releveChangerChamp(el){
  const s = releveSession; if(!s) return;
  const l = s.lignes.find(x=>x.id===el.dataset.rlId); if(!l) return;
  const champ = el.dataset.rlChamp;
  l.v[champ] = el.value;
  if(champ==='type' && el.value!=='ignorer'){
    const cats = myCategories(el.value==='revenu' ? 'revenus' : 'depenses').map(c=>c.nom);
    if(!cats.includes(l.v.categorie)){
      const regle = releveModele(false).regles[l.cle];
      l.v.categorie = regle && regle.type===el.value && regle.categorie ? regle.categorie : releveCategorieDefaut(el.value);
    }
  }
  if(champ==='nbMensualites'){
    // Pas de re-render ici : le clic sur « Valider » qui a fait perdre le focus doit aboutir.
    const nb = releveNbMensualites(l.v), tot = el.closest('.rl-row')?.querySelector('.rl-nb-total');
    if(tot) tot.textContent = `${fmtEUR(r2(Math.abs(l.montant)*nb))} au total`;
  }
  releveSauverSession();
  if(champ==='type' || champ==='paiement') return render();
}
// Retient la décision de l'utilisateur : règle du commerçant, mots du libellé,
// format du fichier, et si la suggestion était juste.
function releveApprendre(modele, l){
  const v = l.v, s = l.s;
  const juste = v.type===s.type && (v.type==='ignorer' || v.categorie===s.categorie);
  modele.historique.push(juste ? 1 : 0);
  if(modele.historique.length>300) modele.historique = modele.historique.slice(-300);
  if(l.suivi && v.type==='ignorer') return; // ignorée parce que déjà suivie ailleurs : rien à retenir sur ce commerçant
  const prev = modele.regles[l.cle];
  const meme = prev && prev.type===v.type && (v.type==='ignorer' || prev.categorie===v.categorie);
  modele.regles[l.cle] = v.type==='ignorer'
    ? {type:'ignorer', n: meme ? prev.n+1 : 1, maj: new Date().toISOString().slice(0,10)}
    : {type:v.type, libelle:(v.libelle||'').trim(), categorie:v.categorie||'', compte:v.compte||'Compte Perso', n: meme ? prev.n+1 : 1, maj: new Date().toISOString().slice(0,10)};
  const lab = v.type==='ignorer' ? 'ignorer|' : `${v.type}|${v.categorie||''}`;
  new Set(releveMots(l.brut)).forEach(w=>{ const e = modele.mots[w] || (modele.mots[w] = {}); e[lab] = (e[lab]||0) + 1; });
}
async function releveValider(ids){
  const s = releveSession; if(!s) return;
  const me = currentUser(), modele = releveModele(true);
  let ajoutees = 0, ignorees = 0;
  ids.forEach(id=>{
    const l = s.lignes.find(x=>x.id===id && x.etat==='attente'); if(!l) return;
    const v = l.v, montant = r2(Math.abs(l.montant)), libelle = (v.libelle||'').trim() || releveJoli(l.cle), notes = (v.notes||'').trim();
    if(v.type==='depense'){
      const dep = {id:uid(), ownerId:me.id, libelle, categorie:v.categorie||'', compte:v.compte||'Compte Perso', montant, modePaiement:'Unique', date:l.date, notes, source:'releve'};
      // En plusieurs fois : la ligne du relevé est la première mensualité ; les
      // suivantes seront reconnues comme « Mensualité déjà suivie ».
      if(v.paiement==='Echelonne'){
        const nb = releveNbMensualites(v);
        delete dep.date;
        Object.assign(dep, {modePaiement:'Echelonne', montant:r2(montant*nb), dateDebut:l.date, nbMensualites:nb, moisRetires:[]});
      }
      state.depenses.push(dep);
      ajoutees++;
    } else if(v.type==='revenu'){
      state.revenusExceptionnels.push({id:uid(), ownerId:me.id, date:l.date, libelle, categorie:v.categorie||releveCategorieDefaut('revenu'), montant, notes, source:'releve'});
      ajoutees++;
    } else ignorees++;
    l.etat = v.type==='ignorer' ? 'ignoree' : 'validee';
    releveApprendre(modele, l);
  });
  if(ajoutees+ignorees===0) return;
  // Le format du fichier est retenu dès la première ligne acceptée.
  if(s.sig && (s.csv || s.colonnes)){
    const f = modele.formats[s.sig] || {};
    if(!s.formatRetenu){ f.imports = (f.imports||0) + 1; s.formatRetenu = true; }
    modele.formats[s.sig] = {...f, colonnes: s.csv ? s.csv.col : (s.colonnes || f.colonnes), nom: s.nom, maj: new Date().toISOString().slice(0,10)};
  }
  releveSauverSession();
  await persist(); await render();
  toast(ajoutees && ignorees ? `${ajoutees} ajoutée${ajoutees>1?'s':''}, ${ignorees} ignorée${ignorees>1?'s':''}` : ajoutees ? (ajoutees>1 ? `${ajoutees} opérations ajoutées` : 'Opération ajoutée') : (ignorees>1 ? `${ignorees} lignes ignorées` : 'Ligne ignorée'));
}
function releveRetirerCategorie(type, nom){
  if(!releveSession) return;
  const t = type==='revenus' ? 'revenu' : type==='depenses' ? 'depense' : null;
  releveSession.lignes.forEach(l=>{ if(l.etat==='attente' && l.v.type===t && l.v.categorie===nom) l.v.categorie = ''; });
  releveSauverSession();
}
function relevePrecision(historique, n){
  const h = historique.slice(-n);
  return h.length ? h.reduce((a,b)=>a+b,0)/h.length : null;
}
