function isValidUsername(username){ return /^[a-z0-9._-]{2,32}$/.test(username||''); }
// Proposition d'identifiant valide à partir d'un identifiant à l'ancien format
// (« Prénom.Nom@exemple.com » → « prenom.nom »), sans collision avec un autre compte.
function suggestUsername(u){
  let base = (u.username||'').trim().toLowerCase().split('@')[0]
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9._-]+/g,'.').replace(/^[._-]+|[._-]+$/g,'').slice(0,32);
  if(base.length<2) base = 'membre';
  const taken = name => authState.users.some(x=>x.id!==u.id && x.username===name);
  let candidate = base;
  for(let i=2; taken(candidate); i++){ const suffix = '-'+i; candidate = base.slice(0, 32-suffix.length)+suffix; }
  return candidate;
}
// Mot de passe à usage unique, lisible à l'oral (sans 0/O, 1/l/I) : XXXX-XXXX-XXXX.
function generateTempPassword(){
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  const chars = [];
  while(chars.length<12){
    const b = crypto.getRandomValues(new Uint8Array(1))[0];
    if(b < 256 - 256 % alphabet.length) chars.push(alphabet[b % alphabet.length]); // sans biais
  }
  return chars.join('').replace(/(.{4})(?=.)/g, '$1-');
}

// Contrôles communs aux formulaires de compte. Les limites sont revérifiées ici
// (et pas seulement via maxlength) car les comptes peuvent arriver par import
// ou par la synchro GitHub. Un champ vide est laissé à fieldRequiredErrors.
function userFieldErrors(data){
  const errors = [];
  if(typeof data.displayName==='string' && data.displayName.trim().length>60) errors.push(['displayName','60 caractères maximum']);
  if(typeof data.username==='string' && data.username.trim() && !isValidUsername(data.username.trim().toLowerCase())) errors.push(['username','2 à 32 caractères : lettres, chiffres, . _ -']);
  if(data.password){
    if(data.password.length<8) errors.push(['password','8 caractères minimum']);
    if(data.password!==data.password2) errors.push(['password2','Les mots de passe ne correspondent pas']);
  }
  return errors;
}

/* Repasse en Compte Perso toutes les saisies taguées Compte Joint appartenant à
   ces deux personnes — utilisé chaque fois qu'un compte joint prend fin, pour ne

function untagJointExpenses(userIds){
  ['abonnements','charges','depenses'].forEach(key=>{

/* ============================== NETTOYAGE SOCIAL (fusion sûre lors des synchros) ============================== */
function mergeSocial(local, remote){
  const byId = (arr)=>{ const m=new Map(); (arr||[]).forEach(x=>m.set(x.id,x)); return m; };
  const mReq = byId(local.jointRequests), mMsg = byId(local.messages), mAcc = byId(local.accountRequests), mExp = byId(local.expenseDeleteRequests);
  (remote.jointRequests||[]).forEach(r=>{
    const existing = mReq.get(r.id);
    // le statut le plus "avancé" gagne (une réponse locale ne doit pas être écrasée par un pending distant obsolète)
    if(!existing || (r.status!=='pending')) mReq.set(r.id, r);
  });
  (remote.messages||[]).forEach(m=>{ if(!mMsg.has(m.id)) mMsg.set(m.id, m); });
  (remote.accountRequests||[]).forEach(r=>{
    const existing = mAcc.get(r.id);
    if(!existing || (r.status!=='pending')) mAcc.set(r.id, r);
  });
  (remote.expenseDeleteRequests||[]).forEach(r=>{
    const existing = mExp.get(r.id);
    if(!existing || (r.status!=='pending')) mExp.set(r.id, r);
  });
  return { jointRequests: Array.from(mReq.values()), messages: Array.from(mMsg.values()), accountRequests: Array.from(mAcc.values()), expenseDeleteRequests: Array.from(mExp.values()) };
}

function importDataFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed && parsed.auth && parsed.budget){
        authState = parsed.auth; state = parsed.budget; socialState = parsed.social || defaultSocial();
      } else if(parsed && parsed.users){
        // ancien format (avant séparation) : les comptes étaient mélangés aux données
        authState = { users: parsed.users };
        state = { ...parsed }; delete state.users;
        socialState = defaultSocial();
      } else { throw new Error('format invalide'); }
      await Promise.all([persist(), persistAuth(), persistSocial()]);
      await render();
      toast('Données importées');
    }catch(e){ toast('Fichier invalide'); }
  };
  reader.readAsText(file);
}

/* ============================== SYNCHRONISATION GITHUB (recommandée) ============================== */
/* Stocke le fichier de données dans un dépôt GitHub PRIVÉ séparé (différent
   de celui qui héberge le site), via l'API GitHub. Fonctionne sur tout
   navigateur et tout appareil (y compris mobile), contrairement au dossier
   partagé qui nécessite Chrome/Edge sur PC. Chaque personne renseigne son
   propre jeton d'accès (Personal Access Token) à privilèges restreints. */
// Dépôt cible fixe — personne ne peut se connecter à un autre dépôt, quel que
// soit l'appareil. Seul le jeton reste à saisir (jamais publié, stocké
// uniquement en local sur l'appareil de chaque admin).
const GH_OWNER = 'shokin-kasegi';
const GH_REPO = 'mon-budget-data'; // dépôt PRIVÉ dédié aux données — jamais le dépôt public qui héberge le site
// Empreinte du jeton d'accès correct — jamais le jeton lui-même. Sert à refuser
// tout jeton différent de celui de l'admin, sans jamais l'exposer publiquement.
const GH_TOKEN_HASH = '679a45f1552062fc515be4aab52fbb6ba6f258a06f850cebec6165346876d63f';
async function isValidGhToken(token){ return (await sha256(token||'')) === GH_TOKEN_HASH; }
function ghConfig(){
  let token = '';
  try{ token = JSON.parse(localStorage.getItem('github_sync_config')||'{}').token || ''; }catch(e){}
  return { owner:GH_OWNER, repo:GH_REPO, token, path:'data.json', authPath:'auth.json', socialPath:'social.json' };
}
function ghSaveToken(token){ localStorage.setItem('github_sync_config', JSON.stringify({token})); }
function ghClearConfig(){ localStorage.removeItem('github_sync_config'); }
function ghConfigured(){ return !!ghConfig().token; }
let ghLastSync = null, ghSha = null, ghAuthSha = null, ghSocialSha = null;

function b64EncodeUnicode(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))); }
function b64DecodeUnicode(str){ return new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\n/g,'')), c=>c.charCodeAt(0))); }

function ghHeaders(token){ return { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; }
function ghUrl(cfg, path){ return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`; }

async function ghPull(){
  const a = await ghPullAuth();
  const b = await ghPullBudget(true);
  const c = await ghPullSocial(true);
  return a || b || c;
}
/* Fusion du budget à trois versions : cet appareil, GitHub, et la « base » —
   la dernière version que cet appareil sait être identique à GitHub (gardée
   dans budget_sync_base). Élément par élément (par id) :
   - modifié seulement ici → on garde la version d'ici ;
   - modifié seulement sur GitHub (autre appareil, même compte, ou partenaire)
     → on prend celle de GitHub ;
   - modifié des deux côtés → celle d'ici (pas encore envoyée, donc la plus
     récente en pratique) ;
   une suppression compte comme une modification, elle se propage donc aussi.
   Sans base (premier passage après cette mise à jour), GitHub l'emporte sur
   les éléments communs et rien de ce qui n'existe qu'ici n'est perdu. */
const BUDGET_BASE_KEY = 'budget_sync_base';
function stableStringify(v){
  if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
  return JSON.stringify(v);
}
function ownedPart(obj){ const out = {}; OWNED_ARRAYS.forEach(k=>{ out[k] = (obj&&obj[k])||[]; }); return out; }
function loadBudgetBase(){ try{ return JSON.parse(localStorage.getItem(BUDGET_BASE_KEY)||'null'); }catch(e){ return null; } }
function saveBudgetBase(obj){ try{ localStorage.setItem(BUDGET_BASE_KEY, JSON.stringify(ownedPart(obj))); }catch(e){} }
function mergeArray3(localArr, remoteArr, baseArr){
  const keyOf = x=>(x && x.id!=null) ? 'id:'+x.id : 'v:'+stableStringify(x);
  const index = arr=>{ const m = new Map(); (arr||[]).forEach(x=>m.set(keyOf(x), x)); return m; };
  const L = index(localArr), R = index(remoteArr), B = baseArr ? index(baseArr) : null;
  const out = [];
  new Set([...L.keys(), ...R.keys()]).forEach(k=>{
    const l = L.get(k), r = R.get(k);
    let pick;
    if(!B){ pick = r!==undefined ? r : l; }
    else{
      const sb = B.has(k) ? stableStringify(B.get(k)) : undefined;
      const sl = l!==undefined ? stableStringify(l) : undefined;
      const sr = r!==undefined ? stableStringify(r) : undefined;
      pick = (sl===sb && sr!==sb) ? r : l;
    }
    if(pick!==undefined) out.push(pick);
  });
  return out;
}
function mergeBudget(local, remote, base){
  const merged = {...local};
  OWNED_ARRAYS.forEach(key=>{ merged[key] = mergeArray3(local[key], remote[key], base ? (base[key]||[]) : null); });
  return merged;
}
function budgetDiffers(a, b){ return stableStringify(ownedPart(a))!==stableStringify(ownedPart(b)); }
// Réaffiche si une synchro a apporté des changements, sauf pendant une saisie.
async function renderAfterRemoteChange(){
  const modal = document.getElementById('modal-root');
  if(modal && modal.innerHTML) return;
  if(currentUser()) await render();
}
async function ghFetchBudget(cfg){
  const res = await fetch(ghUrl(cfg, cfg.path||'data.json'), { headers: ghHeaders(cfg.token), cache:'no-store' });
  if(res.status===404) return { sha:null, remote:null };
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  const remote = JSON.parse(b64DecodeUnicode(data.content));
  return { sha:data.sha, remote: (remote && remote.selectedMonth!==undefined) ? remote : null };
}

async function ghPullBudget(merge){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const { sha, remote } = await ghFetchBudget(cfg);
    ghSha = sha;
    if(!remote) return false;
    const before = state;
    state = merge ? mergeBudget(state, remote, loadBudgetBase()) : remote;
    saveBudgetBase(remote);
    localStorage.setItem('budget_store', JSON.stringify(state));
    ghLastSync = new Date();
    // Des saisies d'ici pas encore sur GitHub (ex. faites hors connexion) : on les envoie.
    if(budgetDiffers(state, remote)) markDirtyForSync();
    return budgetDiffers(before, state);
  }catch(e){ console.error('GitHub pull error (budget)', e); return false; }
}
// Fusionne les comptes plutôt que d'écraser : un compte créé localement mais
// pas encore poussé sur GitHub (ex. juste après la création admin, avant la
// toute première synchro) ne doit JAMAIS disparaître simplement parce que le
// dépôt distant ne le connaît pas encore.
function mergeAuthUsers(localUsers, remoteUsers){
  const byId = new Map();
  (remoteUsers||[]).forEach(u=>byId.set(u.id, u));
  (localUsers||[]).forEach(u=>{ if(!byId.has(u.id)) byId.set(u.id, u); });
  return Array.from(byId.values());
}
async function ghPullAuth(){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const res = await fetch(ghUrl(cfg, cfg.authPath||'auth.json'), { headers: ghHeaders(cfg.token), cache:'no-store' });
    if(res.status===404){ ghAuthSha = null; return false; }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const data = await res.json();
    ghAuthSha = data.sha;
    const text = b64DecodeUnicode(data.content);
    const remote = JSON.parse(text);
    if(remote && remote.users){
      authState.users = mergeAuthUsers(authState.users, remote.users);
      if(remote.setupCodeUsed) authState.setupCodeUsed = true; // une fois consommé quelque part, ça reste consommé partout
      localStorage.setItem('budget_auth', JSON.stringify(authState));
      ghLastSync = new Date();
      return true;
    }
    return false;
  }catch(e){ console.error('GitHub pull error (auth)', e); return false; }
}
async function ghPullSocial(merge){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const res = await fetch(ghUrl(cfg, cfg.socialPath||'social.json'), { headers: ghHeaders(cfg.token), cache:'no-store' });
    if(res.status===404){ ghSocialSha = null; return false; }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const data = await res.json();
    ghSocialSha = data.sha;
    const text = b64DecodeUnicode(data.content);
    const remote = JSON.parse(text);
    if(remote){
      socialState = merge ? mergeSocial(socialState, remote) : remote;
      localStorage.setItem('budget_social', JSON.stringify(socialState));
      ghLastSync = new Date();
      return true;
    }
    return false;
  }catch(e){ console.error('GitHub pull error (social)', e); return false; }
}
async function ghPush(){
  const a = await ghPushAuth();
  const b = await ghPushBudget();
  const c = await ghPushSocial();
  return a || b || c;
}
/* Écrit un fichier sur GitHub, avec une nouvelle tentative automatique en cas de
   conflit (HTTP 409 — le fichier a changé entre-temps, ex. deux appareils qui
   synchronisent au même moment). On relit simplement le sha à jour et on
   réessaie une fois, ce qui suffit dans l'immense majorité des cas. */
async function ghPutWithRetry(path, dataObj, message, attempt){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const check = await fetch(ghUrl(cfg, path), { headers: ghHeaders(cfg.token), cache:'no-store' });
    let sha = null;
    if(check.status===200){ const d = await check.json(); sha = d.sha; }
    const body = { message, content: b64EncodeUnicode(JSON.stringify(dataObj, null, 2)) };
    if(sha) body.sha = sha;
    const res = await fetch(ghUrl(cfg, path), { method:'PUT', headers:{...ghHeaders(cfg.token), 'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if(res.status===409 && !attempt){
      // Conflit : quelqu'un d'autre a écrit entre-temps. On relit et réessaie une fois.
      return ghPutWithRetry(path, dataObj, message, true);
    }
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    ghLastSync = new Date();
    return true;
  }catch(e){ console.error('GitHub push error ('+path+')', e); return false; }
}
/* Envoi du budget : on relit toujours GitHub juste avant et on fusionne, pour
   ne jamais écraser ce qu'un autre appareil a envoyé entre-temps (ex. un
   onglet resté ouvert sur le PC pendant qu'on saisit sur le téléphone). */
async function ghPushBudget(attempt){
  const cfg = ghConfig();
  if(!cfg.owner || !cfg.repo || !cfg.token) return false;
  try{
    const { sha, remote } = await ghFetchBudget(cfg);
    let changedHere = false;
    if(remote){
      const merged = mergeBudget(state, remote, loadBudgetBase());
      changedHere = budgetDiffers(state, merged);
      state = merged;
      localStorage.setItem('budget_store', JSON.stringify(state));
      if(!budgetDiffers(state, remote)){ ghSha = sha; saveBudgetBase(remote); ghLastSync = new Date(); if(changedHere) await renderAfterRemoteChange(); return true; }
    }
    const snapshot = JSON.parse(JSON.stringify(state));
    const body = { message:'Mise à jour budget', content: b64EncodeUnicode(JSON.stringify(snapshot, null, 2)) };
    if(sha) body.sha = sha;
    const res = await fetch(ghUrl(cfg, cfg.path||'data.json'), { method:'PUT', headers:{...ghHeaders(cfg.token), 'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if(res.status===409 && !attempt) return ghPushBudget(true); // écrit entre-temps ailleurs : on refusionne
    if(!res.ok) throw new Error('HTTP '+res.status);
    const out = await res.json().catch(()=>null);
    ghSha = (out && out.content && out.content.sha) || null;
    saveBudgetBase(snapshot);
    ghLastSync = new Date();
    if(changedHere) await renderAfterRemoteChange();
    return true;
  }catch(e){ console.error('GitHub push error (budget)', e); return false; }
}

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key': claudeKey(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:1000,
        system: `Tu es l'assistant intégré au site de budget personnel "Solde" de l'utilisateur. Réponds en français, de façon chaleureuse et concise. Tu peux donner des conseils financiers généraux (pas de conseil réglementé), expliquer les chiffres du tableau de bord, ou suggérer des idées d'amélioration pour le site. ${budgetContextSummary()}`,
        messages: chatHistory.slice(-16).map(m=>({role:m.role, content:m.content}))
      })
    });
    const data = await res.json();
    typing.remove();
    if(data.error){ chatHistory.push({role:'assistant', content:'Erreur API : '+(data.error.message||'clé invalide ou quota dépassé.')}); }
    else{
      const textOut = (data.content||[]).map(b=>b.text||'').join('\n').trim() || 'Pas de réponse.';
      chatHistory.push({role:'assistant', content:textOut});
    }
  }catch(e){
    typing.remove();
    chatHistory.push({role:'assistant', content:'Impossible de contacter Claude — vérifie ta connexion ou ta clé API.'});
  }
  persistChat(); renderChatPanel();
}
function persistChat(){ chatHistory = chatHistory.slice(-30); localStorage.setItem('claude_chat_msgs', JSON.stringify(chatHistory)); }

/* ============================== BOOT ============================== */
async function boot(){
  await loadState();
  if(ghConfigured()){ await ghPull().catch(()=>{}); }
  const ok = await renderAuthGate();
  if(!ok) return;
  currentView = 'dashboard';
  currentSpace = 'finance';
  lastRoutedView = null;
  applyRouteFromUrl();
  await render();
  updateFab();
  if(ghConfigured()) startPolling();
}
(async function init(){
  await boot();
})();
</script>
</body>
</html>
