<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Solde — Gestion budgétaire</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" onerror="
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';
  s.onload=function(){ if(window.render && window.currentView) render(); };
  document.head.appendChild(s);
"></script>
<style>
:root{
  --bg:#000000;
  --bg-soft:#050505;
  --panel:rgba(255,255,255,0.055);
  --panel-2:rgba(255,255,255,0.085);
  --border:rgba(255,255,255,0.10);
  --border-strong:rgba(255,255,255,0.20);
  --text:#FFFFFF;
  --text-dim:rgba(255,255,255,0.58);
  --text-faint:rgba(255,255,255,0.34);
  --teal:#BFE9D2;
  --teal-dim:#82C79F;
  --coral:#EFB6AC;
  --coral-dim:#C97C70;
  --violet:#E7E7EC;
  --amber:#E3D3A9;
  --glass-blur:24px;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-soft:0 20px 60px rgba(0,0,0,0.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(255,255,255,0.05), transparent 60%),
    radial-gradient(800px 600px at 108% 8%, rgba(255,255,255,0.035), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}
::selection{background:rgba(255,255,255,0.22);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;color:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Layout shell ---------- */
#shell{display:flex;min-height:100vh;}

.sidebar{
  width:236px;flex-shrink:0;
  padding:28px 16px;
  display:flex;flex-direction:column;gap:6px;
  border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(30px) saturate(150%);
  -webkit-backdrop-filter:blur(30px) saturate(150%);
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 26px 10px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#FFFFFF,#C7C7CE);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:18px;height:18px;stroke:#000000;}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;letter-spacing:-0.01em;}
.brand-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}

.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:12px;
  color:var(--text-dim);font-size:14px;font-weight:500;
  transition:background .15s ease,color .15s ease;
  text-align:left;width:100%;
}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(255,255,255,0.10);color:var(--text);}
.nav-spacer{flex:1;}
.sidebar-foot{padding:10px 12px;font-size:11px;color:var(--text-faint);border-top:1px solid var(--border);margin-top:8px;padding-top:14px;}

.mobile-topbar{display:none;}

main{flex:1;min-width:0;padding:34px 40px 80px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.01em;}
.page-sub{color:var(--text-dim);font-size:13.5px;margin-top:4px;}

/* month stepper */
.stepper{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px;}
.stepper button{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.stepper button:hover{background:rgba(255,255,255,0.06);color:var(--text);}
.stepper svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.stepper .label{font-size:13.5px;font-weight:600;padding:0 12px;min-width:120px;text-align:center;text-transform:capitalize;}

/* ---------- Cards / panels ---------- */
.card{
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  backdrop-filter:blur(var(--glass-blur)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(140%);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:22px;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 12px 30px rgba(0,0,0,0.35);
}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr;}}

/* ---------- Hero (dashboard) ---------- */
.hero{
  display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:center;
  padding:34px;margin-bottom:20px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(500px 300px at 90% 0%, rgba(140,124,255,0.10), transparent 60%);
  pointer-events:none;
}
.gauge-wrap{position:relative;width:220px;height:220px;justify-self:center;}
.gauge-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.gauge-value{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;}
.gauge-label{font-size:11.5px;color:var(--text-dim);margin-top:4px;}
.hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.stat-mini{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.025);border:1px solid var(--border);}
.stat-mini .k{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.stat-mini .v{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;}

.stat-card{padding:20px;}
.stat-card .k{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.stat-card .k svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;}
.stat-card .v{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;letter-spacing:-0.01em;}
.stat-card .d{font-size:12px;color:var(--text-faint);margin-top:6px;}

.chart-card canvas{max-height:230px;}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:14px;}

.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);padding:4px 0;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ---------- Section header w/ add button ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;
  transition:transform .1s ease, background .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:#FFFFFF;color:#000000;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(255,255,255,0.09);}
.btn-danger{color:var(--coral);}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-weight:500;color:var(--text-faint);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.04em;padding:0 14px 10px;white-space:nowrap;
}
td{padding:13px 14px;border-top:1px solid var(--border);white-space:nowrap;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
td.num{font-variant-numeric:tabular-nums;font-weight:500;}
td.wrap{white-space:normal;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.pill-teal{background:rgba(191,233,210,0.14);color:var(--teal);}
.pill-coral{background:rgba(239,182,172,0.14);color:var(--coral);}
.pill-amber{background:rgba(255,180,84,0.12);color:var(--amber);}
.pill-dim{background:rgba(255,255,255,0.06);color:var(--text-dim);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.icon-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.icon-btn:hover{background:rgba(255,255,255,0.07);color:var(--text);}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}
.icon-btn.del:hover{color:var(--coral);}

tfoot td{border-top:1px solid var(--border-strong);font-weight:600;color:var(--text);padding-top:14px;}

/* progress bar */
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,0.07);overflow:hidden;width:120px;}
.progress > div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--violet));}

/* empty state */
.empty{padding:60px 20px;text-align:center;color:var(--text-dim);}
.empty svg{width:34px;height:34px;stroke:var(--text-faint);fill:none;stroke-width:1.4;margin-bottom:14px;}
.empty p{font-size:13.5px;margin-bottom:16px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(6,7,10,0.6);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  opacity:0;animation:fadein .15s ease forwards;
}
@keyframes fadein{to{opacity:1;}}
.modal{
  width:100%;max-width:440px;background:rgba(20,20,22,0.72);
  backdrop-filter:blur(36px) saturate(160%);-webkit-backdrop-filter:blur(36px) saturate(160%);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow-soft);
  transform:translateY(8px) scale(0.98);opacity:0;animation:modalin .18s ease forwards;
  max-height:88vh;overflow-y:auto;
}
@keyframes modalin{to{transform:translateY(0) scale(1);opacity:1;}}
.modal h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input,.field select{
  width:100%;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);font-size:13.5px;
  color-scheme:dark;
}
.field select option{background:#161616;color:#FFFFFF;}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:rgba(255,255,255,0.06);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

/* toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--panel-2);border:1px solid var(--border-strong);padding:12px 18px;
  border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-soft);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:2;}

/* responsive */
@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,0.5);}
  .sidebar.open{transform:translateX(0);}
  .mobile-topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;
    background:rgba(10,12,16,0.85);backdrop-filter:blur(14px);z-index:30;
  }
  .mobile-topbar svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;}
  main{padding:22px 18px 60px;}
  .hero{grid-template-columns:1fr;text-align:center;padding:26px;}
  .hero-stats{grid-template-columns:1fr 1fr;}
  #overlay-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:39;}
  #overlay-scrim.show{display:block;}
}

/* ---------- Auth screens ---------- */
#auth-root{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(140,124,255,0.14), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(255,255,255,0.05), transparent 55%),
    var(--bg);
}
.auth-card{width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-soft);}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.auth-brand .brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#FFFFFF,#C7C7CE);display:flex;align-items:center;justify-content:center;}
.auth-brand .brand-mark svg{width:20px;height:20px;stroke:#000000;}
.auth-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--text-dim);margin-bottom:22px;}
.auth-error{background:rgba(239,182,172,0.12);border:1px solid rgba(239,182,172,0.28);color:var(--coral);font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
.auth-switch{text-align:center;font-size:12.5px;color:var(--text-dim);margin-top:16px;}
.auth-switch button{color:var(--teal);font-weight:600;}
.field-note{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
.pw-wrap{position:relative;}
.pw-wrap input{width:100%;padding-right:42px;}
.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.pw-toggle:hover{background:rgba(255,255,255,0.06);color:var(--text);}
.pw-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* ---------- Settings ---------- */
.settings-block{margin-bottom:24px;}
.settings-block h3{font-size:15px;font-weight:600;margin-bottom:4px;}
.settings-block .sub{font-size:12.5px;color:var(--text-dim);margin-bottom:14px;}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);}
.user-row:first-of-type{border-top:none;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:#000000;flex-shrink:0;}
.user-row .info{flex:1;min-width:0;}
.user-row .name{font-size:13.5px;font-weight:600;}
.user-row .meta{font-size:11.5px;color:var(--text-dim);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:4px;}
.sidebar-user .info{flex:1;min-width:0;}
.sidebar-user .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user .role{font-size:10.5px;color:var(--text-faint);text-transform:capitalize;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;}
.kv-input-row{display:flex;gap:10px;}
.kv-input-row input{flex:1;}

/* ---------- Claude assistant ---------- */
#claude-fab{
  position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#FFFFFF,#C7C7CE);
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.4);
  z-index:150;transition:transform .15s ease;
}
#claude-fab:hover{transform:scale(1.06);}
#claude-fab svg{width:24px;height:24px;stroke:#000000;fill:none;stroke-width:2;}
#claude-panel{
  position:fixed;bottom:96px;right:24px;width:360px;max-width:calc(100vw - 32px);height:min(560px, calc(100vh - 140px));
  background:rgba(20,20,22,0.72);backdrop-filter:blur(36px) saturate(160%);-webkit-backdrop-filter:blur(36px) saturate(160%);
  border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);z-index:150;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease;
}
#claude-panel.open{transform:translateY(0);opacity:1;pointer-events:auto;}
.cp-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.cp-head .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);}
.cp-head .t{font-weight:600;font-size:14px;flex:1;}
.cp-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.cp-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;}
.cp-msg.user{align-self:flex-end;background:#FFFFFF;color:#000000;border-bottom-right-radius:4px;}
.cp-msg.assistant{align-self:flex-start;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-bottom-left-radius:4px;white-space:pre-wrap;}
.cp-msg.error{align-self:flex-start;background:rgba(239,182,172,0.12);border:1px solid rgba(239,182,172,0.28);color:var(--coral);}
.cp-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;}
.cp-foot textarea,.cp-foot input[type="text"]{flex:1;resize:none;height:40px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:13px;font-family:inherit;color:var(--text);}
.cp-foot textarea:focus,.cp-foot input[type="text"]:focus{outline:none;border-color:var(--teal);}
.cp-send{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#FFFFFF,#C7C7CE);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cp-send svg{width:17px;height:17px;stroke:#000000;fill:none;stroke-width:2.2;}
.cp-empty{color:var(--text-dim);font-size:12.5px;text-align:center;margin:auto;padding:0 20px;}
.typing-dots{display:flex;gap:4px;padding:4px 0;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:blink 1.2s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

/* ---------- Notifications ---------- */
.notif-badge{
  position:absolute;top:8px;left:30px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:#FFFFFF;color:#000000;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--bg);
}
#notif-panel{
  position:fixed;bottom:24px;left:250px;width:340px;max-width:calc(100vw - 32px);max-height:min(480px, calc(100vh - 60px));
  background:rgba(20,20,22,0.78);backdrop-filter:blur(36px) saturate(160%);-webkit-backdrop-filter:blur(36px) saturate(160%);
  border:1px solid var(--border-strong);border-radius:var(--radius-lg);

function icon(name){ return `<svg viewBox="0 0 24 24">${ICONS[name]||''}</svg>`; }

/* ============================== STATE ============================== */
const MONTH_NAMES = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const CATS_ABO = ['Internet','Transport','Mobile','Divertissement','Stockage','Gestion','Finance','Autre'];
const CATS_REV = ['Salaire','Remboursement','Prime','Cadeau','Autre'];
const CATS_DEP = ['Achat','Réparation','Santé','Loisirs','Cadeau','Voyage','Imprévu','Autre'];
const COMPTES = ['Compte Joint','Compte Perso'];

var state = null;
var authState = null;
var socialState = null;
var currentView = 'dashboard';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function defaultAuth(){
  return { users: [] };
}
function defaultSocial(){
  return { jointRequests: [], messages: [], accountRequests: [], expenseDeleteRequests: [] };
}
function defaultState(){
  const now = new Date();
  return {
    selectedMonth: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,
    selectedYear: now.getFullYear(),
    revenusRecurrents: [],
    revenusExceptionnels: [],
    abonnements: [],
    depenses: [],
    objectifs: [],
    versements: [],
    charges: []
  };
}

async function loadState(){
  let needsPersist = false, needsPersistAuth = false, needsPersistSocial = false;

  // Données du budget (partagées)
  try{
    const raw = localStorage.getItem('budget_store');
    if(raw){ state = JSON.parse(raw); } else { state = defaultState(); needsPersist = true; }
  }catch(e){ state = defaultState(); needsPersist = true; }

  // Données de connexion (comptes) — fichier séparé, propre à l'authentification
  try{
    const rawAuth = localStorage.getItem('budget_auth');
    if(rawAuth){ authState = JSON.parse(rawAuth); }
    else if(state.users){ authState = { users: state.users }; delete state.users; needsPersist = true; needsPersistAuth = true; }
    else{ authState = defaultAuth(); needsPersistAuth = true; }
  }catch(e){ authState = defaultAuth(); needsPersistAuth = true; }

  // Données sociales (demandes de compte joint, messages) — fichier séparé aussi
  try{
    const rawSocial = localStorage.getItem('budget_social');
    socialState = rawSocial ? JSON.parse(rawSocial) : defaultSocial();
    if(!socialState.accountRequests){ socialState.accountRequests = []; needsPersistSocial = true; }
    if(!socialState.expenseDeleteRequests){ socialState.expenseDeleteRequests = []; needsPersistSocial = true; }
    if(!rawSocial) needsPersistSocial = true;
  }catch(e){ socialState = defaultSocial(); needsPersistSocial = true; }

  // Migration : d'anciennes saisies (avant la séparation par utilisateur) n'ont pas
  // de propriétaire. On les attribue au premier compte admin pour ne rien perdre.
  const firstAdmin = authState.users.find(u=>u.role==='admin');
  if(firstAdmin){
    OWNED_ARRAYS.forEach(key=>{
      (state[key]||[]).forEach(item=>{ if(!item.ownerId){ item.ownerId = firstAdmin.id; needsPersist = true; } });
    });
  }

  // Migration : l'ancien modèle "Échéances" (saisie manuelle séparée) devient une
  // dépense "Échelonnée" dans le nouvel onglet Dépenses, calculée automatiquement.
  if(Array.isArray(state.echeances) && state.echeances.length>0){
    if(!state.depenses) state.depenses = [];
    state.echeances.forEach(e=>{
      const nb = e.nbMensualites||1;
      const [y,m,d] = (e.premierPaiement||'').split('-').map(Number);
      let dateFin = e.premierPaiement;
      if(y && m && d){
        const endMonthIndex = (m-1) + (nb-1);
        const daysInEnd = new Date(y, endMonthIndex+1, 0).getDate();
        const endDate = new Date(y, endMonthIndex, Math.min(d, daysInEnd));
        dateFin = `${endDate.getFullYear()}-${String(endDate.getMonth()+1).padStart(2,'0')}-${String(endDate.getDate()).padStart(2,'0')}`;
      }
      state.depenses.push({
        id: e.id, ownerId: e.ownerId, libelle: e.achat, categorie:'Achat', compte: e.compte||'Compte Perso',
        montant: e.montantTotal, modePaiement:'Echelonne', dateDebut: e.premierPaiement, dateFin, mensualitesPayees: 0, notes:''
      });
    });
    delete state.echeances;
    needsPersist = true;
  }

  // Migration : les revenus exceptionnels négatifs (ancien "bricolage" pour noter une
  // dépense ponctuelle, avant l'existence de l'onglet Dépenses) deviennent de vraies
  // dépenses "En une fois", avec un montant positif comme il se doit.
  if(Array.isArray(state.revenusExceptionnels)){
    const negatifs = state.revenusExceptionnels.filter(r=>Number(r.montant)<0);
    if(negatifs.length>0){
      if(!state.depenses) state.depenses = [];
      negatifs.forEach(r=>{
        state.depenses.push({
          id: r.id, ownerId: r.ownerId, libelle: r.libelle, categorie: r.categorie==='Autre' ? 'Imprévu' : r.categorie,
          compte: 'Compte Perso', montant: Math.abs(Number(r.montant)), modePaiement:'Unique', date: r.date, notes:''
        });
      });
      state.revenusExceptionnels = state.revenusExceptionnels.filter(r=>Number(r.montant)>=0);
      needsPersist = true;
    }
  }

  // Migration : même bricolage possible sur les revenus RÉCURRENTS négatifs —
  // l'équivalent logique est une charge récurrente (Fixe), pas une dépense ponctuelle.
  if(Array.isArray(state.revenusRecurrents)){
    const negatifsRec = state.revenusRecurrents.filter(r=>Number(r.montant)<0);
    if(negatifsRec.length>0){
      if(!state.charges) state.charges = [];
      negatifsRec.forEach(r=>{
        state.charges.push({
          id: r.id, ownerId: r.ownerId, categorie: r.libelle, type:'Fixe',
          description: r.categorie==='Autre' ? '' : r.categorie, budget: Math.abs(Number(r.montant)),
          compte:'Compte Perso', dateDebut: r.dateDebut||null, dateFin: r.dateFin||null, notes:''
        });
      });
      state.revenusRecurrents = state.revenusRecurrents.filter(r=>Number(r.montant)>=0);
      needsPersist = true;
    }
  }

  if(needsPersist) await persist();
  if(needsPersistAuth) await persistAuth();
  if(needsPersistSocial) await persistSocial();
}
const OWNED_ARRAYS = ['revenusRecurrents','revenusExceptionnels','abonnements','depenses','objectifs','versements','charges'];
function mine(arr){
  const me = currentUser();
  return me ? (arr||[]).filter(e=>e.ownerId===me.id) : [];
}
let saveTimer = null;
function persist(){
  return new Promise((resolve)=>{
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        localStorage.setItem('budget_store', JSON.stringify(state));
        markDirtyForSync();
      }
      catch(e){ console.error('Erreur de sauvegarde locale', e); }
      resolve();
    }, 120);
  });
}
let saveAuthTimer = null;
function persistAuth(){
  return new Promise((resolve)=>{
    clearTimeout(saveAuthTimer);
    saveAuthTimer = setTimeout(async ()=>{
      try{
        localStorage.setItem('budget_auth', JSON.stringify(authState));
        markDirtyForSync();
      }
      catch(e){ console.error('Erreur de sauvegarde locale (comptes)', e); }
      resolve();
    }, 120);
  });
}
let saveSocialTimer = null;
function persistSocial(){
  return new Promise((resolve)=>{
    clearTimeout(saveSocialTimer);
    saveSocialTimer = setTimeout(async ()=>{
      try{
        localStorage.setItem('budget_social', JSON.stringify(socialState));
        markDirtyForSync();
      }
      catch(e){ console.error('Erreur de sauvegarde locale (social)', e); }
      resolve();
    }, 120);
  });
}

/* ============================== HELPERS ============================== */
const fmtEUR = (n) => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Math.round((n||0)*100)/100);
const fmtEURPrecise = (n) => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return `${MONTH_NAMES[m-1]} ${y}`; }
function monthBounds(key){ const [y,m]=key.split('-').map(Number); return {start:new Date(y,m-1,1), end:new Date(y,m,0)}; }
function addMonths(key, delta){ let [y,m]=key.split('-').map(Number); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return monthKey(y,m); }
function inRangeMonth(key, dateDebut, dateFin){
  const {start,end} = monthBounds(key);
  const d0 = dateDebut ? new Date(dateDebut+'T00:00:00') : null;
  const d1 = dateFin ? new Date(dateFin+'T00:00:00') : null;
  if(d0 && d0 > end) return false;
  if(d1 && d1 < start) return false;
  return true;
}
function monthlyCost(ab){
  const m = Number(ab.montant)||0;
  switch(ab.frequence){
    case 'Annuel': return m/12;
    case 'Trimestriel': return m/3;
    case 'Hebdomadaire': return m*4.345;
    default: return m;
  }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = icon('check') + `<span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============================== COMPUTATIONS ============================== */
function revenusDuMois(key){ return revenusDuMoisForOwner(currentUser().id, key); }
function revenusDuMoisForOwner(ownerId, key){
  let total = 0;
  forOwner(state.revenusRecurrents, ownerId).forEach(r=>{ if(inRangeMonth(key, r.dateDebut, r.dateFin)) total += Number(r.montant)||0; });
  const {start,end} = monthBounds(key);
  forOwner(state.revenusExceptionnels, ownerId).forEach(r=>{
    const d = r.date ? new Date(r.date+'T00:00:00') : null;
    if(d && d>=start && d<=end) total += Number(r.montant)||0;
  });
  return total;
}
function abonnementsActifs(){ return mine(state.abonnements).filter(a=>a.statut==='Actif'); }
function abonnementsTotalMensuel(excludeCompte){
  return abonnementsActifs().filter(a=> excludeCompte ? a.compte!==excludeCompte : true).reduce((s,a)=>s+monthlyCost(a),0);
}

/* ---- Dépenses : uniques (payées en une fois) ou échelonnées (plusieurs mensualités) ---- */
function depenseNbMensualites(dep){
  if(dep.modePaiement!=='Echelonne' || !dep.dateDebut || !dep.dateFin) return 1;
  const [y0,m0] = dep.dateDebut.split('-').map(Number);
  const [y1,m1] = dep.dateFin.split('-').map(Number);
  const diff = (y1-y0)*12 + (m1-m0) + 1;
  return Math.max(diff,1);
}
function depenseMensualite(dep){
  return dep.modePaiement==='Echelonne' ? (Number(dep.montant)||0)/depenseNbMensualites(dep) : (Number(dep.montant)||0);
}
function depenseMensualiteDuMois(dep, key){
  if(dep.modePaiement==='Echelonne'){
    if(!dep.dateDebut || !dep.dateFin) return 0;
    return inRangeMonth(key, dep.dateDebut, dep.dateFin) ? depenseMensualite(dep) : 0;
  }
  if(!dep.date) return 0;
  return dep.date.slice(0,7)===key ? (Number(dep.montant)||0) : 0;
}
function depenseResteAPayer(dep){
  if(dep.modePaiement!=='Echelonne') return 0;
  const nb = depenseNbMensualites(dep);
  const payees = Math.min(dep.mensualitesPayees||0, nb);
  return Math.max((Number(dep.montant)||0) - payees*depenseMensualite(dep), 0);
}
function depensesTotalMois(key, excludeCompte){
  return mine(state.depenses).filter(d=> excludeCompte ? d.compte!==excludeCompte : true).reduce((s,d)=>s+depenseMensualiteDuMois(d,key),0);
}
function depensesEchelonneesResteAPayerTotal(){
  return mine(state.depenses).filter(d=>d.modePaiement==='Echelonne').reduce((s,d)=>s+depenseResteAPayer(d),0);
}

function chargesActivesMois(key, excludeCompte){
  return mine(state.charges).filter(c=> inRangeMonth(key, c.dateDebut, c.dateFin) && (excludeCompte ? c.compte!==excludeCompte : true));
}
function chargesTotalMois(key, excludeCompte){ return chargesActivesMois(key, excludeCompte).reduce((s,c)=>s+(Number(c.budget)||0),0); }

function objectifVerse(obj){ return mine(state.versements).filter(v=>v.objectifNom===obj.nom).reduce((s,v)=>s+(Number(v.montant)||0),0); }
function objectifMoisRestants(obj){
  if(!obj.dateDebut || !obj.dateFin) return 1;
  const [y0,m0] = obj.dateDebut.split('-').map(Number);
  const [y1,m1] = obj.dateFin.split('-').map(Number);
  const diff = (y1-y0)*12 + (m1-m0) + 1;
  return Math.max(diff,1);
}
function objectifCalc(obj){
  const verse = objectifVerse(obj);
  const restant = Math.max((Number(obj.montantCible)||0) - verse, 0);
  const moisRestants = objectifMoisRestants(obj);
  const mensualite = restant>0 ? restant/moisRestants : 0;
  const pct = obj.montantCible>0 ? Math.min(verse/obj.montantCible,1) : 0;
  let statut = 'À venir';
  if(pct>=1) statut='Atteint';
  else if(verse>0) statut='En cours';
  return {verse, restant, moisRestants, mensualite, pct, statut};
}
function objectifsEpargneMensuelleTotal(){ return mine(state.objectifs).reduce((s,o)=>s+objectifCalc(o).mensualite,0); }
function objectifsEpargneMensuelleMois(key){
  return mine(state.objectifs).filter(o=>inRangeMonth(key, o.dateDebut, o.dateFin)).reduce((s,o)=>s+objectifCalc(o).mensualite,0);
}

/* ---- Compte joint : agrège les saisies taguées "Compte Joint" de MOI et de mon partenaire ---- */
function forOwner(arr, ownerId){ return (arr||[]).filter(e=>e.ownerId===ownerId); }
function jointPartner(){
  const me = currentUser();
  if(!me || !me.jointWith) return null;
  return authState.users.find(u=>u.id===me.jointWith) || null;
}
function jointAboTotalFor(ownerId){
  return forOwner(state.abonnements, ownerId).filter(a=>a.statut==='Actif' && a.compte==='Compte Joint').reduce((s,a)=>s+monthlyCost(a),0);
}
function jointChargesTotalFor(ownerId, key){
  return forOwner(state.charges, ownerId).filter(c=>c.compte==='Compte Joint' && inRangeMonth(key, c.dateDebut, c.dateFin)).reduce((s,c)=>s+(Number(c.budget)||0),0);
}
function jointDepensesTotalFor(ownerId, key){
  return forOwner(state.depenses, ownerId).filter(d=>d.compte==='Compte Joint').reduce((s,d)=>s+depenseMensualiteDuMois(d,key),0);
}
function jointDetailFor(ownerId, key){
  const abo = forOwner(state.abonnements, ownerId).filter(a=>a.statut==='Actif' && a.compte==='Compte Joint').map(a=>({id:a.id, itemType:'abonnements', nom:a.nom, montant:monthlyCost(a), cat:a.categorie}));
  const ch = forOwner(state.charges, ownerId).filter(c=>c.compte==='Compte Joint' && inRangeMonth(key, c.dateDebut, c.dateFin)).map(c=>({id:c.id, itemType:'charges', nom:c.categorie, montant:Number(c.budget), cat:c.description||c.type}));
  const dep = forOwner(state.depenses, ownerId).filter(d=>d.compte==='Compte Joint' && depenseMensualiteDuMois(d,key)>0).map(d=>({id:d.id, itemType:'depenses', nom:d.libelle, montant:depenseMensualiteDuMois(d,key), cat:d.modePaiement==='Echelonne'?'Dépense échelonnée':'Dépense'}));
  return [...abo, ...ch, ...dep];
}
/* Répartition du compte joint au prorata des revenus de chacun.
   Si personne n'a de revenu déclaré ce mois-là, on retombe sur un 50/50.
   Un revenu peut être explicitement exclu de ce calcul (excludeFromJoint). */
function jointTotalChargesFor(meId, partnerId, key){
  return jointAboTotalFor(meId) + jointChargesTotalFor(meId, key) + jointDepensesTotalFor(meId, key)
       + jointAboTotalFor(partnerId) + jointChargesTotalFor(partnerId, key) + jointDepensesTotalFor(partnerId, key);
}
function revenusDuMoisPourPartage(ownerId, key){
  let total = 0;
  forOwner(state.revenusRecurrents, ownerId).filter(r=>!r.excludeFromJoint).forEach(r=>{ if(inRangeMonth(key, r.dateDebut, r.dateFin)) total += Number(r.montant)||0; });
  const {start,end} = monthBounds(key);
  forOwner(state.revenusExceptionnels, ownerId).filter(r=>!r.excludeFromJoint).forEach(r=>{
    const d = r.date ? new Date(r.date+'T00:00:00') : null;
    if(d && d>=start && d<=end) total += Number(r.montant)||0;
  });
  return total;
}
function jointIncomeShares(key){
  const me = currentUser(); const partner = jointPartner();
  if(!partner) return null;
  const myInc = revenusDuMoisPourPartage(me.id, key);
  const partnerInc = revenusDuMoisPourPartage(partner.id, key);
  const total = myInc + partnerInc;
  const myShare = total>0 ? myInc/total : 0.5;
  return { myInc, partnerInc, myShare, partnerShare: 1-myShare, totalCharges: jointTotalChargesFor(me.id, partner.id, key) };
}
function myJointContribution(key){
  const shares = jointIncomeShares(key);
  return shares ? shares.totalCharges * shares.myShare : 0;
}

function dashboardData(key){
  const partner = jointPartner();
  const revenu = revenusDuMois(key);
  // Sans compte joint actif, les saisies taguées "Compte Joint" restent des
  // dépenses perso classiques (rien ni personne avec qui les partager).
  const aboHorsCJ = partner ? abonnementsTotalMensuel('Compte Joint') : abonnementsTotalMensuel();
  const chargesHorsCJ = partner ? chargesTotalMois(key,'Compte Joint') : chargesTotalMois(key);
  const depensesHorsCJ = partner ? depensesTotalMois(key,'Compte Joint') : depensesTotalMois(key);
  const virementCJ = partner ? myJointContribution(key) : 0;
  const epargneObj = objectifsEpargneMensuelleMois(key);
  const totalDepenses = aboHorsCJ + chargesHorsCJ + depensesHorsCJ + virementCJ + epargneObj;
  const solde = revenu - totalDepenses;
  return {revenu, aboHorsCJ, chargesHorsCJ, depensesHorsCJ, virementCJ, epargneObj, totalDepenses, solde};
}
function anneeData(year){
  const months = [];
  for(let m=1;m<=12;m++){
    const key = monthKey(year,m);
    const d = dashboardData(key);
    months.push({key, ...d});
  }
  const totals = months.reduce((acc,m)=>{
    acc.revenu+=m.revenu; acc.depenses+=m.totalDepenses; acc.solde+=m.solde; return acc;
  }, {revenu:0,depenses:0,solde:0});
  return {months, totals};
}

/* ============================== MODAL SYSTEM ============================== */
function openModal(title, fields, values, onSave, extraHtml){
  const root = document.getElementById('modal-root');
  const isEdit = !!(values && values.id);
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h3>${title}</h3>
        <form id="modal-form">
          ${fields.map(f=>fieldHTML(f, values)).join('')}
          ${extraHtml||''}
          ${fields.length>0 ? `<div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancel-btn">Annuler</button>
            <button type="submit" class="btn btn-primary">${icon('check')}${isEdit?'Enregistrer':'Ajouter'}</button>
          </div>` : ''}
        </form>
      </div>
    </div>`;
  const ov = document.getElementById('ov');
  ov.addEventListener('click', (e)=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('cancel-btn')?.addEventListener('click', closeModal);
  document.getElementById('modal-form').onsubmit = async (e)=>{
    e.preventDefault();
    const data = {};
    fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      if(!el) return;
      let v = f.type==='checkbox' ? el.checked : el.value;
      if(f.type==='number') v = v===''? 0 : parseFloat(v);
      if(f.type==='date' && v==='') v = null;
      data[f.key] = v;
    });
    // onSave peut renvoyer explicitement false pour signaler une validation
    // échouée : dans ce cas, le modal reste ouvert (rien n'est perdu, l'utilisateur
    // corrige simplement sa saisie) plutôt que de se fermer sur une erreur.
    const result = await onSave(data);
    if(result===false) return;
    closeModal();
  };
  setTimeout(()=>{ const first = document.querySelector('#modal-form input,#modal-form select'); if(first) first.focus(); }, 50);
}
function fieldHTML(f, values){
  const val = values && values[f.key]!==undefined && values[f.key]!==null ? values[f.key] : (f.default!==undefined?f.default:'');
  if(f.type==='select'){
    const opts = f.options.map(o=> typeof o==='object' ? o : {value:o, label:o});
    return `<div class="field"><label>${f.label}</label><select id="f_${f.key}">${opts.map(o=>`<option value="${o.value}" ${String(o.value)===String(val)?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
  }
  if(f.type==='checkbox'){
    return `<div class="field" style="display:flex;align-items:center;gap:9px;"><input id="f_${f.key}" type="checkbox" ${val?'checked':''} style="width:16px;height:16px;accent-color:#FFFFFF;"><label style="margin:0;font-size:13px;color:var(--text);">${f.label}</label></div>`;
  }
  if(f.type==='password'){
    return `<div class="field"><label>${f.label}</label><div class="pw-wrap"><input id="f_${f.key}" type="password" value="${val||''}" placeholder="${f.placeholder||''}" autocomplete="${f.autocomplete||'current-password'}"><button type="button" class="pw-toggle" data-toggle-pw="f_${f.key}">${icon('eye')}</button></div></div>`;
  }
  return `<div class="field"><label>${f.label}</label><input id="f_${f.key}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${val===0?0:(val||'')}" placeholder="${f.placeholder||''}"></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function confirmDelete(label, onYes){
  openModal(`Supprimer « ${label} » ?`, [], {}, ()=>{}, `
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:6px;">Cette action est définitive.</p>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" id="del-cancel">Annuler</button>

}

function gaugeSVG(pct, positive){
  const r = 92, c = 2*Math.PI*r;

  const offset = c - clamped*c;
  const color = positive ? 'url(#gradTeal)' : 'url(#gradCoral)';
  return `
  <svg viewBox="0 0 220 220">
    <defs>
      <linearGradient id="gradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#BFE9D2"/><stop offset="100%" stop-color="#FFFFFF"/>
      </linearGradient>
      <linearGradient id="gradCoral" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EFB6AC"/><stop offset="100%" stop-color="#E3D3A9"/>
      </linearGradient>
    </defs>
    <circle cx="110" cy="110" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
    <circle cx="110" cy="110" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function setupDepenseFormToggle(){
  const sel = document.getElementById('f_modePaiement');
  if(!sel) return;
  const dateField = document.getElementById('f_date')?.closest('.field');
  const debutField = document.getElementById('f_dateDebut')?.closest('.field');
  const finField = document.getElementById('f_dateFin')?.closest('.field');
  const prioriteField = document.getElementById('f_priorite')?.closest('.field');
  const montantEl = document.getElementById('f_montant');
  const debutEl = document.getElementById('f_dateDebut');
  const finEl = document.getElementById('f_dateFin');
  const preview = document.getElementById('depense-preview');

  function updatePreview(){
    if(!preview) return;
    if(sel.value!=='Echelonne'){ preview.innerHTML=''; return; }
    const montant = parseFloat(montantEl?.value)||0;
    const debut = debutEl?.value, fin = finEl?.value;
    if(!debut || !fin){ preview.innerHTML = 'Renseigne les deux dates pour voir le calcul.'; return; }
    if(fin < debut){ preview.innerHTML = '<span style="color:var(--coral);">La date de fin doit être après la date de début.</span>'; return; }
    const nb = depenseNbMensualites({modePaiement:'Echelonne', dateDebut:debut, dateFin:fin});
    const mensualite = nb>0 ? montant/nb : 0;
    preview.innerHTML = `→ <strong style="color:var(--text);">${nb}</strong> mensualité${nb>1?'s':''} de <strong style="color:var(--text);">${fmtEURPrecise(mensualite)}</strong>`;
  }
  function update(){
    const echelonne = sel.value==='Echelonne';
    const previsionnelle = sel.value==='Previsionnelle';
    if(dateField) dateField.style.display = (echelonne || previsionnelle) ? 'none' : '';
    if(debutField) debutField.style.display = (echelonne && !previsionnelle) ? '' : 'none';
    if(finField) finField.style.display = (echelonne && !previsionnelle) ? '' : 'none';
    if(prioriteField) prioriteField.style.display = previsionnelle ? '' : 'none';
    updatePreview();
  }
  sel.addEventListener('change', update);
  montantEl?.addEventListener('input', updatePreview);
  debutEl?.addEventListener('input', updatePreview);
  finEl?.addEventListener('input', updatePreview);
  update();
}

      <div class="card stat-card"><div class="k"><span class="avatar" style="width:18px;height:18px;font-size:9px;display:inline-flex;background:${avatarColor(partner)};margin-right:4px;">${initials(partner)}</span> Dépenses de ${partner.displayName}</div><div class="v">${fmtEUR(partnerTotal)}</div></div>
      <div class="card stat-card"><div class="k">${icon('wallet')} Total compte joint</div><div class="v" style="color:var(--violet)">${fmtEUR(total)}</div></div>

      <div class="grid g2">

          <div class="progress" style="width:100%;margin-top:8px;"><div style="width:${shares.myShare*100}%"></div></div>
        </div>
        <div class="stat-mini">
          <div class="k">${partner.displayName} — revenu ${fmtEUR(shares.partnerInc)} (${Math.round(shares.partnerShare*100)}%)</div>
          <div class="v" style="color:var(--teal)">${fmtEUR(shares.totalCharges*shares.partnerShare)}</div>
          <div class="progress" style="width:100%;margin-top:8px;"><div style="width:${shares.partnerShare*100}%"></div></div>

    <div class="card" style="margin-top:16px;">
      <div class="section-head" style="margin-bottom:10px;"><h3 style="font-size:14px;font-weight:600;">Messages avec ${partner.displayName}</h3></div>
      <div id="joint-messages" class="messages-list">
        ${renderMessagesList(partner)}
      </div>
      <div class="cp-foot" style="border-top:none;padding:12px 0 0;">
        <input type="text" id="msg-input" placeholder="Écris un message…" enterkeyhint="send" autocomplete="off">
        <button class="cp-send" data-action="send-message">${icon('send')}</button>
      </div>
    </div>
  `;
}
function renderMessagesList(partner){
  const me = currentUser();
  const msgs = socialState.messages.filter(m=>(m.fromId===me.id && m.toId===partner.id) || (m.fromId===partner.id && m.toId===me.id))
    .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(msgs.length===0) return `<div class="cp-empty" style="padding:20px 0;">${icon('message')}<br>Aucun message pour l\u2019instant.</div>`;
  return msgs.map(m=>`<div class="cp-msg ${m.fromId===me.id?'user':'assistant'}">${escapeHTML(m.text)}</div>`).join('');
}
function drawJointCompareChart(){
  const ctx = document.getElementById('chartJointCompare');
  if(!ctx) return;
  const me = currentUser(); const partner = jointPartner();
  if(!partner) return;
  if(!chartLibReady()){ chartUnavailableNote('chartJointCompare'); return; }
  destroyChart('jointCmp');
  const key = state.selectedMonth;
  const myTotal = jointAboTotalFor(me.id) + jointChargesTotalFor(me.id, key);
  const partnerTotal = jointAboTotalFor(partner.id) + jointChargesTotalFor(partner.id, key);
  charts.jointCmp = new Chart(ctx, {
    type:'bar',
    data:{ labels:[me.displayName, partner.displayName], datasets:[{ data:[myTotal, partnerTotal], backgroundColor:[avatarSolid(me), avatarSolid(partner)], borderRadius:8, maxBarThickness:60 }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{ x:{ grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#8D95A6'} }, y:{ grid:{display:false}, ticks:{color:'#F2F3F6', font:{size:13}} } } }
  });
}
function avatarSolid(u){
  const colors = ['#FFFFFF','#C7C7CE','#EFB6AC','#BFE9D2'];
  let h=0; for(const c of (u.id||'')) h = (h*31 + c.charCodeAt(0)) % colors.length;
  return colors[Math.abs(h)%colors.length];
}

/* ============================== EVENT HANDLING ============================== */
function afterRender(){
  // Un souci ponctuel de graphique (ex. bibliothèque externe indisponible) ne
  // doit jamais interrompre le reste de l'application (notifications, sync...).
  try{
    if(currentView==='dashboard') drawDashboardCharts();
    if(currentView==='annuelle') drawAnnuelleChart();
    if(currentView==='compteJoint'){
      drawJointCompareChart();
      markMessagesRead();
      const input = document.getElementById('msg-input');
      if(input) input.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleAction('send-message'); } });
      const list = document.getElementById('joint-messages');
      if(list) list.scrollTop = list.scrollHeight;
    }
  }catch(e){ console.error('afterRender: erreur non bloquante', e); }
}

document.addEventListener('change', (e)=>{
  if(e.target.id==='import-file-input' && e.target.files[0]){ importDataFile(e.target.files[0]); }
});

document.addEventListener('click', async (e)=>{
  if(notifOpen && !e.target.closest('#notif-panel') && !e.target.closest('[data-action="toggle-notif-panel"]')){ toggleNotifPanel(false); }

  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){ currentView = navBtn.dataset.nav; closeSidebarMobile(); await render(); return; }

  const stepBtn = e.target.closest('[data-stepper]');
  if(stepBtn){ state.selectedMonth = addMonths(state.selectedMonth, Number(stepBtn.dataset.dir)); await persist(); await render(); return; }

  const yearBtn = e.target.closest('[data-year-step]');
  if(yearBtn){ state.selectedYear += Number(yearBtn.dataset.yearStep); await persist(); await render(); return; }

  const burger = e.target.closest('#burger');
  if(burger){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay-scrim').classList.toggle('show'); return; }
  if(e.target.id==='overlay-scrim'){ closeSidebarMobile(); return; }

  if(e.target.closest('#claude-fab')){ toggleChat(); return; }
  if(e.target.closest('[data-action="close-chat"]')){ toggleChat(false); return; }
  if(e.target.closest('[data-action="close-notif"]')){ toggleNotifPanel(false); return; }
  const pwToggle = e.target.closest('[data-toggle-pw]');
  if(pwToggle){
    const input = document.getElementById(pwToggle.dataset.togglePw);
    if(input){
      const showing = input.type==='text';
      input.type = showing ? 'password' : 'text';
      pwToggle.innerHTML = icon(showing ? 'eye' : 'eyeOff');
    }
    return;
  }
  if(e.target.closest('[data-action="open-messages"]')){ toggleNotifPanel(false); currentView='compteJoint'; await render(); return; }
  if(e.target.closest('[data-action="open-parametres"]')){ toggleNotifPanel(false); currentView='parametres'; await render(); return; }

  const actionEl = e.target.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.dataset.action, id = actionEl.dataset.id;
  await handleAction(action, id, actionEl);
});
function closeSidebarMobile(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay-scrim').classList.remove('show'); }

async function handleAction(action, id, el){
  const find = (arr)=> arr.find(x=>x.id===id);
  switch(action){
    /* Revenus récurrents */
    case 'add-revrec': openModal('Ajouter un revenu récurrent', revrecFields(), {categorie:'Salaire', dateDebut: new Date().toISOString().slice(0,10)}, async (data)=>{
      if(Number(data.montant)<0){ toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense récurrente.'); return false; }
      state.revenusRecurrents.push({id:uid(), ownerId:currentUser().id, ...data}); await persist(); await render(); toast('Revenu ajouté'); }); break;
    case 'edit-revrec': openModal('Modifier le revenu', revrecFields(), find(mine(state.revenusRecurrents)), async (data)=>{
      if(Number(data.montant)<0){ toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense récurrente.'); return false; }
      Object.assign(find(mine(state.revenusRecurrents)), data); await persist(); await render(); toast('Revenu mis à jour'); }); break;
    case 'del-revrec': { const item=find(mine(state.revenusRecurrents)); confirmDelete(item.libelle, async ()=>{ state.revenusRecurrents = state.revenusRecurrents.filter(x=>x.id!==id); await persist(); await render(); toast('Revenu supprimé'); }); break; }

    /* Revenus exceptionnels */
    case 'add-revexc': openModal('Ajouter une rentrée exceptionnelle', revexcFields(), {date:new Date().toISOString().slice(0,10), categorie:'Autre'}, async (data)=>{
      if(Number(data.montant)<0){ toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense exceptionnelle.'); return false; }
      state.revenusExceptionnels.push({id:uid(), ownerId:currentUser().id, ...data}); await persist(); await render(); toast('Rentrée ajoutée'); }); break;
    case 'edit-revexc': openModal('Modifier la rentrée', revexcFields(), find(mine(state.revenusExceptionnels)), async (data)=>{
      if(Number(data.montant)<0){ toast('Un revenu ne peut pas être négatif — utilise l\u2019onglet Dépenses pour une dépense exceptionnelle.'); return false; }
      Object.assign(find(mine(state.revenusExceptionnels)), data); await persist(); await render(); toast('Rentrée mise à jour'); }); break;
    case 'del-revexc': { const item=find(mine(state.revenusExceptionnels)); confirmDelete(item.libelle, async ()=>{ state.revenusExceptionnels = state.revenusExceptionnels.filter(x=>x.id!==id); await persist(); await render(); toast('Rentrée supprimée'); }); break; }

    /* Abonnements */
    case 'add-abo': openModal('Ajouter un abonnement', abo_fields(), {categorie:'Divertissement', frequence:'Mensuel', compte:'Compte Perso', statut:'Actif', prochain:new Date().toISOString().slice(0,10)}, async (data)=>{
      state.abonnements.push({id:uid(), ownerId:currentUser().id, notes:'', ...data}); await persist(); await render(); toast('Abonnement ajouté'); }); break;
    case 'edit-abo': openModal('Modifier l\u2019abonnement', abo_fields(), find(mine(state.abonnements)), async (data)=>{
      Object.assign(find(mine(state.abonnements)), data); await persist(); await render(); toast('Abonnement mis à jour'); }); break;
    case 'del-abo': { const item=find(mine(state.abonnements)); confirmDelete(item.nom, async ()=>{ state.abonnements = state.abonnements.filter(x=>x.id!==id); await persist(); await render(); toast('Abonnement supprimé'); }); break; }
    case 'toggle-abo': { const item=find(mine(state.abonnements)); item.statut = item.statut==='Actif'?'Inactif':'Actif'; await persist(); await render(); toast('Statut mis à jour'); break; }

    /* Dépenses */
    case 'add-depense': openModal('Ajouter une dépense', depense_fields(), {categorie:'Achat', compte: jointPartner()?'Compte Perso':'Compte Perso', modePaiement:'Unique', date:new Date().toISOString().slice(0,10), priorite:'Moyenne'}, async (data)=>{
      const dep = {id:uid(), ownerId:currentUser().id, libelle:data.libelle, categorie:data.categorie, compte:data.compte, montant:data.montant, modePaiement:data.modePaiement, notes:''};
      if(data.modePaiement==='Echelonne'){ dep.dateDebut=data.dateDebut; dep.dateFin=data.dateFin; dep.mensualitesPayees=0; }
      else if(data.modePaiement==='Previsionnelle'){ dep.priorite=data.priorite; }
      else{ dep.date=data.date; }
      state.depenses.push(dep); await persist(); await render(); toast(data.modePaiement==='Previsionnelle' ? 'Dépense prévisionnelle ajoutée' : 'Dépense ajoutée'); },
      '<div id="depense-preview" class="field-note" style="margin-top:-8px;margin-bottom:14px;min-height:16px;"></div>');
      setTimeout(setupDepenseFormToggle, 0); break;
    case 'edit-depense': openModal('Modifier la dépense', depense_fields(), find(mine(state.depenses)), async (data)=>{
      const dep = find(mine(state.depenses));
      dep.libelle=data.libelle; dep.categorie=data.categorie; dep.compte=data.compte; dep.montant=data.montant; dep.modePaiement=data.modePaiement;
      if(data.modePaiement==='Echelonne'){ dep.dateDebut=data.dateDebut; dep.dateFin=data.dateFin; if(dep.mensualitesPayees===undefined) dep.mensualitesPayees=0; delete dep.date; delete dep.priorite; }
      else if(data.modePaiement==='Previsionnelle'){ dep.priorite=data.priorite; delete dep.date; delete dep.dateDebut; delete dep.dateFin; delete dep.mensualitesPayees; }
      else{ dep.date=data.date; delete dep.dateDebut; delete dep.dateFin; delete dep.mensualitesPayees; delete dep.priorite; }
      await persist(); await render(); toast(data.modePaiement==='Previsionnelle' ? 'Dépense mise à jour' : 'Dépense planifiée'); },
      '<div id="depense-preview" class="field-note" style="margin-top:-8px;margin-bottom:14px;min-height:16px;"></div>');
      setTimeout(setupDepenseFormToggle, 0); break;
    case 'del-depense': { const item=find(mine(state.depenses)); confirmDelete(item.libelle, async ()=>{ state.depenses = state.depenses.filter(x=>x.id!==id); await persist(); await render(); toast('Dépense supprimée'); }); break; }
    case 'goto-depenses': currentView = 'depenses'; await render(); break;

    /* Échéances (vue calculée) : marquage manuel des mensualités payées */
    case 'ech-pay-one': { const dep = find(mine(state.depenses)); const nb = depenseNbMensualites(dep); dep.mensualitesPayees = Math.min((dep.mensualitesPayees||0)+1, nb); await persist(); await render(); toast('Mensualité marquée payée'); break; }
    case 'ech-pay-all': { const dep = find(mine(state.depenses)); dep.mensualitesPayees = depenseNbMensualites(dep); await persist(); await render(); toast('Marqué comme soldé'); break; }

    /* Objectifs */
    case 'add-obj': openModal('Ajouter un objectif', OBJ_FIELDS, {priorite:'Moyenne', dateDebut:new Date().toISOString().slice(0,10)}, async (data)=>{
      state.objectifs.push({id:uid(), ownerId:currentUser().id, ...data}); await persist(); await render(); toast('Objectif ajouté'); }); break;
    case 'edit-obj': openModal('Modifier l\u2019objectif', OBJ_FIELDS, find(mine(state.objectifs)), async (data)=>{
      const old = find(mine(state.objectifs)); const oldNom = old.nom;
      Object.assign(old, data);
      if(oldNom !== data.nom){ mine(state.versements).forEach(v=>{ if(v.objectifNom===oldNom) v.objectifNom = data.nom; }); }
      await persist(); await render(); toast('Objectif mis à jour'); }); break;
    case 'del-obj': { const item=find(mine(state.objectifs)); confirmDelete(item.nom, async ()=>{
      state.objectifs = state.objectifs.filter(x=>x.id!==id);
      state.versements = state.versements.filter(v=>!(v.objectifNom===item.nom && v.ownerId===item.ownerId));
      await persist(); await render(); toast('Objectif supprimé'); }); break; }

    /* Versements */
    case 'add-versement': openModal(`Verser vers « ${el.dataset.obj} »`, VERS_FIELDS_BASE, {date:new Date().toISOString().slice(0,10)}, async (data)=>{
      state.versements.push({id:uid(), ownerId:currentUser().id, objectifNom:el.dataset.obj, ...data}); await persist(); await render(); toast('Versement enregistré'); }); break;
    case 'del-versement': confirmDelete('ce versement', async ()=>{ state.versements = state.versements.filter(x=>x.id!==id); await persist(); await render(); toast('Versement supprimé'); }); break;

    /* Charges */
    case 'add-charge': openModal('Ajouter une charge', charge_fields(), {type:'Fixe', compte: jointPartner() ? 'Compte Joint' : 'Compte Perso'}, async (data)=>{
      state.charges.push({id:uid(), ownerId:currentUser().id, notes:'', ...data}); await persist(); await render(); toast('Charge ajoutée'); }); break;
    case 'edit-charge': openModal('Modifier la charge', charge_fields(), find(mine(state.charges)), async (data)=>{
      Object.assign(find(mine(state.charges)), data); await persist(); await render(); toast('Charge mise à jour'); }); break;
    case 'del-charge': { const item=find(mine(state.charges)); confirmDelete(item.categorie, async ()=>{ state.charges = state.charges.filter(x=>x.id!==id); await persist(); await render(); toast('Charge supprimée'); }); break; }

    /* Compte joint */
    case 'goto-parametres-comptes': currentView = 'parametres'; await render(); break;
    case 'refresh-joint': { const ok = await ghPullBudget(true); await render(); toast(ok ? 'Actualisé' : 'Rien de neuf'); break; }

    /* Auth / users */
    case 'logout': stopPolling(); clearSession(); await boot(); toast('Déconnecté'); break;
    case 'add-user': openModal('Ajouter un compte', userFieldsAdmin(null).concat([{key:'password', label:'Mot de passe', type:'password'}]), {role:'membre'}, async (data)=>{
      if(authState.users.some(u=>u.username===data.username.trim().toLowerCase())){ toast('Cet identifiant existe déjà'); return false; }
      const salt = randomSalt();
      const passwordHash = await hashPassword(data.password||'changeme', salt);
      authState.users.push({id:uid(), username:data.username.trim().toLowerCase(), displayName:data.displayName, role:data.role, jointWith:null, salt, passwordHash});
      await persistAuth(); await render(); toast('Compte créé'); }); break;
    case 'edit-user': {
      const u = find(authState.users);
      const fields = (isAdmin() ? userFieldsAdmin(u.id) : userFieldsSelf(u.id)).concat([{key:'password', label:'Nouveau mot de passe (optionnel)', type:'password'}]);
      openModal('Modifier le compte', fields, u, async (data)=>{
        u.displayName = data.displayName;
        if(isAdmin()){ u.username = (data.username||u.username).trim().toLowerCase(); u.role = data.role||u.role; }
        if(data.password){ u.salt = randomSalt(); u.passwordHash = await hashPassword(data.password, u.salt); }
        await persistAuth(); await render(); toast('Compte mis à jour'); }); break; }
    case 'del-user': { const u=find(authState.users); if(u.role==='admin' && authState.users.filter(x=>x.role==='admin').length<=1) return toast('Impossible de supprimer le dernier admin');
      confirmDelete(u.displayName, async ()=>{
        // Nettoyage : si quelqu'un avait un compte joint actif avec ce compte, on le libère.
        const partner = authState.users.find(x=>x.jointWith===u.id);
        if(partner) partner.jointWith = null;
        authState.users = authState.users.filter(x=>x.id!==id);
        socialState.jointRequests = socialState.jointRequests.filter(r=>r.fromId!==id && r.toId!==id);
        socialState.accountRequests = socialState.accountRequests.filter(r=>r.fromId!==id);
        wipeUserData(id);
        await Promise.all([persistAuth(), persistSocial(), persist()]); await render(); toast('Compte et données supprimés'); }); break; }

    /* Comptes : export ciblé et purge de données par l'admin */
    case 'export-user-data': exportUserData(id); toast('Export téléchargé'); break;
    case 'wipe-user-data': { const u=find(authState.users); confirmDelete(`les données de ${u.displayName}`, async ()=>{
        wipeUserData(id);
        // Vider les données doit aussi faire quitter le compte joint (les lignes
        // taguées "Compte Joint" de cette personne disparaissent, la relation n'a
        // donc plus de sens et resterait sinon une référence fantôme).
        const hadPartner = !!u.jointWith;
        if(u.jointWith){
          const partner = authState.users.find(x=>x.id===u.jointWith);
          if(partner) partner.jointWith = null;
          u.jointWith = null;
          await persistAuth();
        }
        socialState.expenseDeleteRequests = socialState.expenseDeleteRequests.filter(r=>r.fromId!==id && r.toId!==id);
        await persistSocial();
        await persist(); await render(); toast(hadPartner ? 'Données vidées et compte joint quitté' : 'Données vidées'); }); break; }

    /* Comptes : demandes des membres (export / suppression) */
    case 'request-export': {
      const me = currentUser();
      if(myPendingAccountRequest('export')) return toast('Déjà demandé, en attente.');
      socialState.accountRequests.push({id:uid(), fromId:me.id, type:'export', status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande envoyée à un administrateur'); break; }
    case 'request-reset-data': {
      const me = currentUser();
      if(myPendingAccountRequest('reset')) return toast('Déjà demandé, en attente.');
      socialState.accountRequests.push({id:uid(), fromId:me.id, type:'reset', status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande envoyée à un administrateur'); break; }
    case 'request-delete-account': {
      const me = currentUser();
      if(myPendingAccountRequest('delete')) return toast('Déjà demandé, en attente.');
      socialState.accountRequests.push({id:uid(), fromId:me.id, type:'delete', status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande envoyée à un administrateur'); break; }
    case 'approve-account-request': {
      const req = socialState.accountRequests.find(r=>r.id===id);
      if(!req) break;
      const u = authState.users.find(x=>x.id===req.fromId);
      if(req.type==='export'){
        // On n'exporte plus directement côté admin : on approuve, et c'est la
        // personne concernée qui télécharge elle-même, une seule fois.
        req.status='approved'; await persistSocial(); await render(); renderNotifPanel(); toast('Demande approuvée — la personne peut maintenant télécharger ses données.'); break;
      }
      if(req.type==='reset'){
        // "Reset" : on vide les données mais on garde le compte (identifiants intacts).
        confirmDelete(u ? `les données de ${u.displayName} (demande approuvée)` : 'ces données', async ()=>{
          if(u){
            wipeUserData(u.id);
            if(u.jointWith){
              const partner = authState.users.find(x=>x.id===u.jointWith);
              if(partner) partner.jointWith = null;
              u.jointWith = null;
              await persistAuth();
            }
          }
          req.status='done';
          socialState.accountRequests = socialState.accountRequests.filter(r=>r.id!==req.id);
          await Promise.all([persistSocial(), persist()]); await render(); renderNotifPanel(); toast('Données réinitialisées'); });
        break;
      }
      // type 'delete' : on redemande une confirmation explicite avant d'agir, c'est irréversible
      confirmDelete(u ? `le compte de ${u.displayName} (demande approuvée)` : 'ce compte', async ()=>{
        if(u){
          const partner = authState.users.find(x=>x.jointWith===u.id);
          if(partner) partner.jointWith = null;
          authState.users = authState.users.filter(x=>x.id!==u.id);
          socialState.jointRequests = socialState.jointRequests.filter(r=>r.fromId!==u.id && r.toId!==u.id);
          wipeUserData(u.id);
        }
        req.status='done';
        socialState.accountRequests = socialState.accountRequests.filter(r=>r.id!==req.id);
        await Promise.all([persistAuth(), persistSocial(), persist()]); await render(); renderNotifPanel(); toast('Compte supprimé'); });
      break; }
    case 'decline-account-request': {
      const req = socialState.accountRequests.find(r=>r.id===id);
      if(req) req.status='declined';
      await persistSocial(); await render(); renderNotifPanel(); toast('Demande refusée'); break; }
    case 'download-my-export': {
      const req = myApprovedExportRequest();
      if(!req) break;
      exportUserData(currentUser().id);
      socialState.accountRequests = socialState.accountRequests.filter(r=>r.id!==req.id); // usage unique : la demande disparaît après téléchargement
      await persistSocial(); await render(); renderNotifPanel(); toast('Téléchargement effectué'); break; }

    /* Compte joint : demande de suppression d'une ligne appartenant au/à la partenaire */
    case 'request-delete-expense': {
      const itemId = el.dataset.itemId, itemType = el.dataset.itemType, itemLabel = el.dataset.itemLabel;
      const partner = jointPartner();
      if(!partner) break;
      if(existingExpenseDeleteRequest(itemId)) return toast('Une demande est déjà en attente pour cette ligne.');
      socialState.expenseDeleteRequests.push({id:uid(), fromId:currentUser().id, toId:partner.id, itemType, itemId, itemLabel, status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande de suppression envoyée'); break; }
    case 'approve-expense-delete': {
      const req = socialState.expenseDeleteRequests.find(r=>r.id===id);
      if(!req) break;
      const arr = itemArrayFor(req.itemType);
      const idx = arr.findIndex(x=>x.id===req.itemId);
      if(idx>=0) arr.splice(idx,1);
      req.status='done';
      socialState.expenseDeleteRequests = socialState.expenseDeleteRequests.filter(r=>r.id!==req.id);
      await Promise.all([persist(), persistSocial()]); await render(); renderNotifPanel(); toast('Ligne supprimée'); break; }
    case 'decline-expense-delete': {
      const req = socialState.expenseDeleteRequests.find(r=>r.id===id);
      if(req) req.status='declined';
      await persistSocial(); await render(); renderNotifPanel(); toast('Demande refusée'); break; }

    /* Compte joint : demandes */
    case 'send-joint-request': {
      const me = currentUser();
      if(me.jointWith) return toast('Tu as déjà un compte joint actif — quitte-le avant d\'en proposer un autre.');
      const toId = el.dataset.to;
      const target = authState.users.find(u=>u.id===toId);
      if(target && target.jointWith) return toast(`${target.displayName} a déjà un compte joint actif avec quelqu'un d'autre.`);
      if(socialState.jointRequests.some(r=>r.fromId===me.id && r.toId===toId && r.status==='pending')) return toast('Demande déjà envoyée');
      socialState.jointRequests.push({id:uid(), fromId:me.id, toId, status:'pending', createdAt:new Date().toISOString()});
      await persistSocial(); await render(); toast('Demande envoyée'); break; }
    case 'cancel-joint-request':
      socialState.jointRequests = socialState.jointRequests.filter(r=>r.id!==id);
      await persistSocial(); await render(); toast('Demande annulée'); break;
    case 'accept-joint-request': {
      const req = socialState.jointRequests.find(r=>r.id===id);
      if(!req) break;
      const me = currentUser();
      if(me.jointWith){ toast('Tu as déjà un compte joint actif.'); break; }
      const other = authState.users.find(u=>u.id===req.fromId);
      if(other && other.jointWith){ req.status='declined'; await persistSocial(); await render(); renderNotifPanel(); toast(`${other.displayName} a déjà rejoint un autre compte joint entre-temps.`); break; }
      req.status = 'accepted';
      me.jointWith = req.fromId; if(other) other.jointWith = me.id;
      await persistAuth(); await persistSocial(); await render(); renderNotifPanel(); toast('Compte joint accepté'); break; }
    case 'decline-joint-request': {
      const req = socialState.jointRequests.find(r=>r.id===id);
      if(req) req.status = 'declined';
      await persistSocial(); await render(); renderNotifPanel(); toast('Demande refusée'); break; }
    case 'break-joint': confirmDelete('votre compte joint', async ()=>{
      const me = currentUser(); const partner = authState.users.find(u=>u.id===me.jointWith);
      me.jointWith = null; if(partner) partner.jointWith = null;
      socialState.jointRequests = socialState.jointRequests.filter(r=>!((r.fromId===me.id||r.toId===me.id) && r.status==='accepted'));
      socialState.expenseDeleteRequests = socialState.expenseDeleteRequests.filter(r=>!(r.fromId===me.id||r.toId===me.id));
      await persistAuth(); await persistSocial(); await render(); toast('Compte joint rompu'); }); break;

    /* Messagerie */
    case 'send-message': {
      const input = document.getElementById('msg-input');
      const text = input ? input.value.trim() : '';
      if(!text) break;
      const partner = jointPartner(); if(!partner) break;
      socialState.messages.push({id:uid(), fromId:currentUser().id, toId:partner.id, text, createdAt:new Date().toISOString(), readBy:[currentUser().id]});
      await persistSocial(); await render(); break; }

    /* Notifications */
    case 'toggle-notif-panel': toggleNotifPanel(); break;
    case 'enable-browser-notif': await enableBrowserNotifications(); await render(); break;

    /* Synchronisation GitHub */
    case 'gh-connect': {
      const owner = document.getElementById('gh-owner').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();
      if(!owner || !repo || !token) return toast('Remplis les 3 champs');
      try{
        await ghTestAndConnect(owner, repo, token);
        await ghPush(); // crée le fichier avec les données actuelles si le dépôt était vide
        await render(); toast('GitHub connecté');
      }catch(e){ toast('Connexion impossible — vérifie les informations'); }
      break; }
    case 'gh-sync-now': { const ok = await ghPull(); await ghPush(); await render(); toast(ok!==false ? 'Synchronisé' : 'Synchronisé (nouveau fichier créé)'); break; }
    case 'gh-disconnect': ghClearConfig(); await render(); break;
    case 'export-data': exportData(); break;
    case 'import-data': document.getElementById('import-file-input').click(); break;

    /* Assistant Claude */
    case 'save-claude-key': { const v = document.getElementById('claude-key-input').value.trim(); if(!v) return; localStorage.setItem('claude_api_key', v); updateFab(); await render(); toast('Assistant activé'); break; }
    case 'remove-claude-key': localStorage.removeItem('claude_api_key'); updateFab(); await render(); toast('Clé retirée'); break;
  }
}

/* ============================== AUTH ============================== */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pass, salt){
  return sha256(salt + ':' + pass);
}
const REMEMBER_DAYS = 15;
function getSession(){
  // Session de l'onglet en cours (par défaut, ne survit pas à la fermeture du navigateur)
  try{
    const raw = sessionStorage.getItem('budget_session');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // "Rester connecté" — persiste jusqu'à 15 jours, vérifié à chaque ouverture
  try{
    const raw = localStorage.getItem('budget_session_remember');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.expiresAt && parsed.expiresAt > Date.now()) return {userId: parsed.userId};
      localStorage.removeItem('budget_session_remember'); // expiré
    }
  }catch(e){}
  return null;
}
function setSession(userId, remember){
  try{ sessionStorage.removeItem('budget_session'); }catch(e){}
  try{ localStorage.removeItem('budget_session_remember'); }catch(e){}
  if(remember){
    try{ localStorage.setItem('budget_session_remember', JSON.stringify({userId, expiresAt: Date.now() + REMEMBER_DAYS*24*60*60*1000})); }catch(e){}
  } else {
    try{ sessionStorage.setItem('budget_session', JSON.stringify({userId})); }catch(e){}
  }
}
function clearSession(){
  try{ sessionStorage.removeItem('budget_session'); }catch(e){}
  try{ localStorage.removeItem('budget_session_remember'); }catch(e){}
  try{ localStorage.removeItem('budget_session'); }catch(e){} // ancienne clé (avant cette mise à jour)
}
function currentUser(){ const s = getSession(); return s ? authState.users.find(u=>u.id===s.userId) : null; }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

async function renderAuthGate(){
  const root = document.getElementById('auth-root');
  const shell = document.getElementById('shell');
  const session = getSession();
  const loggedIn = session && authState.users.some(u=>u.id===session.userId);
  if(loggedIn){
    root.style.display='none'; root.innerHTML='';
    shell.style.display='';
    return true;
  }
  shell.style.display='none';
  root.style.display='flex';
  if(authState.users.length===0){ renderSetupScreen(); } else { renderLoginScreen(); }
  return false;
}

function renderLoginScreen(){
  const root = document.getElementById('auth-root');
  root.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand"><div class="brand-mark">${icon('logo')}</div><div><div class="brand-name">Solde</div></div></div>
      <div class="auth-title">Connexion</div>
      <div class="auth-sub">Accède à ton budget partagé.</div>
      <div id="auth-error-slot"></div>
      <form id="login-form">
        <div class="field"><label>Identifiant</label><input id="li-username" type="text" required autocomplete="username"></div>
        <div class="field"><label>Mot de passe</label><div class="pw-wrap"><input id="li-pass" type="password" required autocomplete="current-password"><button type="button" class="pw-toggle" data-toggle-pw="li-pass">${icon('eye')}</button></div></div>
        <div class="field" style="display:flex;align-items:center;gap:9px;"><input id="li-remember" type="checkbox" style="width:16px;height:16px;accent-color:#FFFFFF;"><label style="margin:0;font-size:13px;color:var(--text);">Rester connecté (${REMEMBER_DAYS} jours)</label></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">${icon('check')}Se connecter</button>
      </form>
    </div>`;
  document.getElementById('login-form').onsubmit = async (e)=>{
    e.preventDefault();
    const username = document.getElementById('li-username').value.trim().toLowerCase();
    const pass = document.getElementById('li-pass').value;
    const remember = document.getElementById('li-remember').checked;
    const user = authState.users.find(u=>u.username===username);
    if(!user) return authError('Identifiant ou mot de passe incorrect.');
    // Rétrocompatibilité : les comptes créés avant l'ajout du sel n'en ont pas.
    const hash = user.salt ? await hashPassword(pass, user.salt) : await sha256(pass);
    if(hash !== user.passwordHash) return authError('Identifiant ou mot de passe incorrect.');
    if(!user.salt){ user.salt = randomSalt(); user.passwordHash = await hashPassword(pass, user.salt); await persistAuth(); }
    setSession(user.id, remember);
    await boot();
  };
}
function authError(msg){
  const slot = document.getElementById('auth-error-slot');
  if(slot) slot.innerHTML = `<div class="auth-error">${msg}</div>`;
}

/* ============================== NETTOYAGE SOCIAL (fusion sûre lors des synchros) ============================== */
function mergeSocial(local, remote){
  const byId = (arr)=>{ const m=new Map(); (arr||[]).forEach(x=>m.set(x.id,x)); return m; };
  const mReq = byId(local.jointRequests), mMsg = byId(local.messages), mAcc = byId(local.accountRequests), mExp = byId(local.expenseDeleteRequests);
  (remote.jointRequests||[]).forEach(r=>{
    const existing = mReq.get(r.id);
    // le statut le plus "avancé" gagne (une réponse locale ne doit pas être écrasée par un pending distant obsolète)
    if(!existing || (r.status!=='pending')) mReq.set(r.id, r);
  });
  (remote.messages||[]).forEach(m=>{ if(!mMsg.has(m.id)) mMsg.set(m.id, m); });
  (remote.accountRequests||[]).forEach(r=>{
    const existing = mAcc.get(r.id);
    if(!existing || (r.status!=='pending')) mAcc.set(r.id, r);
  });
  (remote.expenseDeleteRequests||[]).forEach(r=>{
    const existing = mExp.get(r.id);
    if(!existing || (r.status!=='pending')) mExp.set(r.id, r);
  });
  return { jointRequests: Array.from(mReq.values()), messages: Array.from(mMsg.values()), accountRequests: Array.from(mAcc.values()), expenseDeleteRequests: Array.from(mExp.values()) };
}
